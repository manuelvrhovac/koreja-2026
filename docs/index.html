"md": "Četvero ljudi, rane tridesete. Manuel, Goran i Lucija bili su u Japanu u travnju 2025.; Matej nikad nije bio u Aziji.\n\n### Što traže\n\n> *\"Ludi izlazak tipa escape room\"* — **Manuel**\n> *\"Doživjeti nešto što ne možemo naći u Europi\"* — **Goran**\n> *\"Novi doživljaji\"* — **Lucija**\n> *\"Puno pamtljivih doživljaja\"* — **Matej**\n\n### Pouke iz Japana\n\n1. **Rezati, ne gomilati** — kad je sve \"7–8\", na kraju se ne stigne ništa.\n2. **Slavno zna razočarati, a malo iznenaditi** — tržnice i arkade bile su bolje od očekivanog.\n3. **Rezervirati na vrijeme** — sve što je tražilo rezervaciju je propušteno.\n4. **Falilo je malo, neotkriveno selo.**\n\nOstale želje: bez golih kupki (Delpino, kupaći), tradicionalna kuća (hanok u Gyeongjuu), shopping se ne planira (Namdaemun usput).\n\n### Tvrda ograničenja\n\n| # | Pravilo | Izvor |\n|---|---|---|\n| 1 | 14 noći, 19.10. → 1.11. | letovi |\n| 2 | 5–6 noći u Seoulu | jednoglasno |\n| 3 | Maksimalno 4 selidbe | Q24 |\n| 4 | Minimalno 2 noći po bazi | odluka nakon Runde 1 |\n| 5 | Maksimalno ~3 h putovanja u jednom smjeru | Q21 |\n| 6 | Nula dana odmora | jednoglasno |\n| 7 | Hikerski strop ~4–5 h grupno | Lucijino koljeno |\n| 8 | Bez sirove ribe | 3–1 protiv |\n| 9 | Max 2–3 hrama ukupno | hram-burnout iz Japana |\n| 10 | Cijele dane se ne razdvajamo | odluka Manuel |\n\n### Što svima odgovara\n\n✅ **Visine** — sva četvorica \"nikakav problem\". Stakleni podovi, žičare, skywalkovi, sve prolazi.\n✅ **Rana jutra** — sva četvorica \"rado\". Polasci u 7:00 su u redu.\n✅ **Alergije** — nema ih.\n\n### Novac\n\nSrednje, uz 3–4 splurgea. **Odabrani: gozba od crvenih rakova u Sokchu · Yosukgung 1779 u Gyeongjuu** (krovni bazen Delpino je sada plan B). Seoul Sky je obavezan i ne računa se kao splurge."}, {"id": "dodatak-b", "title": "DODATAK B — PRIJEVOZ", "md": "| Datum | Dionica | Način | Trajanje | Cijena pp |\n|---|---|---|---|---|\n| 19.10. | ICN → Seoul Station | AREX express | 43 min | ~11 000 ₩ |\n| 21.10. | Seoul → Sokcho | Express bus | 2h10–2h20 | 16 400–34 600 ₩ |\n| 24.10. | Sokcho → Gangneung | Bus 06:55 (ili taksi ~08:15) | 1h00–1h37 | 10 800 ₩ |\n| 24.10. | Gangneung → Gyeongju | **KTX-Eum 752, direktno** 09:36 → 12:30 | 2h54 | 34 300 ₩ |\n| 24.10. | Stanica Gyeongju → Airbnb | GJS van ili 2 taksija | 18–22 min | 35–45 000 ₩ van / 15–17 000 ₩ auto |\n| 27.10. | Gyeongju → Busan Station | Taksi do stanice + KTX | ~20 min + ~30 min | 11 000–21 000 ₩ (+ taksi) |\n| 29.10. | Busan → Seoul | KTX | ~2h30 | od 60 000 ₩ |\n| 2.11. | Hongik Univ. → ICN T2 | AREX all-stop (express ovdje ne staje) · rezerva jumbo taksi | ~56 min | ~5 000 ₩ · taksi 65–100 000 ₩ + cestarina |\n\n**Korail Pass se ne isplati.** 3-dnevni 186 000 ₩, 5-dnevni 275 000 ₩; ne pokriva SRT, metro ni AREX. Prag isplativosti je 3+ dugih vožnji unutar prozora, a vaše su razvučene kroz dva tjedna s autobusnim dionicama između.\n\n**Aplikacije:** **Naver Map** primarno (engleski UI, točan javni prijevoz, opcija \"izbjegni stepenice\") · **Kakao Map** za praćenje autobusa i taksi · Papago za prijevod · Google Translate kamera za jelovnike. ⚠️ **Google Maps javni prijevoz i dalje nije pouzdan u Koreji.**"}, {"id": "dodatak-c", "title": "DODATAK C — USPUTNE STANICE PRI SELIDBAMA", "md": "Pet kandidata na četiri selidbe, poredani po tome koliko stvarno koštaju. **Prvi je gotovo besplatan, zadnji je upitan.**\n\n---\n\n## 🥇 GANGNEUNG · sub 24.10., na putu Sokcho → Gyeongju\n### **Ovo je jedini stop koji ne košta ništa u rutiranju — vi ondje ionako presjedate.**\n\nRuta 24.10. ide Sokcho → Gangneung busom (1h10), pa KTX-om dalje. **Dva do tri sata u Gangneungu su čista dobit**, jer je alternativa sjediti na kolodvoru.\n\n**Što ima:**\n- **Anmok Coffee Street** — Gangneung je neslužbena kavena prijestolnica Koreje, dom Terarose i drugih ozbiljnih pržionica. Kafići uz samu obalu, pogled na Istočno more. Ugodno i opušteno, ~2 h.\n- **Seongyojang** — velika plemićka hanok kuća u kojoj potomci i danas žive, s vrtom i ribnjakom. Nije selo nego jedna impresivna naseljena kuća. 45–60 min.\n- **Ojukheon** — rodna kuća učenjaka Yi I-ja i njegove majke Shin Saimdang, koja je **na novčanici od 50 000 wona**. Skromno ali autentično, 45–60 min.\n- **Arte Museum** — ⚠️ **Nije teamLab** — spektakl s jednim motivom (slap, val), bez interakcije i hodanja kroz vodu. **Kalibrirati očekivanja ili preskočiti.**\n\n**Preporuka:** Anmok kava + Seongyojang, ~2,5 h. Gangneung je 24.10. subota, pa će obala biti živa.\n\n⚠️ **Status 9.10.:** s direktnim KTX-Eumom 752 Gangneung se samo prolazi (bus → stanica). Pauza ovdje znači kasniji vlak **754 (14:56 → Gyeongju 17:44)** i gubitak popodneva u Gyeongjuu — **malo vjerojatan plan C**, vidi Dan 6.\n\n---\n\n## 🥈 CHUNCHEON · sri 21.10., na putu Seoul → Sokcho\n\nGrad u kojem je **izmišljen dakgalbi** — pikantna pržena piletina s kupusom, rižinim kolačićima i slatkim krumpirom, na velikoj tavi nasred stola. U Myeongdong-gilu ima cijela ulica restorana koji to rade desetljećima.\n\n**Kako:** ITX-Cheongchun iz Yongsana ili Cheongnyangnija do Chuncheona, **~1 h, 6 000–8 500 ₩** → ručak → intercity bus Chuncheon → Sokcho, **~2 h**.\n\n**Cijena:** ~4,5–5 h ukupno umjesto 2h20 direktno. **Dva dodatna sata za regionalno jelo na njegovom izvoru.**\n\n⚠️ **Nami Island je odavde 20 minuta i eksplicitno je izrezan** — privatni tematski park s lažnom putovnicom i maskotama. **Ne dati se uvući.**\n\n**Preporuka:** vrijedi samo ako ekipa hoće jesti kroz zemlju, a ne samo u gradovima. 21.10. je ionako lagan dan bez planinarenja — podnosi to.\n\n---\n\n## 🥉 TONGDOSA · uto 27.10., na putu Gyeongju → Busan\n\n**Jedan od Tri dragulja korejskog budizma** i vjerojatno najvažniji hram u zemlji koji nije na vašem popisu. Nalazi se u Yangsanu, **točno na koridoru Gyeongju–Busan.**\n\n**Posebnost:** Tongdosa predstavlja samog Bude jer čuva njegove relikvije — pa **u glavnoj dvorani nema kipa Bude.** Gledaš prema prozoru iza oltara, a iza njega je stupa s relikvijama. To je arhitektonski i konceptualno neobično i nije ista stvar kao još jedan hram.\n\n**Prilazna staza kroz borovu šumu duga je otprilike kilometar** i kraj listopada joj je najbolji trenutak.\n\n⚠️ **Kvaka:** pravilo je maksimalno 2–3 hrama, a Jogyesa, Bulguksa i Seokguram su već u planu — **Tongdosa bi bio četvrti.**\n\n**Preporuka:** samo ako Bulguksa i Seokguram prođu **bolje** nego što očekujete. Ako 26.10. navečer netko kaže \"dosta hramova\" — otpada bez rasprave.\n\n**WIP:** provjeriti spaja li se busom u jednom potezu Gyeongju → Tongdosa → Busan ili traži dva zasebna busa i taksi.\n\n---\n\n## ULSAN — DAEWANGAM ILI GANJEOLGOT · uto 27.10., alternativa Tongdosi\n\nAko je hram otpao a obala nije, isti transfer nudi dvije priobalne točke:\n\n- **Daewangam Park** — borov park na stijenama iznad mora, s kamenim lukom i mostom preko vode. Besplatno, ~1,5 h. Vezano uz legendu o podmorskoj grobnici kraljice, supruge kralja Munmua — što se lijepo naslanja na Silla kontekst iz Gyeongjua.\n- **Ganjeolgot** — **najistočnija točka kopnene Koreje**, svjetionik i mjesto gdje sunce izlazi prvo u zemlji. Besplatno, ~1 h.\n\n**Cijena:** oboje traži pravi detour s glavne ceste i taksi. **Realno dodaje 2–3 h transferu od jednog sata.**\n\n**Preporuka:** slabije od Tongdose po jedinstvenosti, ali bez hram-problema. I ⚠️ **imate Igidae isti dan popodne** — dvije obale u jednom danu je previše iste stvari.\n\n---\n\n## ⚪ DAEGU · čet 29.10., na putu Busan → Seoul — **vjerojatno ne**\n\nKTX iz Busana ionako prolazi kroz Daegu za ~40 min, pa je izlazak tehnički trivijalan.\n\n**Što ima:** **Seomun tržnica** — jedna od najvećih tradicionalnih tržnica u zemlji, s jakom večernjom scenom hrane. Vrijedi 1–2 h ako se ionako prolazi kroz Daegu.\n\n⚠️ **Zašto ipak ne:** **poanta Seomuna je noćna tržnica, a vaš vlak je u 9 ujutro.** Došli biste u 10, kad tržnica radi ali bez onoga zbog čega vrijedi. A pomicanje vlaka na popodne znači dolazak u Seoul u mraku i **gubitak Gyeongbokgunga i escape rooma** — dvije stvari koje su tog dana fiksne.\n\n**Preporuka:** ne.\n\n---\n\n## SAŽETAK\n\n| Stanica | Dan | Dodatno vrijeme | Verdikt |\n|---|---|---|---|\n| **Gangneung** | 24.10. | +2,5 h na dan koji je ionako putovanje | ✅ **Napraviti** |\n| **Chuncheon** | 21.10. | +2,5 h na lagan dan | ✅ Ako se hoće jesti kroz zemlju |\n| **Tongdosa** | 27.10. | +2–3 h | 🟡 Samo ako hramova nije dosta |\n| **Ulsan obala** | 27.10. | +2–3 h | 🟡 Slabije, i duplira Igidae |\n| **Daegu** | 29.10. | razbija fiksni dan | ❌ Ne |"}, {"id": "dodatak-d", "title": "DODATAK D — ŠTO JE IZREZANO I ZAŠTO", "md": "| Što | Slava | Zašto van |\n|---|---|---|\n| **Nami Island** | 9/10 | Privatni tematski park s lažnom putovnicom i maskotama. Cijeli dan za drvorede |\n| **Gamcheon Culture Village** | 7/10 | 90 min foto-šetnje, puno stepenica i gužve. Huinnyeoul je tiša verzija |\n| **Everland** | 8/10 | Odbijeno |\n| **DMZ standardna tura** | 9/10 | Odbijeno — JSA više nije što je bio: u plavu baraku se ne ulazi, gleda se s krova Freedom Housea |\n| **Golgulsa templestay** | 3/10 | Izbačeno |\n| **Hanbok rental** | 8/10 | Ne zanima ekipu |\n| **Busan X the Sky** | — | Seoul Sky je bolji, drugi vidikovac ne treba |\n| **Blue Line Sky Capsule** | — | Rezervacijom uvjetovano, red, pastelno, fotografirano do smrti |\n| **Haeundae plaža** | — | Izvan sezone |\n| **Lotte World** | 8/10 | Zadržano samo kao kišna rezerva |\n| **63 Building** | 5/10 | Zastarjelo. Jedan vidikovac je dosta i neka bude visoki |\n| **Yongsan elektronika** | — | Tržnica je propala i postala anime/gaming hub |\n| **Jeju** | — | 4 dana minimum, međunarodna vozačka, duplira planinski budžet |\n| **Boseong, Damyang, Naganeupseong, Jirisan** | — | Svi padaju na pravilu od 3 h putovanja |\n| **Haeinsa** | 6/10 | **Ploče se zapravo ne vide** — gledaš skladište izvana. Traži detour preko Daegua |\n| **Seorak Waterpia / Aquafield** | — | Vodeni parkovi za sve uzraste. Zamijenjeni Delpinom |"}, {"id": "dodatak-e", "title": "DODATAK E — OTVORENA PITANJA I WIP", "md": "### Provjeriti u rujnu / listopadu\n1. ✅ **Riješeno 19.9.:** KBO regularna sezona je stvarno završila 7.10.2026., doigravanje kreće ~trećeg tjedna listopada, a Korejska serija bi prvi put od 2023. mogla potrajati do studenog — dakle poklapanje s 29.10.–2.11. je moguće, ali **datumi konkretnih utakmica i dalje nisu potvrđeni. Provjeriti ~30.10.**, kako je već planirano. Vidi [KorejaSeulDogadanja.md](KorejaSeulDogadanja.md).\n2. **K-ETA izuzeće** — trenutno do 31.12.2026., ali formalno \"privremeno\".\n3. ✅ **Riješeno 19.9.:** Festival srebrne trave na Haneul Parku 2026. ide **18.–24.10.** — pada dok ste u Sokchu/na putu, fizički nedostupno. Otpisano.\n4. ✅ **Riješeno 19.9.:** Banpo dugina fontana radi **cijelu sezonu do 31.10.2026.** — dakle pokriva gotovo cijeli seulski boravak (osim zadnja dva dana). Nije vezano za konkretan datum, može se ubaciti u bilo koju slobodnu večer dok traje sezona. 💡 Nije obavezno — vidi [KorejaSeulDogadanja.md](KorejaSeulDogadanja.md).\n\n### Prijevoz\n5. ✅ **Riješeno 9.10.:** direktni vlak KTX-Eum Gangneung → Gyeongju vozi od 30.12.2025. (752: 09:36 → 12:30). Subotnja satnica busa Sokcho → Gangneung **WIP**.\n6. ⚠️ **Kobus / TxBus prihvaćanje stranih kartica** — uvedeno tek kolovoz/rujan 2026. **Testirati rano.**\n7. **Zadnji KTX Busan → Seoul** — navodno ~22:40, neprovjereno za 2026.\n\n### Pristup i pravila\n8. **Dan zatvaranja Nacionalnog muzeja Koreje.**\n9. **Jesenje vrijeme ulaza na staze Seoraksana** — u jesen se rez pomiče ranije.\n10. **Zadnji ulaz u Gyeongbokgung u listopadu.**\n11. ✅ **Anapji:** 09:00–22:00, karte do 21:30 (UV).\n12. ☎️ **Sono Calm Delpino:** primaju li negoste, kolika je temperatura vode, potvrditi pet–sub 09–19.\n\n### Odluke koje čekaju\n13. **Šamanistička tura na Inwangsanu, da ili ne** — treba odluku do ~25.10.\n14. **Screen golf ili Mullae-dong za rođendan** — i ako screen golf, koji lokal.\n15. **Ide li se po vodiča za jedan grad** — u planu ga trenutno nema.\n16. **Tko je vlasnik svakog retka iz Dodatka A.**\n\n### Strukturne slabosti koje ostaju\n- ✅ **24.10. više nije šest sati putovanja** — direktni vlak, u Gyeongjuu u 12:30.\n- **Seoul II je gradski, ne izletnički.** Jedan dnevni izlet (Suwon), tri seulska dana. Veliki doživljaji su rođendanska večer, Seoraksan i escape room.\n- **Nema \"dubokog\" sadržaja bez templestaya.** Gyeongju je razgledavanje. Šamanistička tura je jedina preostala stavka te vrste.\n- **Bejzbola možda neće biti.** Ako se ne igra, finale 1.11. je krovni bar.\n\n### 💡 Novi nalaz, 19.9. — gradski kalendar Seoula (nije obaveza, vidi [KorejaSeulDogadanja.md](KorejaSeulDogadanja.md))\n- **Marvel drone show, Ttukseom, sub 31.10. u 20:30–20:45, besplatno** — pada baš na vašu Noć vještica večer, ista metro linija kao Hongdae. Ubačeno kao prijedlog u taj dan.\n- **Provjereno i otpisano jer ne pada u termin puta:** K-Royal Culture Festival na palačama (7.–11.10.), Seoul International Fireworks Festival (premješten na 5.9.), Seoul Lantern Festival na Cheonggyecheonu (2026. datumi još neobjavljeni, vjerojatno počinje tek sredinom studenog — nakon odlaska)."}], "bases": "**Baze:** Seoul 2 → Sokcho 3 → Gyeongju 3 → Busan 2 → Seoul 4 · *4 selidbe, 14 noći*", "smjestaj": "✅ **Sve rezervirano.** Svaka selidba: check-out 11:00, check-in 15:00–16:00. Detalji (adrese za taksi, metro, upute) su u Dijelu 3 na dan dolaska i u `HOTELS.md`.\n\n| Baza | Smještaj | Datumi | Noći | Check-in | Kvart · najbliže | Karta |\n|---|---|---|---|---|---|---|\n| Seoul I | Trosobni apartman #101 | 19.–21.10. | 2 | od 16:00 | Chungsin-dong (Jongno) · Dongdaemun L1/L4 ~600 m · Gwangjang ~1 km | [Naver](nmap://place?lat=37.576026&lng=127.006617&name=Seoul%20I%20Apartment&appname=com.sokogeo) |\n| Sokcho | Hotel the Blue Terra | 21.–24.10. | 3 | od 15:00 | Joyang-dong, na plaži · Express terminal ~670 m · bus 7/7-1 preko ceste | [Naver](nmap://place?lat=38.184825&lng=128.601490&name=Hotel%20the%20Blue%20Terra&appname=com.sokogeo) |\n| Gyeongju | Airbnb (h /* ---------- tiny markdown ---------- */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
    u = u.replace(/&amp;/g, '&');
    if (/^https?:/.test(u)) return `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>`;
    if (/^nmap:/.test(u)) return `<a class="map" href="${esc(u)}">📍 ${t}</a>`;
    return `<span>${t}</span>`;
  });
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*(?!\w)/g, '$1<em>$2</em>');
  s = s.replace(/\b(WIP|UV)\b/g, '<span class="wip">$1</span>');
  return s;
}
function calloutClass(t) {
  if (/^⚠️/.test(t)) return 'c-warn';
  if (/^(⏰|🔴)/.test(t)) return 'c-decide';
  if (/^✅/.test(t)) return 'c-ok';
  if (/^💡/.test(t)) return 'c-tip';
  return '';
}
const splitRow = l => l.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
function table(lines) {
  const head = splitRow(lines[0]);
  const body = lines.slice(2).map(splitRow);
  if (head.includes('⏱') && head.includes('🦵')) {
    const ci = { t: head.indexOf('⏱'), w: head.indexOf('Vrijeme'), k: head.indexOf('🦵') };
    return `<div class="xlist">${body.map(r => `<div class="xitem"><div class="xt">${inline(r[0])}</div><div class="xd">${inline(r[1])}</div><div class="chips">${
      [r[ci.t] && '⏱ ' + r[ci.t], r[ci.w], r[ci.k]].filter(Boolean).map(c => `<span class="chip">${inline(c)}</span>`).join('')}</div></div>`).join('')}</div>`;
  }
  if (head.every(h => !h)) {
    if (head.length === 2) return `<div class="kv">${body.map(r => `<div class="k">${inline(r[0])}</div><div>${inline(r.slice(1).join(' | '))}</div>`).join('')}</div>`;
  }
  const stack = head.length > 2 ? ' stackable' : '';
  return `<div class="tbl${stack}"><table><thead><tr>${head.map(h => `<th>${inline(h)}</th>`).join('')}</tr></thead><tbody>${
    body.map(r => `<tr>${r.map((c, i) => `<td data-l="${esc(head[i] || '')}">${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function list(lines) {
  // nested by indentation; each item may carry continuation lines
  const root = { kids: [], ordered: false }; const stack = [{ ind: -1, node: root }];
  for (const l of lines) {
    const m = l.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (!m) { const top = stack[stack.length - 1].node; const last = top.kids[top.kids.length - 1]; if (last) last.text += '<br>' + inline(l.trim()); continue; }
    const ind = m[1].length;
    while (stack.length > 1 && ind <= stack[stack.length - 1].ind) stack.pop();
    const parent = stack[stack.length - 1].node;
    const item = { text: inline(m[3]), kids: [], ordered: /\d/.test(m[2]) };
    parent.kids.push(item); parent.ordered = parent.ordered || item.ordered;
    stack.push({ ind, node: item });
  }
  const r = n => n.kids.length ? `<${n.ordered ? 'ol' : 'ul'}>${n.kids.map(k => `<li>${k.text}${r(k)}</li>`).join('')}</${n.ordered ? 'ol' : 'ul'}>` : '';

}
function md(src) {
  if (!src) return '';
  const L = src.split('\n'); let out = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^-{3,}$/.test(l.trim())) { out += '<hr>'; i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const lvl = h[1].length <= 2 ? 3 : 4; out += `<h${lvl}>${inline(h[2])}</h${lvl}>`; i++; continue; }
    if (/^\|/.test(l)) { const t = []; while (i < L.length && /^\|/.test(L[i])) t.push(L[i++]); out += table(t); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const t = [];
      while (i < L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s+\S/.test(L[i]) && t.length))) t.push(L[i++]);
      out += list(t); continue;
    }
    if (/^>/.test(l)) { const t = []; while (i < L.length && /^>/.test(L[i])) t.push(L[i++].replace(/^>\s?/, '')); out += `<blockquote>${t.map(inline).join('<br>')}</blockquote>`; continue; }
    const p = [];
    while (i < L.length && L[i].trim() && !/^(\||#{1,4}\s|>|\s*([-*]|\d+\.)\s+|-{3,}$)/.test(L[i])) p.push(L[i++]);
    const cls = calloutClass(p[0].trim());
    out += `<p${cls ? ` class="${cls}"` : ''}>${p.map(inline).join('<br>')}</p>`;
  }

}

function shortMeta(m) {

  const timeSoft = !/\d/.test(r.time);
  const inner = `<span class="time${timeSoft ? ' soft' : ''}">${inline(r.time.replace(/^~/, ''))}</span>
    <span class="txt"><p>${inline(r.text)}</p>${chips.length ? `<span class="chips">${chips.join('')}</span>` : ''}</span>
    <span class="chev" aria-hidden="true">${hasDetail ? '›' : ''}</span>`;
  const row = hasDetail
    ? `<button class="row" data-act="slot" data-key="${esc(key)}" aria-expanded="${open}">${inner}</button>`
    : `<div class="row">${inner}</div>`;
  const det = open ? `<div class="detail">
      <h3 class="dtitle">${inline(slot.title)}</h3>
      ${slot.meta.length ? `<div class="chips wrap">${slot.meta.map(m => `<span class="chip">${inline(m)}</span>`).join('')}</div>` : ''}
      ${slot.body ? `<div class="md">${md(slot.body)}</div>` : ''}
      ${slotAlts(d, slot, key)}
      ${slot.after ? `<div class="md">${md(slot.after)}</div>` : ''}
    </div>` : '';
  return `<li class="${open ? 'open' : ''}${opts.gone ? ' gone' : ''}">${row}${det}</li>`;
}
function planCard(d, p) {
  const det = p.detail;
  return `<li class="plancard"><div class="pcard">
    <div class="ph"><b>${inline(p.label)}</b>${det && det.meta.length ? `<span class="chips">${det.meta.map(m => `<span class="chip">${inline(m)}</span>`).join('')}</span>` : ''}</div>
    ${det ? `<div class="md"><p><strong>${inline(det.title)}</strong></p></div>` : ''}
    ${p.summary ? `<div class="md"><p>${inline(p.summary)}</p></div>` : ''}
    ${det ? `<div class="md">${md(det.md)}</div>` : ''}
    ${det && det.alts.length ? slotAlts(d, { alts: det.alts, altNotes: [] }, 'plan-' + p.label) : ''}
    ${det && det.after ? `<div class="md">${md(det.after)}</div>` : ''}
  </div></li>`;
}
function partOf(key) {
  const m = key.match(/^(\d\d):/); if (!m) return null;
  const h = +m[1]; return h < 12 ? 'Jutro' : h < 17 ? 'Popodne' : 'Večer';
}
function timeline(d) {
  const pv = planView[d.date] || 0;
  const p = pv > 0 ? d.plans[pv - 1] : null;
  if (p && p.rows) return `<ol class="tl">${p.rows.map((r, i) => rowHTML(d, r, 'alt' + i)).join('')}</ol>`;
  const rep = p ? new Set(p.replaces) : null;
  let html = '', cardDone = false, part = null;
  d.rows.forEach((r, i) => {
    const key = 'r' + i + '-' + r.key;
    const gone = rep && rep.has(r.key);
    const pt = partOf(r.key);
    if (pt && pt !== part) { html += `<li class="part">${pt}</li>`; part = pt; }
    if (p && gone && !cardDone) { html += planCard(d, p); cardDone = true; }
    html += rowHTML(d, r, key, { gone });
  });
  if (p && !cardDone) html = planCard(d, p) + html;
  return `<ol class="tl">${html}</ol>`;
}
function triggers(src) {
  const items = src.split('\n').filter(l => /^- /.test(l)).map(l => l.slice(2));
  const rest = src.split('\n').filter(l => l.trim() && !/^- /.test(l)).join('\n');
  return `<ul class="trig">${items.map(t => {
    const m = t.match(/^\*\*(.+?)\s*→\*\*\s*(.*)$/);
    return m ? `<li><span class="if">${inline(m[1])} →</span><span>${inline(m[2])}</span></li>` : `<li><span></span><span>${inline(t)}</span></li>`;
  }).join('')}</ul>${rest ? `<div class="md">${md(rest)}</div>` : ''}`;
}
function decItem(x, link = '') {
  const done = !!(S.dec[x.id] || {}).done;
  return `<div class="item${done ? ' done' : ''}">
    <div class="top"><button class="check${done ? ' on' : ''}" data-act="dec" data-id="${x.id}" aria-pressed="${done}" aria-label="Riješeno" ${db && canWrite ? '' : 'disabled'}>✓</button>
      <div class="iw">${inline(x.what)}<div class="meta">${inline(x.day)}</div></div></div>
    <div class="md"><p><strong>Opcije:</strong> ${inline(x.options)}</p><p><strong>Što/kada:</strong> ${inline(x.todo)}</p></div>${link}
  </div>`;
}
function dayView() {
  const d = days[cur]; const dp = dayParts(d); const city = cityOf(d);
  const pv = planView[d.date] || 0; const pd = pickDoc(d);
  const topInfo = d.info.filter(x => x.top), restInfo = d.info.filter(x => !x.top);
  const cityData = D.cities[d.city] || {};
  const decs = D.decisions.filter(x => d.decisions.includes(x.id));
  const paras = d.intro ? d.intro.split(/\n\n+/) : [];
  const hot = paras.filter(x => /^(⏰|🔴)/.test(x.trim())), rest = paras.filter(x => !/^(⏰|🔴)/.test(x.trim()));
  const panels = {
    info: (d.transfer || d.stay) ? (d.transfer ? `<div class="callout transfer md">${md(d.transfer)}</div>` : '') + (d.stay ? `<div class="md">${md(d.stay)}</div>` : '') : '',
    upoz: hot.length ? hot.map(x => `<div class="callout decide md">${md(x)}</div>`).join('') : '',
    nap: (rest.length || topInfo.length) ? (rest.length ? `<div class="md">${md(rest.join('\n\n'))}</div>` : '') + topInfo.map(x => `<div class="md"><h4>${inline(x.title)}</h4>${md(x.md)}</div>`).join('') : '',
    odl: decs.length ? `<div class="list">${decs.map(decItem).join('')}</div>` : '',
  };
  const qdone = decs.filter(x => (S.dec[x.id] || {}).done).length;
  const qlabels = [['info', 'Info'], ['upoz', 'Upozorenja'], ['nap', 'Napomene'], ['odl', `Odluke${decs.length ? ` (${decs.length - qdone})` : ''}`]];
  if (qOpen && !panels[qOpen]) qOpen = null;
  let h = `<article style="--cc:${city.c}">
  <h2 class="dayline"><span class="dot"></span><span class="dn">Dan ${dayNo(cur)}</span><span class="dtt">${inline(dp.title)}</span></h2>
  <div class="qrow">${qlabels.map(([k, l]) => `<button data-act="q" data-k="${k}" aria-pressed="${qOpen === k}" ${panels[k] ? '' : 'disabled'}>${l}</button>`).join('')}</div>
  ${qOpen ? `<div class="qpanel stack">${panels[qOpen]}</div>` : ''}
  <div class="stack">`;
  if (d.plans.length) {
    const labels = ['Plan A · osnovni', ...d.plans.map(p => p.label)];
    h += `<div class="plans"><div class="seg" role="group">${labels.map((l, i) =>
      `<button data-act="plan" data-i="${i}" class="${i ? 'b' : ''}" aria-pressed="${pv === i}">${esc(l)}</button>`).join('')}</div></div>`;
  }
  h += `</div><div class="sect">Raspored</div>${timeline(d)}`;
  if (d.leftPlans3 && d.leftPlans3.length) d.leftPlans3.forEach(p => h += `<details class="fold"><summary>🅱️ ${inline(p.title)}</summary><div class="md">${md(p.md)}</div></details>`);
  if (restInfo.length) { h += `<div class="sect">Detalji dana</div><div class="stack">`; restInfo.forEach(x => h += `<details class="fold"${/Kontrolne/.test(x.title) ? ' open' : ''}><summary>${inline(x.title)}</summary><div class="md">${md(x.md)}</div></details>`); h += `</div>`; }
  if (d.triggers) h += `<div class="sect">🅱️ Ako se dogodi…</div>${triggers(d.triggers)}`;
  h += `<div class="sect">Grad</div><div class="stack">`;
  if (cityData.intro) h += `<details class="fold"><summary>O gradu · ${esc(city.short)}</summary><div class="md">${md(cityData.intro)}</div></details>`;
  if (cityData.extras) h += `<details class="fold"><summary>🧱 Dodatne opcije · ${esc(city.short)}</summary><div class="md">${md(cityData.extras.md)}</div></details>`;
  h += `</div>`;
  const prev = days[cur - 1], next = days[cur + 1];
  h += `<div class="pager">${prev ? `<button data-act="go" data-i="${cur - 1}"><small>← ${esc(dayParts(prev).wd)} ${esc(dayParts(prev).dt)}</small><span>${inline(dayParts(prev).title)}</span></button>` : '<span></span>'}
    ${next ? `<button data-act="go" data-i="${cur + 1}"><small>${esc(dayParts(next).wd)} ${esc(dayParts(next).dt)} →</small><span>${inline(dayParts(next).title)}</span></button>` : '<span></span>'}</div>`;
  return h + `</article>`;
}

/* ---------- other pages ---------- */
function pregled() {
  return `<section class="page pregled"><div class="hero"><img src="map.webp" alt="Karta Južne Koreje s bazama Seoul, Sokcho, Gyeongju i Busan te rutama između njih" width="872" height="1199"></div>
    <p class="hand">Pet gradova. Četiri selidbe. Jedna nezaboravna avantura.</p><h2>Pregled</h2><div class="md intro">${md(D.header.split('\n').filter(l => !/^#/.test(l)).join('\n'))}</div>
    <div class="sect">${inline(D.bases)}</div>
    <ul class="flash">${days.map((d, i) => { const dp = dayParts(d); const c = cityOf(d);
      return `<li style="--cc:${c.c}"><button data-act="go" data-i="${i}"><span class="fd">${dp.wd} ${dp.dt}<small>${c.short}</small></span><span class="ft">${d.flash ? inline(d.flash.text) : inline(dp.title)}</span></button></li>`; }).join('')}</ul>
    <div class="sect">Smještaj</div><div class="md">${md(D.smjestaj)}</div></section>`;
}
function roNote() { return `<div class="ro">Kvačice i imena pamte se samo u ovom pregledniku, ne dijele se s ekipom.</div>`; }
let decFilter = 'sve';
function odluke() {
  const all = D.decisions; const done = all.filter(x => (S.dec[x.id] || {}).done).length;
  const shown = all.filter(x => decFilter === 'sve' || (decFilter === 'otvoreno') !== !!(S.dec[x.id] || {}).done);
  return `<section class="page"><h2>Odluke</h2><div class="md intro">${md(D.decisionsIntro)}</div>${roNote()}
    <div class="progress"><span>${done}/${all.length} riješeno</span><span class="bar2"><i style="width:${all.length ? done / all.length * 100 : 0}%"></i></span></div>
    <div class="filters">${['sve', 'otvoreno', 'riješeno'].map(f => `<button data-act="decf" data-f="${f}" aria-pressed="${decFilter === f}">${f}</button>`).join('')}</div>
    <div class="list">${shown.map(x => { const i = x.date ? dayIdx(x.date) : -1;
      return decItem(x, i >= 0 ? `<button class="linkday" data-act="go" data-i="${i}">otvori dan →</button>` : ''); }).join('')}</div></section>`;
}
let resFilter = 'sve';
function rezervacije() {
  const all = D.reservations; const st = id => S.res[id] || {};
  const done = all.filter(x => st(x.id).done).length;
  const shown = all.filter(x => resFilter === 'sve' || (resFilter === 'otvoreno' ? !st(x.id).done : resFilter === 'bez imena' ? !st(x.id).who && !x.who : st(x.id).done));
  const badge = w => /🔴/.test(w) ? 'red' : /✅/.test(w) ? 'ok' : '';
  return `<section class="page"><h2>Rezervacije</h2><div class="md intro">${md(D.reservationsIntro)}</div>${roNote()}
    <div class="progress"><span>${done}/${all.length} gotovo</span><span class="bar2"><i style="width:${done / all.length * 100}%"></i></span></div>
    <div class="filters">${['sve', 'otvoreno', 'bez imena', 'gotovo'].map(f => `<button data-act="resf" data-f="${f}" aria-pressed="${resFilter === f}">${f}</button>`).join('')}</div>
    <div class="list">${shown.map(x => { const s = st(x.id); const dis = db && canWrite ? '' : 'disabled';
      return `<div class="item${s.done ? ' done' : ''}">
        <div class="top"><button class="check${s.done ? ' on' : ''}" data-act="res" data-id="${x.id}" aria-pressed="${!!s.done}" aria-label="Gotovo" ${dis}>✓</button>
          <div class="iw">${inline(x.what)}</div><span class="badge ${badge(x.when)}">${inline(x.when.replace(/\*\*/g, ''))}</span></div>
        <div class="md"><p>${inline(x.detail)}</p></div>
        <div class="who"><span class="lab">Tko:</span>${x.who && x.who !== '✅' ? `<span class="badge">${inline(x.who)}</span>` : ''}${PEOPLE.map(p => `<button class="${s.who === p ? 'on' : ''}" data-act="who" data-id="${x.id}" data-p="${p}" ${dis}>${p}</button>`).join('')}</div>
      </div>`; }).join('')}</div></section>`;
}
function info() {
  return `<section class="page"><h2>Info</h2><p class="intro">Tko smo, prijevoz, usputne stanice, što je izrezano i otvorena pitanja.</p><div class="stack">${
    D.info.map((x, i) => `<details class="fold"${i === 0 ? ' open' : ''}><summary>${inline(x.title)}</summary><div class="md">${md(x.md)}</div></details>`).join('')}</div></section>`;
}

/* ---------- shell ---------- */
const TABS = [['dani', 'Dani'], ['pregled', 'Pregled'], ['odluke', 'Odluke'], ['rezervacije', 'Rezervacije'], ['info', 'Info']];
function render() {
  const openDetails = [...document.querySelectorAll('#main details')].map(x => x.open);
  const decOpen = D.decisions.filter(x => !(S.dec[x.id] || {}).done).length;
  const resOpen = D.reservations.filter(x => !(S.res[x.id] || {}).done).length;
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-t="${k}" aria-selected="${tab === k}">${l}${k === 'odluke' ? `<span class="n">${decOpen}</span>` : k === 'rezervacije' ? `<span class="n">${resOpen}</span>` : ''}</button>`).join('');
  const strip = document.getElementById('strip');
  strip.hidden = tab !== 'dani';
  strip.innerHTML = days.map((d, i) => { const dp = dayParts(d);
    return `<button class="dpill${isMove(d) ? ' move' : ''}" style="--cc:${cityOf(d).c}" data-act="go" data-i="${i}" aria-current="${i === cur}" aria-label="${esc(dp.wd + ' ' + dp.dt + ' ' + dp.title)}"><span class="w">${esc(dp.wd)}</span><span class="d">${dp.dt.split('.')[0]}</span><span class="m">${dp.dt.split('.')[1]}.</span></button>`; }).join('');
  let lastCity = null;
  document.getElementById('rail').innerHTML = days.map((d, i) => { const dp = dayParts(d); const c = cityOf(d);
    const head = d.city !== lastCity ? `<div class="city" style="--cc:${c.c}">${c.short}</div>` : ''; lastCity = d.city;
    return head + `<button style="--cc:${c.c}" data-act="go" data-i="${i}" aria-current="${i === cur}"><span class="rtx"><span class="rd">${esc(dp.wd)} ${esc(dp.dt)}</span><span class="rt">${inline(dp.title)}</span></span></button>`; }).join('');
  document.getElementById('layout').className = 'layout' + (tab === 'dani' ? ' days' : '');
  const main = document.getElementById('main');
  main.innerHTML = tab === 'dani' ? dayView() : tab === 'pregled' ? pregled() : tab === 'odluke' ? odluke() : tab === 'rezervacije' ? rezervacije() : info();
  const nd = [...main.querySelectorAll('details')];
  if (nd.length === openDetails.length) nd.forEach((x, i) => x.open = openDetails[i]);
}
function scrollPillIntoView() {
  const p = document.querySelector('.dpill[aria-current="true"]');
  if (p) p.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function go(i) {
  cur = i; tab = 'dani'; openSlots.clear(); qOpen = null; store.set('day', i); store.set('tab', tab);
  history.replaceState(null, '', '#dan-' + days[i].date.replace('.', '-'));
  render(); scrollPillIntoView(); window.scrollTo({ top: 0 });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act; const d = days[cur];
  if (a === 'tab') { tab = b.dataset.t; store.set('tab', tab); history.replaceState(null, '', '#' + (tab === 'dani' ? 'dan-' + days[cur].date.replace('.', '-') : tab)); render(); if (tab === 'dani') scrollPillIntoView(); window.scrollTo({ top: 0 }); }
  else if (a === 'go') go(+b.dataset.i);
  else if (a === 'q') { qOpen = qOpen === b.dataset.k ? null : b.dataset.k; render(); }
  else if (a === 'slot') { const k = d.date + '|' + b.dataset.key; openSlots.has(k) ? openSlots.delete(k) : openSlots.add(k); render(); }
  else if (a === 'plan') { planView[d.date] = +b.dataset.i; store.set('planView', planView); openSlots.clear(); render(); }
  else if (a === 'pickalt') { const pd = { ...pickDoc(d), slots: { ...(pickDoc(d).slots || {}) } }; const k = b.dataset.slot, i = +b.dataset.alt; pd.slots[k] = pd.slots[k] === i ? null : i; write('picks', pickId(d), pd); }
  else if (a === 'dec') { const s = S.dec[b.dataset.id] || {}; write('dec', b.dataset.id, { ...s, done: !s.done }); }
  else if (a === 'res') { const s = S.res[b.dataset.id] || {}; write('res', b.dataset.id, { ...s, done: !s.done }); }
  else if (a === 'who') { const s = S.res[b.dataset.id] || {}; write('res', b.dataset.id, { ...s, who: s.who === b.dataset.p ? null : b.dataset.p }); }
  else if (a === 'decf') { decFilter = b.dataset.f; render(); }
  else if (a === 'resf') { resFilter = b.dataset.f; render(); }
});
document.addEventListener('keydown', e => {
  if (tab !== 'dani' || e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' && cur < days.length - 1) go(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
});
window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1); const m = h.match(/^dan-(\d+)-(\d+)$/);
  if (m) { const i = dayIdx(`${+m[1]}.${+m[2]}`); if (i >= 0 && (i !== cur || tab !== 'dani')) go(i); }
  else if (['dani', 'pregled', 'odluke', 'rezervacije', 'info'].includes(h) && h !== tab) { tab = h; store.set('tab', tab); render(); window.scrollTo({ top: 0 }); }
});
render(); setSync(); requestAnimationFrame(scrollPillIntoView);
connect();
</script>
</body>
</html>
