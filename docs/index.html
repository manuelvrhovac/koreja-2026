, 협성마리나G7 (stara adresa 초량동 1266)\n- **Kvart:** Choryang-dong, Dong-gu, lučka strana Busan Stationa\n- **Ulaz:** kod na vratima · upute za check-in stižu 72 h prije dolaska\n- **Vlak:** Busan Station (KTX) ~340 m, 5 min pješke\n- **Metro (Busan L1):** Busan Station ~550 m · Choryang ~540 m · Jagalchi 3 stanice južno\n- **Noćni bus:** stanica kod Busan Stationa ~530 m · CU u istoj zgradi\n- [Otvori u Naver Map (iOS)](nmap://place?lat=35.116103&lng=129.045125&name=BrownSuites%20Busan%20Station&appname=com.sokogeo)", "slots": [{"timeLabel": "11:45", "key": "11:45", "title": "Ručak: Hapcheon Gukbapjip", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**합천국밥집**, kod ulaza u Oryukdo / južnog kraja Igidaea. **Michelin Bib Gourmand.** Taksi s Busan Stationa ~25–30 min (**WIP** ~12–16 000 ₩).\n\n**Dwaeji gukbap** — Busanska juha od svinjskih kostiju preko riže, jelo izbjeglica iz Korejskog rata. Ovdje **bistra juha** (lakša od mliječne). Servira se s tanjurom sirovog češnjaka, vlasca, ljute paste i škampove soli (saeujeot) — sam se začinjava. ~**13 000 ₩**, 09:30–20:00. ⚠️ Red 11:00–13:00 — doći prije 12:00.\n⚠️ Jelo koje dijeli ljude — nekima je bljutavo ili im smeta miris. Tko ne voli: naručiti suyuk (kuhana svinjetina na tanjuru).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:00", "key": "13:00", "title": "Oryukdo Skywalk", "meta": ["⏱ 30–45 min", "☀️ treba suho (zatvara po kiši i vjetru)", "🦵 lagano"], "body": "**오륙도 스카이워크** — potkova od stakla na rubu litice, **37 m iznad mora**, pogled na otočiće Oryukdo (\"pet ili šest otoka\" — ovisno o plimi). **Besplatno, 09:00–18:00**, **zatvara se po kiši, snijegu ili jakom vjetru**. Ravan pristup s gornjeg platoa, navlake za cipele na ulazu. Obalni Busan je vjetrovit — gledati prognozu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:45", "key": "13:45", "title": "Igidae, sjeverni kraj (Dongsaengmal)", "meta": ["⏱ 1–1,5 h", "☀️ bolje suho", "🦵 lagano–🦵🦵 srednje"], "body": "⚠️ **Zašto ne cijela staza:** obalna staza Igidae je 4,7 km uz litice, s **70+ strmih drvenih stepeništa** stalno gore-dolje (ukupni uspon nije velik — procjena ~200–300 m gore i dolje, **neprovjereno** — ali stepenice su točno ono što koljeno ne voli). Najstrmiji dio je odmah kod Oryukdoa, a **na cijeloj dužini nema izlaza na cestu**. Tri dana poslije Ulsanbawija i dan poslije Seokgurama.\n\n**Plan:** sa Skywalka **taksi (~10 min) do Dongsaengmala (동생말)** → **0,8–1,2 km drvene staze** prema Eoulmadangu: blagi nagib, mali viseći most, pogled na **most Gwangan i nebodere Marine Cityja** preko vode. Natrag isti put ili taksi.\n\n**Opcija — cijela staza (samo ako je koljeno super):** **4,7 km, ~2,5–3 h**, hodati **od Dongsaengmala prema Oryukdou** (sjever → jug), tako da je najstrmiji dio na kraju i to **većinom uzbrdo**. Viseći mostovi, morske špilje, Nongbawi stijena. Ručak tada prije (u gradu), a Skywalk na kraju — **prije 18:00**. Odluka na licu mjesta.", "alts": [{"title": "Haeundae Blueline Park (해운대 블루라인파크) — staza", "text": "stara pruga uz more pretvorena u **potpuno ravnu drvenu stazu**, bez stepenica: Mipo → Cheongsapo → Songjeong, hodati 2,4–4,8 km, natrag obalnim vlakićem ili taksijem. Za dan \"koljeno ne može\"", "meta": ["⏱ 1,5–2 h", "☀️", "🦵"]}, {"title": "Taejongdae", "text": "litice i svjetionik na jugu Yeongdoa; samo **vlakićem Danubi** (bez njega strmi asfalt)", "meta": ["⏱ 2 h", "☀️", "🦵"]}, {"title": "Spa Land, Centum City", "text": "kišni plan: 13 sauna na obučenom katu, ~17 000 ₩ radnim danom za 4 h", "meta": ["⏱ 3–4 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Hotel, check-in", "meta": [], "body": "Taksi natrag (~25 min), koferi iz ormarića, check-in od 16:00, tuš, pauza.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:00", "key": "17:00", "title": "Gwangalli: zalazak i most", "meta": ["⏱ 1 h", "🌦️ podnosi kišu", "🦵 lagano"], "body": "Taksi s Busan Stationa ~25 min (**WIP** ~13–16 000 ₩). **Plaža Gwangalli** — 1,4 km pijeska okrenutog prema **mostu Gwangan (Diamond Bridge)**, 7,4 km dugom visećem mostu koji se noću osvjetljava u bojama. Zalazak ~17:35 je iza leđa (zapad), pa je ljepši trenutak **plavi sat i paljenje svjetala** (~18:00). Bez karte, bez reda.\n\n⚠️ **Millak Waterside Park** (stepenice uz more, nekad poznato \"pivo na stepenicama\") je **zona bez alkohola od 1.7.2023.** — kazna 50 000 ₩. ⚠️ Gwangalli drone show ide samo subotom.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:30", "key": "18:30", "title": "Večera i Galmegi Brewing", "meta": ["⏱ 2–3 h", "☔", "🦵 lagano"], "body": "Uz plažu je zid restorana i barova okrenutih mostu. **Za večeru** (nije posebno istraženo — **WIP**, birati na Naveru, ocjena 4,3+): **jogae-gui** (školjke pečene na roštilju na stolu — Busanska klasika, sve kuhano), korejski BBQ, ili pizza u Galmegiju. ⚠️ Gwangalli je pun **hoe** (sirova riba) restorana — tražiti kuhano.\n\n**Galmegi Brewing (갈매기브루잉)** — **prva craft pivovara Busana**, Gwangnam-ro: IPA, stout, sezonska piva i **pizza iz krušne peći**. Večernje radno vrijeme (**UV**).", "alts": [{"title": "Rooftop lounge s pogledom na most", "text": "(npr. u zgradi Hotel 1 na plaži) — utorkom bez rezervacije", "meta": ["⏱ 1–2 h", "☔", "🦵"]}, {"title": "Kišni plan: Nampo uličice s pićem", "text": "bliže hotelu (3 stanice metroom)", "meta": ["⏱ 2 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "22:30", "key": "22:30", "title": "Subyeon Choego Dwaeji Gukbap", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "**수변최고돼지국밥 민락본점** — **otvoreno ~24 h**, dwaeji gukbap s **hangjeongsal** (svinjski vrat, mekan i mastan) ~13 000 ₩. Klasičan Busanski kraj večeri. Vikendom red 60+ min, utorkom navečer brzo. Ako je ručak bio gukbap, a netko ga ne voli — preskočiti. Taksi natrag ~25 min.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "Transfer: Gyeongju → Busan · KTX", "md": "**Taksi do stanice Gyeongju (~20 min, ~15–17 000 ₩ po autu, ili GJS van) → KTX ~30 min → Busan Station → 5 min pješke do hotela.** KTX vozi svakih 20–40 min, **11 000–21 000 ₩** (**WIP** točan vlak oko 10:00 — rezervirati par dana ranije na Korailu).\n\nZašto ne bus: iz Gyeongjua busevi stižu na **Nopo** (sjeverni rub Busana, ~45–50 min metroom s koferima) ili u Haeundae — ne u centar. KTX ukupno ~1 h 15 min od vrata do vrata, bus ~2–2,5 h.\n\n⚠️ **Prtljaga:** check-in u 16:00 (kod na vratima). 📧 **Pitati hosta** mogu li se koferi ostaviti ranije. Ako ne: **ormarići na Busan Stationu** (6 grupa, ima velikih) ili **Zimcarry pult 09:00–22:00**.", "top": false}], "triggers": "- **Kiša ili vjetar →** Skywalk zatvoren, Igidae otpada → Spa Land, navečer Nampo\n- **Koljeno →** samo Skywalk + Blueline Park (ravno) ili samo Skywalk\n- **Koljeno je super i vrijeme lijepo →** cijela staza Igidae od Dongsaengmala prema Oryukdou\n- **Host ne da kofere ranije →** ormarići / Zimcarry na Busan Stationu\n- **Umor →** Gwangalli samo zalazak i Galmegi, rano natrag", "heading": "Uto 27.10. — Skywalk, Igidae i Gwangalli noću", "city": "busan", "transfer": "**🚄 Uto 27.10. · Gyeongju → Busan · KTX ~30 min · 11 000–21 000 ₩**\nTaksi do stanice Gyeongju (~20 min), KTX do **Busan Stationa — hotel je 5 min pješke**. Bus iz Gyeongjua stiže na rub Busana (Nopo), pa je ukupno sporiji.", "flash": null, "rows": [{"time": "09:15", "key": "09:15", "text": "Check-out, 2 taksija do stanice Gyeongju (~20 min)", "altHint": false, "slot": null}, {"time": "~10:00", "key": "10:00", "text": "**KTX → Busan Station** (~30 min) · kofere u ormariće na stanici ili kod hosta (check-in 16:00)", "altHint": true, "slot": null}, {"time": "11:45", "key": "11:45", "text": "Taksi do Oryukdoa → ručak **Hapcheon Gukbapjip** — dwaeji gukbap, Michelin Bib Gourmand, ~13 000 ₩", "altHint": false, "slot": 0}, {"time": "13:00", "key": "13:00", "text": "**Oryukdo Skywalk** — stakleni pod 37 m nad morem, besplatno (zatvara po kiši/vjetru)", "altHint": false, "slot": 1}, {"time": "13:45", "key": "13:45", "text": "Taksi do **Dongsaengmala** → **sjeverni kraj Igidaea**, ~1 km drvene staze, mali viseći most, pogled na most Gwangan · *ili cijela staza 4,7 km ako je koljeno super*", "altHint": true, "slot": 2}, {"time": "15:30", "key": "15:30", "text": "Natrag u hotel, check-in od 16:00, odmor", "altHint": false, "slot": 3}, {"time": "17:00", "key": "17:00", "text": "Taksi do **Gwangallija** (~25 min) → zalazak ~17:35 i paljenje svjetala na mostu", "altHint": false, "slot": 4}, {"time": "18:30", "key": "18:30", "text": "Večera uz plažu (kuhano: školjke na roštilju, BBQ…) → **Galmegi Brewing**", "altHint": true, "slot": 5}, {"time": "22:30", "key": "22:30", "text": "**Subyeon Choego gukbap** (Millak, ~24 h) → taksi natrag", "altHint": false, "slot": 6}], "plans": [{"label": "Plan B · Eonyang", "replaces": ["10:00"], "summary": "", "detail": {"title": "Plan B (malo vjerojatno) — tržnica Eonyang i bulgogi", "meta": [], "md": "**27. je dan tržnice u Eonyangu** — seoska tržnica koja radi svakih 5 dana (datumi koji završavaju na 2 i 7). Eonyang je **usput**: KTX iz Gyeongjua staje na **Ulsan KTX stanici (~10 min)**, koja je baš u Eonyangu; tržnica i restoran su ~10 min taksijem (**UV**), pa dalje vlakom ~20–30 min do Busana.\n- **Gongwon Bulgogi (공원불고기)**, od 1984. — **Eonyang bulgogi**: tanke kriške lokalne govedine pečene na žičanom roštilju nad ugljenom. ~21 000 ₩ / 180 g, 10:00–21:00. Tražiti **stol, ne pod**. ⚠️ Na meniju je i yukhoe (sirova govedina) — ne naručivati. Preskočiti Giwajip (sjedenje na podu).\n- ⚠️ **Treba još istraživanja — prtljaga:** ormarići na Ulsan KTX stanici su mali, 4 velika kofera vjerojatno ne stanu. Plan bi bio: 2 taksija s koferima do Gongwona, koferi ostaju u restoranu, tržnica u dvije smjene po dvoje (ili ništa), taksiji natrag na stanicu. Dolazak u Busan ~13:30; Igidae se skraćuje.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-uto-27-10-transfer-u-busan"]}, {"date": "28.10", "d3heading": "SRI 28.10. — TRŽNICE, SELO NA LITICI I BUSANSKA HRANA", "night": "Noćenje: Busan, BrownSuites Busan Station · Dan 10 od 14", "intro": "*Provjereno 9.10. (vlastita pretraga, ne samo Gemini): dizanje mosta Yeongdo, dizalo 168 stepenica, busevi za Huinnyeoul, sati Dongnae Pajeona, Gaemijipa, yubu jeongola, noćne tržnice Kkangtong. Izvori na kraju dana.*\n\n⚠️ **Srijeda:** most Yeongdo se **diže samo subotom (14:00–14:15)** → ne danas. Sutra je rani KTX za Seoul — večer ne razvlačiti.", "stay": "", "slots": [{"timeLabel": "08:30", "key": "08:30", "title": "Jagalchi: doručak u uličici pečene ribe", "meta": ["⏱ 1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "**Metro linija 1, Busan Station → Jagalchi, 3 stanice** (izlaz 10 ili 6). **Najveća ribarnica u Koreji** — pola u velikoj zgradi, pola uz more na otvorenom.\n\n**Doručak: uličica pečene ribe (생선구이 골목)** — kod izlaza 6, niz malih zalogajnica: **skuša (godeungeo), hairtail (galchi), iverak** pečeni na ploči, uz rižu, juhu od siraegija (sušeni listovi rotkve) i priloge. **~10–15 000 ₩ p.p.**, od ranog jutra. Potpuno kuhano, bez cjenkanja.\n\nPoslije šetnja kroz **glavnu dvoranu** (prizemlje: bazeni sa živom ribom, rakovima, hobotnicama, plaštenjacima). ⚠️ Glavna zgrada zatvorena **1. i 3. utorak** — srijeda OK.", "alts": [{"title": "💸 Izabrati živu ribu dolje, kuhaju gore (chojangjip)", "text": "za veliku gozbu: stol ~**5–6 000 ₩ p.p.** + kuhanje **~5–10 000 ₩ po načinu** (+ cijena ribe). ⚠️ **Busanski default je sirovo** → na štandu i u kuhinji reći **\"jjim\" (na pari) ili \"gui\" (pečeno)**, \"no raw\". **Cijenu dogovoriti PRIJE nego se riba usmrti.** Računati +20–30 000 ₩ za stol, kuhanje i piće", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Uličica pečenog hagfisha (곰장어 골목)", "text": "hagfish (riba nalik jegulji) pečen sa soli ili ljutim umakom — Busanska posebnost, praktična verzija Gijang slamnatog roštilja", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "10:00", "key": "10:00", "title": "BIFF trg i tržnica Gukje", "meta": ["⏱ 1,5 h", "🌦️ podnosi kišu", "🦵 lagano"], "body": "**BIFF trg** (Busanski filmski festival — otisci ruku redatelja u pločniku), 5 min od Jagalchija. Ovdje je izmišljen **ssiat hotteok** (씨앗호떡): pržena palačinka punjena smeđim šećerom i **sjemenkama suncokreta i bundeve**, razrezana i napunjena — ~2 000 ₩. Štandovi (npr. Seunggi Wonjo) otvaraju ~09:30–10:00.\n\n**Tržnica Gukje (국제시장)** — ogromna tradicionalna tržnica iz doba izbjeglica (film \"Ode to My Father\"): uličice po temama, sve od posuđa do vojnih viškova. Šetnja bez cilja; jeftine **naočale** po mjeri u Nampu (ako netko treba). Odmah do nje **tržnica Bupyeong (Kkangtong)**.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "11:30", "key": "11:30", "title": "Ručak: nakgopsae ili yubu jeongol", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "Dvije ravnopravne opcije, obje Busanske, obje kuhane:\n\n- **Gaemijip, glavna podružnica (개미집 본점)**, tržnica Gukje — **nakgopsae** (낙곱새): **nakji** (mala hobotnica) + **gopchang** (goveđe tanko crijevo) + **saeu** (škampi) u ljutom crvenom umaku, kuha se u tavi na stolu, jede preko riže. Busanski izum. **11:00–21:00 (zadnja narudžba 20:30), bez neradnog dana.** ⚠️ Ljuto — tražiti blaže (\"deol maepge\"). Tko ne voli crijeva: **naksae** (samo hobotnica i škampi).\n- **Kkangtong Golmok Halmae Yubu Jeongol (깡통골목할매유부전골)**, uličica Kkangtong — **yubu jeongol**: vrećice od prženog tofua punjene staklenim rezancima i povrćem, u blagoj vrućoj juhi od ribe i rotkve. Lagano, toplo, jedinstveno. **10:00–18:00 (zadnja narudžba 17:50)** — **zatvoreno utorkom** (izvor: korisnički podaci; Gemini je tvrdio srijedom — **UV**). Samo za ručak, nikad za večeru.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:00", "key": "13:00", "title": "Huinnyeoul Culture Village (흰여울문화마을)", "meta": ["⏱ 1,5–2 h s putom", "☀️ treba suho", "🦵 lagano (gornja staza) / 🦵🦵🦵 stepenice dolje"], "body": "**Otok Yeongdo.** **Bus 7, 71 ili 508** (također 6, 9, 82, 85) iz Nampa preko mosta Yeongdo do stanice **흰여울문화마을** (~15–20 min, ~1 500 ₩) — ili taksi ~6–9 000 ₩. Besplatno, otvoreno uvijek; info centar 10:00–18:00.\n\nSelo iz ratnog doba na litici iznad **sidrišta brodova** u Korejskom tjesnacu — uske kućice obojene bijelo i plavo, mali kafići s pogledom na desetke usidrenih teretnjaka. Ista atmosfera kao poznatiji **Gamcheon**, ali tiše i s pravim pogledom na more.\n\n⚠️ **Samo gornja staza.** Selo ima dvije razine povezane strmim stepeništima (\"Piano\" i \"Rainbow\" stepenice, nejednake stepenice — broj **neprovjeren**, Gemini kaže 100–150). **Gornja staza uz rub litice je ravna** — hodati nju, piti kavu s pogledom. Do obalne staze i tunela dolje, ako netko želi, **blažom sjevernom padinom kod info centra**.", "alts": [{"title": "Igidae / Skywalk", "text": "ako je jučer propao zbog vjetra", "meta": ["⏱ 2 h", "☀️", "🦵🦵"]}, {"title": "Spa Land, Centum City", "text": "po kiši: obučena jjimjilbang zona (majica i kratke hlače), golo kupalište odvojeno i opcionalno; cijena **~17 000 ₩ ili 23–25 000 ₩ za 4 h (izvori se ne slažu)**", "meta": ["⏱ 3–4 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Odmor (ili Pomorski muzej)", "meta": [], "body": "Bus natrag u Nampo/hotel. Opcija na Yeongdou: **Nacionalni pomorski muzej** — besplatno, uto–ned 10:00–18:00, akvarijski tunel, brodovi (**UV**). Dobar kišni blok.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:00", "key": "17:00", "title": "168 stepenica i besplatno dizalo", "meta": ["⏱ 45 min", "🌦️", "🦵 lagano (dizalo)"], "body": "**초량 168계단**, Choryang, **~10 min pješke od hotela.** Strmo stubište iz doba izbjeglica, kojim su ljudi nosili vodu s lučkog bunara. Stara monorail je uklonjena; od 2026. vozi **besplatno kosinsko dizalo \"168계단 하늘길\" (12 osoba, nagib ~40°)** s 3 stanice — u sredini **vidikovac Kim Min-bu** s panoramom luke Busan. Zalazak ~17:30, lučke dizalice i most Busan u sumrak. Sati dizala **WIP**.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "Večera: dvije ravnopravne opcije", "meta": ["⏱ 2–3 h", "☔", "🦵 lagano"], "body": "**A) Naengchae jokbal → noćna tržnica Kkangtong**\n- **Uličica jokbala Bupyeong (부평족발골목)**, Nampo — **naengchae jokbal** (냉채족발), Busanski izum: **kuhane svinjske nogice narezane na hladno**, s **trakama meduze**, krastavcem i **oštrim senf-umakom**. Zvuči čudno, a osvježavajuće je i jako dobro. Npr. **Wonjo Busan Jokbal (원조부산족발)** — bez neradnog dana; **35 000 (mali) – 60 000 ₩ (XL)** po tanjuru za dijeljenje; za četvero srednji/veliki + doenjang-jjigae i dolsotbap. Ili Hanyang Jokbal.\n- **Noćna tržnica Kkangtong (부평깡통야시장)** — odmah do: kolica s hranom **svaku večer 19:30–23:30** (pojedini štandovi znaju ne raditi). Zalogaji iz cijelog svijeta i korejski: tteokbokki, eomuk, pečeni sir, mandu. Za desert i pivo.\n\n**B) Dongnae Halmae Pajeon (동래할매파전)**\n- **Metro linija 1** do Dongnaea / Sajika, ~30 min (**WIP** najbliža stanica). Stara kuća koja radi **Dongnae pajeon** — palačinka s mladim lukom, ali **debela, mekana, gotovo kremasta**, s dagnjama, kamenicama, lignjama i govedinom, peče se pod poklopcem — **nije hrskava**. Lokalna verzija koja ne postoji drugdje. Uz makgeolli.\n- **11:30–21:30, pauza 15:00–17:00, ponedjeljkom zatvoreno** (Korea Tourism podaci; Gemini je pogrešno tvrdio pon–uto). → **Doći do ~19:30.** Natrag u Nampo na Kkangtong ako ima energije.", "alts": [], "altNotes": ["🟡 **Gijang — hagfish pečen na goruću slamu (짚불곰장어)** — hagfish se peče cijeli na vatri od slame, koža se guli za stolom; stvarno samo ovdje. Npr. Wonjo Jipbul Gomjangeo Gijang Oegajib (Sirang-ri): utorkom zatvoreno, sri 10:30–21:00. **45–55 min taksijem, 28–35 000 ₩ u smjeru.** Samo ako ekipa jako želi · *⏱ 3–4 h · ☔ · 🦵*"], "after": ""}, {"timeLabel": "22:00", "key": "22:00", "title": "Piće ili spavanje", "meta": [], "body": "Nampo ima šatorske barove i pivnice oko Kkangtonga. **Sutra je KTX ujutro** — kofere spakirati večeras.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša →** Huinnyeoul otpada → Spa Land ili Pomorski muzej; tržnice su većinom pod krovom\n- **Igidae jučer propao zbog vjetra →** danas umjesto Huinnyeoula\n- **Yubu jeongol zatvoren →** Gaemijip (i obrnuto)\n- **Pajeon zatvoren ili predaleko →** opcija A\n- **Umor →** jokbal + Kkangtong, rano u krevet\n\n*Izvori (provjera 9.10.):* [Koreabridge — most Yeongdo](https://www.koreabridge.net/post/bridge-still-rises-yeongdo-and-refugees-who-waited) · [news-wa — dizalo 168](https://www.news-wa.com/amp/travel/tour-korea/2026/07/18/20260718500022) · [Telltrip — Huinnyeoul](https://www.telltrip.com/domestic-travel/busan-huinnyeoul-culture-village-art-transformation/) · [Korea Experience — noćne tržnice](https://koreaexperience.com/blog/busan-night-markets-guide-best-food-and-shopping-spots-2026) · [Korea Experience — Jagalchi](https://koreaexperience.com/blog/the-best-fresh-seafood-in-busan-jagalchi-market-2026) · [ktriptips — Dongnae Pajeon](https://www.ktriptips.com/kor/food/2565287) · [ktriptips — Gaemijip](https://www.ktriptips.com/kor/food/2609623) · [Autoreserve — Yubu Jeongol](https://autoreserve.com/en/restaurants/16eQkkFwR78CcsinbZVd) · [Polle — Wonjo Busan Jokbal](https://polle.com/place/3uwi82/%EC%9B%90%EC%A1%B0%20%EB%B6%80%EC%82%B0%EC%A1%B1%EB%B0%9C)", "heading": "Sri 28.10. — Tržnice, selo na litici i Busanska hrana", "city": "busan", "transfer": "", "flash": null, "rows": [{"time": "08:30", "key": "08:30", "text": "Metro L1 do Jagalchija (3 stanice) → **Jagalchi**: doručak u **uličici pečene ribe** (skuša, hairtail, iverak s rižom, ~10–15 000 ₩), šetnja dvoranom", "altHint": true, "slot": 0}, {"time": "10:00", "key": "10:00", "text": "**BIFF trg** — ssiat hotteok (palačinka sa sjemenkama, izmišljena ovdje) → **tržnica Gukje**", "altHint": false, "slot": 1}, {"time": "11:30", "key": "11:30", "text": "Ručak: **Gaemijip nakgopsae** (hobotnica + goveđe crijevo + škampi, kuha se na stolu) **ili** **Halmae yubu jeongol** (tofu-vrećice s rezancima u juhi, 10–18 h)", "altHint": false, "slot": 2}, {"time": "13:00", "key": "13:00", "text": "Bus **7 / 71 / 508** → **Huinnyeoul** — gornja staza uz liticu, kafići, pogled na brodove · *bez strmih stepenica dolje*", "altHint": true, "slot": 3}, {"time": "15:30", "key": "15:30", "text": "Hotel, odmor *(ili Pomorski muzej, besplatno)*", "altHint": false, "slot": 4}, {"time": "17:00", "key": "17:00", "text": "**168 stepenica — besplatno kosinsko dizalo** do vidikovca nad lukom, zalazak ~17:30 · 10 min od hotela", "altHint": false, "slot": 5}, {"time": "19:00", "key": "19:00", "text": "**Naengchae jokbal** (hladne svinjske nogice, meduza, senf) u uličici Bupyeong → **noćna tržnica Kkangtong** (19:30–23:30) · **ili** **Dongnae Halmae Pajeon** — gusti meki pajeon s plodovima mora (metro ~30 min, doći do 19:30)", "altHint": false, "slot": 6}, {"time": "22:00", "key": "22:00", "text": "Piće u Nampu ili rano spavanje — sutra KTX ujutro", "altHint": false, "slot": 7}], "plans": [], "leftPlans3": [], "decisions": []}, {"date": "29.10", "d3heading": "ČET 29.10. — SUNGSIMDANG, PALAČA, SEOCHON, ESCAPE ROOM", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 11 od 14", "intro": "", "stay": "🏨 **Smještaj — Seoul II: White Linen House 3br** · 29.10.–2.11. (4 noći) · check-in od 16:00, check-out 11:00\n\n- **Adresa:** 26-10 Donggyo-ro 38-gil, Mapo-gu, Seoul 03982\n- **Za taksi:** 서울 마포구 동교로38길 26-10 (stara adresa 연남동 380-3)\n- **Kvart:** Yeonnam-dong, Mapo-gu — kafići i restorani, mirnija strana Hongdaea\n- **Metro:** **Hongik Univ.** ~520–560 m — Line 2, **AREX**, Gyeongui-Jungang · najbliži ulaz AREX izlaz 3, ~360 m\n- **Aerodrom 2.11.:** AREX all-stop s Hongik Univ., ~1 h do T1/T2 (express ovdje ne staje)\n- **U blizini:** Gyeongui Line Forest Park ~180 m · Hongdae ulice ~10 min pješke · 7-Eleven 26 m\n- [Otvori u Naver Map (iOS)](nmap://place?lat=37.561826&lng=126.925090&name=White%20Linen%20House&appname=com.sokogeo)", "slots": [{"timeLabel": "07:30", "key": "07:30", "title": "Doručak: Samjin Eomuk", "meta": ["⏱ 20 min", "☔", "🦵 lagano"], "body": "**삼진어묵**, Busan Station, 1. kat — najstariji korejski brend ribljih kolača (od 1953.). Riblji kolači i \"eomuk kroketi\" punjeni sirom, kozicama, povrćem, ~2 000–4 500 ₩ komad. Trgovina u stanici radi od ~07:00 (**UV** — izvori se razilaze između stanice i podružnice na trgu). Kava i nešto za vlak iz trgovine.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~08:00", "key": "08:00", "title": "KTX Busan → Daejeon (opcionalna stanka)", "meta": ["⏱ ~1h40 + 40 min + ~1 h"], "body": "⚠️ **Opcionalno.** Ako smo umorni, nismo gladni ili kasnimo — **direktni KTX Busan → Seoul** (~2h30) i stanka otpada bez žaljenja.\n\n**Sungsimdang (성심당), stanica Daejeon, 2. kat** (između izlaza 4 i 5), ~07:00–22:30 (**UV**). Vjerojatno najpoznatija pekara u Koreji, iz Daejeona od 1956., **nema podružnicu u Seoulu** — redovi su legendarni. Što uzeti:\n- **twigim soboro (튀김소보로)** — pržena lepinja s hrskavom mrvicom i crvenim grahom, ~1 700 ₩, **ima zaseban brzi red**;\n- **budu (부추빵)** — lepinja s porilukom; sezonski kolači ako ima reda.\n\n**Prtljaga:** ormarići u Daejeonu su uglavnom puni od torbi s kruhom → **dvoje stoji u redu, dvoje čuva kofere** (radnim danom ~10–15 min). **Dvije KTX karte** (Busan → Daejeon, Daejeon → Seoul), **≥50 min između vlakova**; ukupno otprilike ista cijena kao direktno (**UV**), dolazak u Seoul tek ~10 min kasnije.\n\nKTX savjeti: rezervirati **zadnji red vagona** (iza sjedala ima mjesta za kofere); veliki koferi na police između vagona — tko prvi uđe.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~11:40", "key": "11:40", "title": "Seoul Station → Yeonnam-dong", "meta": [], "body": "**AREX all-stop** (일반열차) s Seoul Stationa do **Hongik Univ., ~15 min**, pa ~550 m pješke s koferima (izlaz 3) — ili **2 taksija ~20–25 min** (s 4 kofera lakše). Kofere ostaviti kod hosta ako dopusti (📧), inače ormarići na Hongik Univ. / Seoul Station. Ručak usput: nešto brzo u Yeonnam-dongu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "Gyeongbokgung", "meta": ["⏱ ~1 h", "🌦️ podnosi kišu", "🦵 lagano (ravno kamenje)"], "body": "**3 000 ₩ · 09:00–18:00 (zadnji ulaz 17:00) · utorkom zatvoreno.** Taksi iz Yeonnam-donga ~25 min, ili metro do Gyeongbokgunga (L3).\n\nGlavna palača dinastije Joseon. **Smjena straže u 14:00** ispred vrata Gwanghwamun (besplatno, 20 min, izvan blagajne; **UV** točna vremena: 10:00 i 14:00). Unutra: **Geunjeongjeon** (prijestolna dvorana) i **Gyeonghoeru** (paviljon za gozbe na kamenim stupovima nad jezerom). **Ograničiti na ~1 h** — Tajni vrt 1.11. je ljepši i intimniji. ⚠️ **Folklorni muzej preskočiti** (800 m na drugi kraj).\n\n**Izlaz: zapadna vrata Yeongchumun** → ravno u Seochon.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:00", "key": "15:00", "title": "Seochon", "meta": ["⏱ 1,5–2 h", "🌦️", "🦵 lagano (blago uzbrdo)"], "body": "Niske uličice zapadno od palače — stari Seoul s hanok kućama i kućama iz 1930-ih, nezavisni kafići i galerije. Ruta:\n1. **Knjižara Daeoh (대오서점)** — najstarija knjižara u Seoulu (1951.), sad mala čajana u hanoku s dvorištem.\n2. **Tongin tržnica** — **gireum tteokbokki** (rižini kolačići prženi na ulju sa sojinim ili ljutim umakom) na štandu; kafić s novčićima je bio u utorak.\n3. **Ogin-dong / Nuha-dong** — uličice, pekare, keramičarske radionice.\n⚠️ **Dolina Suseong-dong** je početak nedjeljne šetnje — danas ne.", "alts": [{"title": "Jogyesa + krizanteme", "text": "ako se nije stiglo 20.10. (festival do sredine studenog), 10 min taksijem", "meta": ["⏱ 30 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "17:15", "key": "17:15", "title": "Natrag, check-in", "meta": [], "body": "Taksi ~25 min. Check-in od 16:00, kofere unutra, odmor.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Yukmong (육몽)", "meta": ["⏱ 1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "**마포구 양화로16길 19**, 1. kat — između Hongdaea i Hapjeonga, ~10 min pješke. Korejski BBQ od svinjetine (samgyeopsal, moksal, hangjeongsal): **osoblje peče** (barem prvo pečenje), **mješoviti set 550 g 69 900 ₩**, pojedinačni komadi 150 g 18 000 ₩. **Rezervacija Naver / CatchTable** (tel. 02-338-1142); četvrtkom bez rezervacije čekanje 20–40 min (**UV**). Uz soju/pivo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "20:00", "key": "20:00", "title": "🔒 ESCAPE ROOM: Deepthinker \"Ongyi's Dream\"", "meta": ["⏱ 65 min + 15 min upute", "☔ kiša OK", "🦵 lagano"], "body": "**딥띵커, 옹이의 꿈** — 4. kat, **23 Jandari-ro, Mapo** (između Hongdaea i Hapjeonga), **10–15 min pješke** od Yukmonga i od kuće. **✔ provjereno 9.10.:** radi u 2026., **sve na engleskom** (tekstovi, audio, hintovi; **engleski najaviti 24 h ranije**), 2–5 igrača, **~23–26 000 ₩ p.p.**, 10:00–23:30. Lagana pustolovna priča, **bez horora i jump scareova**, ~30 zagonetki, srednja težina.\n\n#### ⚠️ Pravila rezervacije\n- **Termini se otvaraju 2 tjedna ranije → rezervirati ~15.10.** na deepthinker.co.kr/en (još od kuće)\n- **Engleski najaviti min. 24 h ranije**\n- **Potvrditi SMS/mail — inače otkazuju**\n- **Kazna 26 000 ₩ za otkaz manje od 2 h prije**; doći 10–15 min ranije\n- **WIP:** ima li lift do 4. kata (Lucija)\n\n#### Ostali kandidati\n| Soba | Tvrtka | Ocjena |\n|---|---|---|\n| **Gumiho / Arbeit** | Real Escape Challenge, 와우산로27길 21, 4. kat | 🟡 rezerva — dvojezično, ali stari rekviziti; Arbeit je 5/5 strah |\n| **Bæd Time** | Oasis Museum | ❌ skučeno za 4, živi glumac, korejski audio |\n| **Lost City of Amazon** | Seoul Escape Room Hongdae 2 | ❌ renoviranje / otkazivanja 2025., nepouzdano |", "alts": [{"title": "Absolute Seoul Pub Crawl", "text": "**četvrtkom u Hongdaeu**, sastanak u Dokkaebi Party Houseu 20:00–21:30, 4 bara/kluba do ~00:10, ~21 USD, osobna isprava. Može i **poslije** escape rooma", "meta": ["⏱ 3–4 h", "☔", "🦵"]}, {"title": "RetroGameBar", "text": "konzole, beer pong, igre besplatne, plaća se piće; četvrtkom od 19:00", "meta": ["⏱ 2 h", "☔", "🦵"]}, {"title": "Coin noraebang + Hongdae", "text": "karaoke kabine, ~1 000 ₩ za 2–3 pjesme", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:30", "key": "21:30", "title": "Hongdae noću", "meta": [], "body": "Pub crawl (pridružiti se do 21:30), coin noraebang ili barovi oko Hongdaea — **5–10 min do kreveta**. ❌ LG Twins na Jamsilu: utakmica postoji samo ako LG prođe, i sudara se s escape roomom.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "⏰ ODLUKE I REZERVACIJE ZA EKIPU", "md": "1. 🔴 **Escape room — Deepthinker \"Ongyi's Dream\", čet 29.10. u 20:00 → rezervirati ~15.10.** (termini se otvaraju 2 tjedna ranije), **engleski najaviti 24 h ranije**, odgovoriti na potvrdu.\n2. **KTX:** direktno ili sa stankom u Daejeonu (dvije karte, presjedanje ≥50 min) → rezervirati 2–3 tjedna ranije.\n3. **Yukmong** u 18:00 za 4 — Naver / CatchTable.\n4. 📧 **White Linen House:** mogu li koferi oko 12:15 (check-in 16:00)?", "top": true}], "triggers": "- **Umorni / nismo gladni →** direktni KTX, Daejeon otpada\n- **KTX kasni →** palača otpada (zadnji ulaz 17:00), samo Seochon ili odmor; escape room ostaje\n- **Escape room nije rezerviran →** Real Escape Challenge (Gumiho), ili pub crawl\n- **Kiša →** palača podnosi kišu; Seochon kraće, kafić u knjižari Daeoh\n- **Yukmong pun →** bilo koji samgyeopsal s redom domaćih oko Hongdaea", "heading": "Čet 29.10. — Kultna pekara, palača, Seochon i escape room", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "**🚄 Čet 29.10. · Busan → Seoul · KTX ~2h30 (ili sa stankom u Daejeonu) · ~60 000 ₩**\n**KTX u Seoul Station, ne SRT u Suseo.** Od Seoul Stationa AREX (all-stop) do Hongik Univ. ~15 min, ili 2 taksija do Yeonnam-donga.", "flash": null, "rows": [{"time": "07:30", "key": "07:30", "text": "Doručak: **Samjin Eomuk** u Busan Stationu — riblji kolači od 1953.", "altHint": false, "slot": 0}, {"time": "~08:00", "key": "08:00", "text": "KTX → **Daejeon** (~1h40) · *opcionalno, preskače se ako smo umorni ili nismo gladni → direktni KTX u Seoul*", "altHint": false, "slot": 1}, {"time": "~09:40", "key": "09:40", "text": "**Sungsimdang** u stanici Daejeon (2. kat): **twigim soboro**, pržena lepinja s mrvicama i crvenim grahom · dvoje u redu, dvoje čuva kofere", "altHint": false, "slot": null}, {"time": "~10:40", "key": "10:40", "text": "KTX → **Seoul Station ~11:40** → AREX ili 2 taksija → Yeonnam-dong, kofere ostaviti (check-in 16:00)", "altHint": false, "slot": null}, {"time": "~11:40", "key": "11:40", "text": "**Seoul Station → Yeonnam-dong**", "altHint": false, "slot": 2, "d3only": true}, {"time": "13:30", "key": "13:30", "text": "Taksi (~25 min) → **Gyeongbokgung**, ~1 h: smjena straže u 14:00, prijestolna dvorana, paviljon na jezeru · 3 000 ₩", "altHint": false, "slot": 3}, {"time": "15:00", "key": "15:00", "text": "Izlaz na zapadna vrata → **Seochon**: knjižara Daeoh (hanok iz 1951.), gireum tteokbokki na Tonginu, uličice Ogin-donga", "altHint": false, "slot": 4}, {"time": "17:15", "key": "17:15", "text": "Taksi natrag, check-in, odmor", "altHint": false, "slot": 5}, {"time": "18:00", "key": "18:00", "text": "**Yukmong** — korejski BBQ, osoblje peče, set 550 g svinjetine 69 900 ₩ · rezervacija", "altHint": false, "slot": 6}, {"time": "20:00", "key": "20:00", "text": "🔒 **ESCAPE ROOM — Deepthinker \"Ongyi's Dream\"**, na engleskom, bez horora, 10–15 min pješke", "altHint": true, "slot": 7}, {"time": "21:30", "key": "21:30", "text": "**Absolute pub crawl** (četvrtkom u Hongdaeu) · ili coin noraebang · ili barovi u Hongdaeu, 5 min do kreveta", "altHint": false, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": ["d-cet-29-10-escape-room", "d-cet-29-10-ktx-u-seoul"]}, {"date": "30.10", "d3heading": "PET 30.10. — SUWON HWASEONG", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 12 od 14", "intro": "⏰ **ODLUKA ZA EKIPU (do ~25.10.):** **plan 1 — večer u Suwonu** (galbi, osvijetljeni zidovi, balon) ili **plan 2 — natrag u 15:30 i Banpo fontana**. Konačno se može odlučiti i na dan, oko 15:00, ovisno o umoru i vjetru. Ako plan 1 s **Gabojungom** → rezervirati (1600-3883). ITX karte mogu i na dan.\n\nUNESCO tvrđava iz **1796.**: kralj Jeongjo ju je sagradio oko novog grada kako bi premjestio grob svog oca, princa Sadoa (kojeg je djed dao zatvoriti u škrinju za rižu, gdje je umro). **5,7 km zidina** s 48 građevina — vrata, stražarnice, kule za strijelce, paviljoni. Zidine su **besplatne i otvorene 24 h**; plaća se samo palača. ✔ provjereno 9.10.", "stay": "", "slots": [{"timeLabel": "08:45", "key": "08:45", "title": "Do Suwona", "meta": ["⏱ ~1 h od vrata do vrata"], "body": "**Gyeongui ili AREX all-stop** s Hongik Univ. do **Seoul Stationa (~10 min)** → **ITX-Saemaeul / ITX-Maum 31–35 min, 4 800 ₩** (ili Mugunghwa ~35 min, 2 700 ₩; KTX 7 500 ₩) → stanica Suwon → **taksi 10–15 min** do Haenggunga. ✔ provjereno 9.10. Karte na dan na automatu ili Korail aplikaciji.\n\nRezerva: **linija 2 do Sindorima → linija 1 express** do Suwona, ~55–65 min (procjena), stoji se. ❌ Bus 7770 iz Sadanga / 1007 iz Jamsila — kriva strana grada za Mapo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "10:15", "key": "10:15", "title": "Hwaseong Haenggung", "meta": ["⏱ 45 min", "🌦️", "🦵 lagano"], "body": "**2 000 ₩, 09:00–18:00** (od 1.11. do 17:00), zadnji ulaz 17:30. ✔ provjereno 9.10. Najveća privremena kraljevska palača dinastije Joseon — kralj je ovdje boravio pri posjetima očevu grobu; ovdje je održao i 60. rođendan svoje majke. Rekonstruirana, s lutkama u scenama dvorskog života. Kostim (hanbok) = besplatan ulaz.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "11:00", "key": "11:00", "title": "Muye 24-gi, borilački nastup", "meta": ["⏱ 30 min", "☀️ (otkazuje se po kiši)", "🦵 lagano"], "body": "**Besplatno**, na trgu ispred palače, **radnim danom u 11:00** (vikendom i u 14:00). ✔ provjereno 9.10. (izvor iz lipnja 2026). Vojnici u odorama Joseona izvode 24 vještine iz vojnog priručnika iz 1790. — mačevi, koplja, akrobacije, borba s konja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:00", "key": "12:00", "title": "Ručak: uličica pržene piletine (Suwon Tongdak Geori)", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**수원 통닭거리**, kod južnih vrata Paldalmun, ~10 min pješke od palače. Cijela piletina pržena u **velikim željeznim kotlovima** na stari način, uz **besplatne pržene želuce** — ~**19 000 ₩ po piletini** (jedna na dvoje). Najpoznatiji: **Jinmi Tongdak (진미통닭)** i **Yongseong Tongdak (용성통닭)** (neradni dani **UV** — petak bi trebao biti OK). Uz pivo.", "alts": [{"title": "Yeonpo Galbi — galbitang za ručak", "text": "(juha od goveđih rebara, ~15 000 ₩) — ako je galbi navečer otpao (plan 2)", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "13:00", "key": "13:00", "title": "Zidovi: sjever i istok (ravno)", "meta": ["⏱ 2,5 h", "☀️ bolje suho", "🦵 lagano–🦵🦵 srednje"], "body": "⚠️ **Zapadni dio preko brda Paldalsan** (vidikovac Seojangdae, 128 m) — **strme, neravne granitne stepenice bez ograde, a silazak prema Paldalmunu je točno ono što koljeno ne voli → ❌ za Luciju.** Tko želi, napravi to kao zasebnu petlju od 45 min dok ostali voze vlakić.\n\n**Ravna ruta (sjever/istok):**\n1. **Hwahongmun (화홍문)** — vrata izgrađena **preko potoka sa sedam lukova**, voda teče kroz njih; najljepša točka zidina.\n2. **Banghwasuryujeong (방화수류정)** — paviljon na stijeni iznad lotosova jezera **Yongyeon** — klasična fotografija Suwona.\n3. **Yeonmudae (연무대)** — vježbalište: **tradicionalno streličarstvo**, **2 000 ₩ za 10 strijela**, svakih 30 min od 09:30, zadnje u 17:30, **pauza 12–13**, ne po kiši. ✔ provjereno 9.10. (Gemini je rekao 3 000 ₩.) Kratka uputa, korejski luk, mete na ~15 m — zabavnih 15 minuta.\n4. **Vlakić Hwaseong Eocha (화성어차)** — **6 000 ₩**, kružna ruta Yeonmudae → Hwahongmun → **Janganmun** (sjeverna vrata, najveća) → Hwaseomun → natrag; **uto–ned 09:40–17:00**, ~svakih 20–30 min, **ne po kiši**. ✔ provjereno 9.10. Karte kupiti rano — u gužvi se rasprodaju (**UV**).", "alts": [{"title": "Samo sjeverni dio", "text": "Hwahongmun + jezero + palača", "meta": ["⏱ 1,5 h", "☀️", "🦵"]}, {"title": "Kiša → War Memorial of Korea", "text": "(Yongsan, besplatno, 09:30–18:00) — ogromni muzej korejske vojne povijesti, avioni i tenkovi vani; ili **DDP + Dongdaemun**", "meta": ["⏱ 2 h", "☔", "🦵"]}, {"title": "Kiša → Seoul Museum of History", "text": "(besplatno, 09:00–18:00) ili **Seodaemun Prison**", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Kafić u Haenggung-dongu", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "Uličice s niskim kućama i muralima unutar zidina (**Haenggung-gil**, \"Haenglidan-gil\") — kafići, pekare, male radionice. Odmor za noge prije večeri. **Ovdje se odlučuje plan 1 ili 2** (umor, vjetar za balon).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Suwon galbi (plan 1)", "meta": ["⏱ 1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "**Suwon galbi** — **veliki komadi goveđih kratkih rebara**, marinirani u blagom umaku od soli (Suwon stil — svjetliji od seulskog sojinog), pečeni na roštilju na stolu. Grad je bio najveće tržište stoke u Koreji od 1940-ih, pa je ovo **jelo nastalo ovdje**.\n\n- **Yeonpo Galbi (연포갈비)** — 정조로906번길 56-1, **uz Hwahongmun**, 5 min pješke od zidina. **11:20–21:00, zadnja narudžba 20:00**, bez neradnog dana (✔ provjereno 9.10.); marinirani galbi ~**42 000 ₩** porcija (**UV**). Plan A — ostajemo uz zidine.\n- 💸 **Gabojung (가보정)** — veliki \"banket\" restoran galbija u Ingye-dongu, **15 min taksijem**. Radnim danom 11:30–21:30; **marinirani galbi američki 71 000 ₩ / hanwoo 79 000 ₩** po porciji, set ručak 43–47 000 ₩ (✔ provjereno 9.10.). **Rezervacija telefonom 1600-3883.** Bolji komadi i veći izbor priloga — ali skuplje i dalje od zidina.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:15", "key": "19:15", "title": "🎈 Flying Suwon + osvijetljeni zidovi", "meta": ["⏱ 20 min + 30–45 min", "☀️ (vjetar ga prizemljuje)", "🦵 lagano"], "body": "**플라잉수원** — **jedan** balon s helijem na sajli, ispred istočnih vrata (Changnyongmun), ide samo gore-dolje. **Do 100–150 m**, ukupno **15–20 min** (~7 min lebdi gore). **20 000 ₩**; radnim danom **13:00–22:00**, zadnji let 30 min prije zatvaranja. **Rezervacija ne treba** — petkom se kupi na blagajni (online –5 %, ali ne za isti dan). Ukrcaj po redu kupnje. ✔ provjereno 9.10. (zadnji izvještaj iz veljače 2026).\n\n⚠️ **Ne leti po jačem vjetru** — nazvati ili pogledati na licu mjesta. Vjerojatnost krajem listopada navečer **~60–70 % (procjena)**. **Noću je ljepše nego u zalazak** (osvijetljene zidine i promet ispod) — rukavice, gore je hladno. Recenzije pozitivne, ali malobrojne i uglavnom lokalne — **bonus, ne razlog za ostati**.\n\nPa pješke uz **osvijetljeni Hwahongmun i paviljon nad jezerom** (30–45 min, ravno). Ako balon ne leti — samo šetnja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~20:30", "key": "20:30", "title": "Natrag u Seoul", "meta": [], "body": "Taksi do stanice Suwon → **ITX ili Mugunghwa** → Seoul Station → Gyeongui/AREX → doma ~21:30.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša →** Suwon otpada → War Memorial / Seoul Museum of History / DDP; večer Banpo također otpada → Hongdae\n- **Koljeno ili umor →** samo sjeverni dio + vlakić; **plan 2**\n- **Vjetar →** balon ne leti → plan 1 bez balona, ili plan 2\n- **Ekipa hoće Banpo →** plan 2 ili srednji put\n- **Netko hoće ostati u gradu →** jedini dan kad razdvajanje na pola dana ništa ne razbija", "heading": "Pet 30.10. — Suwon Hwaseong", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": null, "rows": [{"time": "08:45", "key": "08:45", "text": "Gyeongui/AREX do Seoul Stationa (~10 min) → **ITX do Suwona** (31–35 min, 4 800 ₩) → taksi do palače", "altHint": false, "slot": 0}, {"time": "10:15", "key": "10:15", "text": "**Hwaseong Haenggung** — kraljeva privremena palača, 2 000 ₩", "altHint": false, "slot": 1}, {"time": "11:00", "key": "11:00", "text": "**Muye 24-gi** — besplatni borilački nastup ispred palače", "altHint": false, "slot": 2}, {"time": "12:00", "key": "12:00", "text": "Ručak: **uličica pržene piletine** kod južnih vrata — cijela piletina iz željeznih kotlova, ~19 000 ₩", "altHint": false, "slot": 3}, {"time": "13:00", "key": "13:00", "text": "**Ravni zidovi sjever/istok:** Hwahongmun (vrata nad potokom) → paviljon nad jezerom → **streličarstvo** u Yeonmudaeu (2 000 ₩ / 10 strijela) → **vlakić Hwaseong Eocha** (6 000 ₩) do Janganmuna · *Paldalsan (strme stepenice) ❌ za koljeno*", "altHint": true, "slot": 4}, {"time": "15:30", "key": "15:30", "text": "Kafić u uličicama Haenggung-donga, odmor", "altHint": false, "slot": 5}, {"time": "18:00", "key": "18:00", "text": "**Suwon galbi** — **Yeonpo Galbi** uz Hwahongmun (~42 000 ₩ porcija) · ili 💸 **Gabojung** (~71–79 000 ₩, rezervacija)", "altHint": false, "slot": 6}, {"time": "19:15", "key": "19:15", "text": "🎈 **Flying Suwon** — balon na sajli 100–150 m nad osvijetljenom tvrđavom, 20 000 ₩, *samo ako ne puše* → **osvijetljeni zidovi** Hwahongmuna", "altHint": false, "slot": 7}, {"time": "~20:30", "key": "20:30", "text": "ITX natrag, doma ~21:30", "altHint": false, "slot": 8}], "plans": [{"label": "Plan B · Banpo", "replaces": ["15:30", "18:00", "19:15", "20:30"], "summary": "**Plan B (vrlo moguć):** natrag u Seoul ~15:30, odmor, pa **duga fontana Banpo** (jedna od zadnje dvije večeri sezone, 19:30–21:00) + **ramyeon uz rijeku Han** · *ako smo umorni, balon ne leti ili ekipa kaže da je Banpo obavezan*", "detail": {"title": "Plan B (vrlo moguć) — natrag u 15:30 i Banpo", "meta": [], "md": "*Ako smo umorni, ako balon tog dana ne leti ili ako ekipa odluči da je Banpo obavezan.*\n\n| | |\n|---|---|\n| 15:30 | ITX natrag (balon danju po želji prije) |\n| 17:30 | Doma, tuš, odmor ~1 h |\n| 19:00 | Taksi (~30 min) do **parka Banpo Hangang** |\n| 19:15 | **Ramyeon uz rijeku Han** — u trgovini (CU/GS25) kupiš instant rezance, skuhaš ih na aparatu i jedeš uz rijeku; korejski ritual |\n| 19:30–21:00 | **Duga fontana na mostu Banpo** — mlazovi vode s boka mosta uz glazbu i svjetla, **20 min u 19:30, 20:00, 20:30, 21:00**. **Sezona završava 31.10.** — ovo je jedna od zadnje dvije večeri. Otkazuje se po kiši ili vjetru ≥7 m/s. ✔ provjereno 9.10. |\n| 21:30 | Doma ili piće u Hongdaeu |\n\n**Dobiva se:** Banpo + ramyeon (besplatno, opušteno, vrlo seulski), odmor za koljeno prije subote i nedjelje. **Gubi se:** Suwon galbi u Suwonu, osvijetljene zidine, balon noću.\n\n*Alternativa večeri:* **Namdaemun** (naočale, štandovi s hranom; dućani s odjećom zatvaraju 17–18 h) — naočale se mogu i u Hongdaeu bilo koje večeri.", "alts": [], "after": ""}, "rows": null}, {"label": "Srednji put", "replaces": ["15:30", "18:00", "19:15", "20:30"], "summary": "", "detail": {"title": "Srednji put (moguć, ali gust)", "meta": [], "md": "Balon ~16:30 → **rani galbi u 17:00** u Yeonpou → osvijetljeni Hwahongmun ~18:15 → ITX ~18:45 → Seoul Station ~19:30 → taksi do Banpoa za **20:30 ili 21:00**. Sve stane, ali u žurbi i bez odmora.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-pet-30-10-vecer"]}, {"date": "31.10", "d3heading": "SUB 31.10. — SEONGSU, DRONE SHOW I NOĆ VJEŠTICA", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 13 od 14", "intro": "**Logika dana:** Seongsu, Sindang i park s dronovima su na **istočnoj** strani Seoula, a dom i Hongdae na **zapadnoj**. Sve spaja **linija 2** — ujutro na istok, popodne doma na odmor, navečer opet na istok, pa kasno natrag na zapad.\n\n⚠️ **Ispravljeno 9.10.:** Siloam i Dragon Hill Spa su **zatvoreni**; jjimjilbang u Seoulu ekipa ionako ne planira → popodne je **odmor doma**. Naksan zid → Ihwa ❌ (strmi silazak; Naksan je bio 20.10.). Seoul Music Festival ❌ (bio je 24.10.).", "stay": "", "slots": [{"timeLabel": "10:00", "key": "10:00", "title": "Seongsu", "meta": ["⏱ 3,5 h s ručkom", "🌦️ podnosi kišu", "🦵 lagano"], "body": "**Linija 2 s Hongik Univ. do Seongsua ili Ttukseoma, ~35 min.** Stara industrijska četvrt (tvornice cipela, tiskare, skladišta) pretvorena u kafiće, dizajnerske studije i radionice — \"seulski Brooklyn\". Ne ide se zbog shoppinga nego zbog atmosfere.\n\n1. **Seoul Forest (서울숲)** — 24 h, besplatno, ravno. Ginkgo drvoredi krajem listopada žute, ograđeni dio s **jelenima** i vrt kukaca (10:00–17:00, **UV**), staklenik na mjestu stare vodovodne stanice. ~45 min.\n2. **Ulica ručno rađenih cipela (성수동 수제화거리)** — kod izlaza 3 stanice Seongsu: stare postolarske radionice i dobavljači kože uz nove studije. Samo prolaz.\n3. **Daelim Changgo (대림창고)** — Seongsu-iro 78, **bivše skladište riže** pretvoreno u galeriju i pržionicu: hrđave čelične grede, ciglene zidove, skulpture. 11:00–22:00 (**UV**). Jedna kava.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "11:45", "key": "11:45", "title": "Ručak: Somunnan Seongsu Gamjatang", "meta": ["⏱ 1 h + red", "☔", "🦵 lagano"], "body": "**소문난성수감자탕**, Yeonmujang-gil 45. **Gamjatang** — veliki lonac ljutog crvenog variva od **svinjske kralježnice** (meso se skida s kostiju) s krumpirom, zeljem i mljevenim sjemenkama perile, satima kuhan; na kraju se u ostatak umaka dodaju rezanci ili riža. Sve kuhano. **Otvoreno 24 h**, ali **subotom u vrijeme ručka red 45–75 min** → doći **do ~11:30**. Za četvero veliki lonac (~**WIP** cijena).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "Odmor doma", "meta": [], "body": "Linija 2 natrag (~35 min). Tuš, spavanje — slijedi duga večer, a dan poslije Tajni vrt.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:30", "key": "17:30", "title": "Sindang", "meta": [], "body": "**Linija 2 (ili 6) do stanice Sindang, ~30 min.** Stara četvrt kod Dongdaemuna, poznata po jednom jelu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Večera: tteokbokki kod bake Mabongrim", "meta": ["⏱ 1–1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "**마복림할머니집**, Dasan-ro 35-gil 5 (✔ adresa provjerena 9.10.; sati **UV** — Gemini: 09:00–23:00), u **ulici tteokbokkija (신당동 떡볶이 골목)**. **Tteokbokki** su žilavi rižini štapići u ljuto-slatkom crvenom umaku; ovdje je **jeukseok** verzija — **plitki lonac na plinu na stolu** u koji idu rižini kolačići, **ramen, stakleni rezanci, mandu, riblji kolači i kuhana jaja**, sve se kuha pred vama. Baka Mabongrim je ulicu \"izmislila\" 1950-ih. Jeftino (~**WIP** po osobi), glasno, zabavno. Na kraju se u ostatak umaka može tražiti pržena riža (bokkeumbap).", "alts": [{"title": "Jangchung-dong jokbal ulica (장충동 족발골목)", "text": "10 min dalje: **topli pirjani svinjski buti** (s češnjakom, đumbirom i rižinim vinom), narezani, uz slanu škampovu pastu i salatu za zamatanje. Npr. **Wonjo 1-ho Jangchung-dong Halmeonijip** (Jangchungdan-ro 176, 10:00–23:00, **UV**). Ako ekipa hoće meso, ne rižine kolačiće", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "19:15", "key": "19:15", "title": "Opcija: Jean Frigo", "meta": ["⏱ 45 min", "☔", "🦵 lagano"], "body": "**장프리고**, **Toegye-ro 62-gil 9-8, 1. kat** (Gwanghui-dong, kod Dongdaemuna) — **ulaziš u nešto što izgleda kao voćarna, otvoriš vrata hladnjaka i iza je bar.** ✔ provjereno 9.10. Bez rezervacije; sati ~pet–ned 17:00–01:00, ponedjeljkom zatvoreno (stariji izvor). ~10 min taksijem od Sindanga. Ako se kasni na dronove — preskočiti.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "20:30", "key": "20:30", "title": "🚁 Drone show, Ttukseom Hangang park", "meta": ["⏱ 1–1,5 h s čekanjem", "☀️ (otkazuje se po kiši/vjetru)", "🦵 lagano"], "body": "**뚝섬한강공원, pozornica uz rijeku** — taksi ~15 min iz Sindanga / Gwanghui-donga, ili metro linija 7 do **Jayanga**. **Besplatno.** Glazbeni program od **19:30**, **dronovi 20:30–20:45**, pa glazba do 21:15. ✔ provjereno 9.10. — ⚠️ **Marvel tema nije potvrđena** (to je tvrdio Gemini), broj dronova **UV**. **Otkazuje se po lošem vremenu** — provjeriti na dan (seouldroneshow.com).\n\nDoći do ~20:00 za mjesto na travi ili kamenim stepenicama. Dok se čeka: **ramyeon uz rijeku Han** iz trgovine (CU/GS25 — instant rezanci, aparat ih skuha za 4 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "21:15", "key": "21:15", "title": "Natrag na zapad", "meta": [], "body": "⚠️ Stanica **Jayang** odmah uz park poslije showa **ograničava ulaz** zbog gužve → **pješke 10 min do Konkuk Univ.** → **linija 2 direktno do Hongik Univ., ~35 min.**", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "22:00 → kasno", "key": "22:00", "title": "🎃 Noć vještica u Hongdaeu", "meta": ["⏱ cijela noć", "🌦️", "🦵 lagano"], "body": "**Hongdae** — studentska i noćna četvrt, **5–10 min pješke od stana**. Na Noć vještica glavno okupljalište u Seoulu: ulice pune kostima, ulični nastupi, prepuni barovi i **pocha** (šatorski barovi). Policija i hitna imaju koridore duž Eoulmadang-roa — sigurno, ali gusto.\n- **Klubovi:** redovi **1–2 h** → bolje barovi, pocha, uličica Wausan-ro.\n- **Kostim:** po želji — dućani u Hongdaeu ih prodaju tih dana.\n- ❌ **Itaewon** — od nesreće 2022. jednosmjerne rute, barijere, policija; prigušeno i na krivoj strani grada.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Kiša ili vjetar →** dronovi otkazani → plan B (Hongdae); Seongsu ujutro ima kafiće pod krovom\n- **Red za gamjatang predug →** bilo koji ručak u Seongsuu, gamjatang je i u Hongdaeu (24 h lokali)\n- **Umor →** plan B\n- **Banpo nije bio u petak →** Banpo umjesto dronova\n- **Escape room nije odrađen u četvrtak →** danas u 17:00 u Hongdaeu, pa plan B\n- **Seoul Sky nije odrađen →** sutra, nedjelja 1.11.", "heading": "Sub 31.10. — Seongsu, drone show i Noć vještica", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": null, "rows": [{"time": "10:00", "key": "10:00", "text": "Linija 2 → **Seongsu** (~35 min) — stara tvornička četvrt, kafići u skladištima, postolarske radionice", "altHint": false, "slot": 0}, {"time": "10:30", "key": "10:30", "text": "**Seoul Forest** — ravni park, žuti ginkgi, jeleni, staklenik", "altHint": false, "slot": null}, {"time": "11:15", "key": "11:15", "text": "Šetnja Seongsuom: ulica postolara, **Daelim Changgo** (skladište riže → galerija i kafić)", "altHint": false, "slot": null}, {"time": "11:45", "key": "11:45", "text": "Ručak: **Somunnan gamjatang** — ljuto varivo od svinjskih kostiju i krumpira, 24 h · ⚠️ subotom red 45–75 min, doći prije podneva", "altHint": false, "slot": 1}, {"time": "13:30", "key": "13:30", "text": "**Doma, odmor** (~35 min)", "altHint": false, "slot": 2}, {"time": "17:30", "key": "17:30", "text": "Linija 2 → **Sindang** (~30 min)", "altHint": false, "slot": 3}, {"time": "18:00", "key": "18:00", "text": "Večera: **tteokbokki kod bake Mabongrim** — lonac na stolu: rižini kolačići, ramen, mandu, riblji kolači i jaja u ljutom umaku", "altHint": true, "slot": 4}, {"time": "19:15", "key": "19:15", "text": "*Opcija:* koktel u **Jean Frigou** — ulaz kroz vrata hladnjaka u voćarni", "altHint": false, "slot": 5}, {"time": "20:30", "key": "20:30", "text": "🚁 **Drone show, Ttukseom Hangang park** — besplatno, 15 min, glazba od 19:30, ramyeon uz rijeku · *otkazuje se po kiši/vjetru*", "altHint": false, "slot": 6}, {"time": "21:15", "key": "21:15", "text": "Pješke do **Konkuk Univ.** → linija 2 direktno u Hongdae (~35 min)", "altHint": false, "slot": 7}, {"time": "22:00", "key": "22:00", "text": "🎃 **Noć vještica u Hongdaeu** — ulice pune kostima, barovi i šatori; klubovi 1–2 h reda · 5–10 min do kreveta", "altHint": false, "slot": 8}], "plans": [{"label": "Plan B · Hongdae", "replaces": ["17:30", "18:00", "19:15", "20:30", "21:15", "22:00"], "summary": "**Plan B (kiša, umor, vjetar):** cijela večer u Hongdaeu — večera blizu kuće (BBQ ili tržnica Mangwon), Noć vještica od ~20:00, **pub crawl** (subotom u Hongdaeu, 20:00–21:30)", "detail": {"title": "Plan B — cijela večer u Hongdaeu", "meta": [], "md": "*Kiša, vjetar (dronovi otkazani) ili umor.* Večera blizu kuće — **korejski BBQ** ili **tržnica Mangwon** (lokalna tržnica 10 min od stana, 09:00–21:00: pržena piletina, kroketi, rezanci) → Noć vještica od ~20:00 → **Absolute pub crawl** (subotom u Hongdaeu, sastanak u Dokkaebi Party Houseu **20:00–21:30**, ~21 USD, osobna isprava). Nema prelaska grada; nema dronova ni Sindanga.\n\n*Ako Banpo fontana nije bila u petak:* **zadnja večer sezone** — umjesto dronova Banpo u 20:00 ili 20:30, pa Hongdae ~21:45 (oboje ne stane).", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": []}, {"date": "1.11", "d3heading": "NED 1.11. — TAJNI VRT, INWANGSAN I OPROŠTAJNA VEČER", "night": "Noćenje: Seoul II, Yeonnam-dong (Mapo) · Dan 14 od 14", "intro": "⚠️ **Zadnja stvarna večer putovanja.** 2.11. je samo jutro do aerodroma.\n⚠️ **Ispravljeno 9.10.:** **KBO bejzbol 1.11. ne postoji** — Korejska serija počinje tek 2.11. u Suwonu (✔ provjereno). Nedjeljom ne radi Eulji Myeonok. Banpo fontana je završila 31.10.", "stay": "", "slots": [{"timeLabel": "~09:30", "key": "09:30", "title": "🔒 Changdeokgung + Tajni vrt", "meta": ["⏱ 2–3 h", "🌦️ podnosi kišu", "🦵🦵 srednje (vrt je brdovit, staze zemljane)"], "body": "**8 000 ₩ (5 000 vrt + 3 000 palača) · UNESCO · rezervirano 26.10. u 10:00** · ⚠️ ako online nije uspjelo: **otprilike pola karata prodaje se na licu mjesta istog dana od 09:00** → biti na blagajni ~08:30. ✔ provjereno 9.10. Termini na engleskom (**WIP** točno): **10:30 / 11:30 / 14:30 / 15:30**; obilazak vrta je **samo s vodičem, ~90 min**.\n\n**Changdeokgung** je najomiljenija palača dinastije Joseon — kraljevi su u njoj živjeli dulje nego u Gyeongbokgungu, jer se zgrade prirodno uklapaju u brdo umjesto u strogu simetriju. **Huwon (Tajni vrt)** je kraljevski vrt iza palače: šumovito brdo s **jezercem Buyongji** i paviljonom koji stoji jednom nogom u vodi, knjižnicom **Juhamnu**, paviljonima uz potok i stablima starim 300+ godina. **Početak studenog je vrhunac javora** — najteži termin u godini.\n\nMetro: Anguk (L3), izlaz 3, ~5 min. Iz Yeonnam-donga taksi ~25 min.", "alts": [{"title": "Palača bez vrta", "text": "(3 000 ₩) + **Changgyeonggung** kroz spojna vrata (1 000 ₩) — jezero Chundangji i **stakleni staklenik Daeonsil iz 1909.**, bez rezervacije", "meta": ["⏱ 1,5 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~12:30", "key": "12:30", "title": "Ručak: Imun Seolnongtang", "meta": ["⏱ 45 min", "☔ kiša OK", "🦵 lagano"], "body": "**이문설농탕**, Gyeonji-dong (Jongno), ~10 min od palače. **Najstariji restoran u Seoulu (od 1904.).** **Seolleongtang** — volovske kosti kuhane **17 sati** do mliječnobijele juhe, s mekim goveđim prsima i rezancima; **soli se sam za stolom**, uz kimchi i kkakdugi (rotkvu). Jednostavno, toplo, povijesno. **Nedjeljom 08:00–20:30, pauza 15:00–16:30** (**UV**). ~12–15 000 ₩.\n\n*Alternativa:* **Tongin** — kafić s mjedenim novčićima **nedjeljom radi** (1. nedjelja, 11:00–17:00, novčići do 16:00) — ako se 20.10. nije stiglo.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "14:00", "key": "14:00", "title": "Inwangsan, ravna staza (Jarak-gil)", "meta": ["⏱ 1,5–2 h", "☀️ bolje suho", "🦵 lagano"], "body": "⚠️ **Klasična ruta na vrh Inwangsana (338 m) preko Beombawija je ~90 % strmih kamenih i drvenih stepenica i golih granitnih ploča → ❌ za koljeno** (i silazak je najgori dio). Fit dio ekipe može gore zasebno (~1,5 h) dok ostali hodaju donju stazu.\n\n**Ruta za sve:** taksi iz Jongnoa u **Seochon** (~10 min) →\n1. **Dolina Suseong-dong (수성동계곡)** — mala obnovljena dolina na kraju Ogin-donga: borovi, granitne gromade, kameni most iz doba Joseona. Obnovljena 2012. rušenjem betonskih stambenih zgrada. Ravna šljunčana staza.\n2. **Inwangsan Jarak-gil (자락길)** — **drvena staza i asfaltna pješačka traka podno planine**, gotovo bez stepenica.\n3. **Vidikovac Mumu-dae (무무대)** — pogled na **Gyeongbokgung, Plavu kuću (Cheong Wa Dae) i planinu Bugaksan**. Lišće na vrhuncu.\n4. Kraj u **parku Sajik**. Taksi dalje.\n\nGradski zid (iz 1396.) se vidi iznad staze na grebenu.", "alts": [{"title": "Seodaemun Prison", "text": "kišni plan: kolonijalni zatvor (1908.), ćelije od cigle, mjesto pogubljenja, podzemne sobe za ispitivanje; vrlo dobro postavljen. **3 000 ₩, nedjeljom 09:30–18:00** (**UV**), metro Dongnimmun izlaz 5", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Vrh Inwangsana", "text": "samo za one s dobrim koljenima, zasebno", "meta": ["⏱ 1,5 h", "☀️", "🦵🦵🦵"]}, {"title": "Šamanistička tura na Inwangsanu", "text": "~28 €, 2,5 h, s opcionalnom sesijom kod šamanke uz prevoditelja. ⚠️ Gemini kaže da **redovnih tura na engleskom nema** → provjeriti postoji li termin, rezervirati ~25.10. (**WIP**)", "meta": ["⏱ 2,5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "16:00", "key": "16:00", "title": "Opcija: Guksadang i Seonbawi", "meta": ["⏱ 45 min", "🌦️", "🦵🦵 srednje (kratke stepenice)"], "body": "S druge strane planine, **~15 min uzbrdo od stanice Dongnimmun (L3), izlaz 2** (ili taksi iz parka Sajik). **Guksadang (국사당)** je **aktivno šamanističko svetište** (preseljeno s Namsana za japanske okupacije), gdje se i danas održavaju obredi **gut** — bubnjevi, plesovi, ponude hrane. Iznad su **Seonbawi (선바위)** — **izlizani granitni stupovi nalik redovnicima u halji**, gdje šamanke i žene mole za blagoslov. Gledati s distance, ne fotografirati obrede izbliza. Najneobičnije \"samo-u-Koreji\" mjesto u Seoulu, a besplatno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "17:30", "key": "17:30", "title": "Zalazak ili Seoul Sky", "meta": [], "body": "Zalazak ~17:30 — s Inwangsana ili Mumu-daea pogled na grad u sumrak. **Ako Seoul Sky nije bio 20.10.:** taksi/metro do Jamsila (~50 min) — ulaz u ~17:00 za zalazak znači krenuti s Inwangsana oko 16:00 (Guksadang otpada).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "Zadnja večera: dvije ravnopravne opcije", "meta": ["⏱ 2–3 h", "☔", "🦵 lagano"], "body": "**A) Oproštaj u Seochonu** (gdje šetnja i završava)\n- **Tosokchon Samgyetang (토속촌 삼계탕)**, Chebu-dong, zapadno od Gyeongbokgunga — **samgyetang**: cijela mala piletina punjena ljepljivom rižom, korijenom ginsenga, češnjakom i žižulama, kuhana u mliječnoj juhi; sve kuhano. **10:30–21:30, svaki dan.** Slavno, **redovi** (brzo se izmjenjuju). ~20–25 000 ₩. ⚠️ Dio sjedenja je **na podu** — tražiti stol (Lucija).\n- **Bar Cham (참)**, Tongin-dong, 5 min pješke — koktel-bar u **hanoku**, na listi **Asia's 50 Best Bars**, kokteli s korejskim žestokim pićima (soju, makgeolli, omija, ginseng). **Sri–pon 18:00–01:00, utorkom zatvoreno** → **nedjelja radi** (Time Out; **UV**). Bez rezervacije ili preko CatchTablea.\n- Taksi doma ~25 min.\n\n**B) Oproštaj blizu kuće**\n- Zadnji **korejski BBQ** (npr. Yukmong ako se svidio, ili bilo koji samgyeopsal s redom domaćih) ili restoran u **Yeonnam-dongu** (mnogo malih restorana uz Gyeongui Line Forest Park).\n- Piće u Hongdaeu ili kod kuće — **5 min do kreveta i kofera**. Mirnije, ranije u krevet prije aerodroma.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "22:00", "key": "22:00", "title": "Pakiranje", "meta": [], "body": "Kofere spakirati večeras. Ujutro nema vremena (vidi 2.11.).", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Tajni vrt nije rezerviran →** blagajna u 08:30, ili palača + Changgyeonggung\n- **Kiša →** Inwangsan → Seodaemun Prison; večer B\n- **Seoul Sky nije odrađen →** Jamsil u 17:00, Guksadang otpada, večer B (ili večera u Jamsilu)\n- **Koljeno →** samo dolina Suseong-dong i Mumu-dae, bez Guksadanga\n- **Svi umorni →** večer B", "heading": "Ned 1.11. — Tajni vrt, Inwangsan i oproštajna večer", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": null, "rows": [{"time": "~09:30", "key": "09:30", "text": "🔒 **Changdeokgung + Tajni vrt** — termin ovisi o rezervaciji 26.10. (engleski 10:30 / 11:30 / 14:30 / 15:30) · *ako online nije uspjelo: blagajna u ~08:30*", "altHint": true, "slot": 0}, {"time": "~12:30", "key": "12:30", "text": "Ručak: **Imun Seolnongtang** — mliječnobijela juha od volovskih kostiju s prsima, od 1904., 10 min od palače", "altHint": false, "slot": 1}, {"time": "14:00", "key": "14:00", "text": "Taksi u Seochon → **dolina Suseong-dong** → **ravna staza Inwangsan Jarak-gil** do vidikovca **Mumu-dae** (pogled na palaču i Plavu kuću) → park Sajik · ~1,5 h · *vrh po stepenicama ❌ za koljeno*", "altHint": true, "slot": 2}, {"time": "16:00", "key": "16:00", "text": "*Opcija:* **šamansko svetište Guksadang + stijene Seonbawi** (taksi oko brda, kratke stepenice)", "altHint": false, "slot": 3}, {"time": "17:30", "key": "17:30", "text": "Zalazak s Inwangsana · *ili* **Seoul Sky** ako nije bio 20.10.", "altHint": false, "slot": 4}, {"time": "19:00", "key": "19:00", "text": "**Zadnja večera — dvije ravnopravne opcije:** **A) Seochon** — **Tosokchon** (cijela mala piletina punjena rižom i ginsengom u juhi) pa **Bar Cham** (koktel-bar u hanoku, Asia's 50 Best) · **B) blizu kuće** — zadnji **korejski BBQ** ili restoran u Yeonnam-dongu, piće u Hongdaeu", "altHint": false, "slot": 5}, {"time": "22:00", "key": "22:00", "text": "Doma, **pakiranje** — sutra rano na aerodrom", "altHint": false, "slot": 6}], "plans": [], "leftPlans3": [], "decisions": []}, {"date": "2.11", "d3heading": "PON 2.11. — ODLAZAK (KE937, T2, 11:55 → BEČ 16:55)", "night": "", "intro": "**Plan: AREX all-stop s Hongik Univ.** — 5 min od stana, ravno do T2, ~5 000 ₩. ⚠️ **AREX express ne staje na Hongik Univ.** (✔ provjereno 9.10.) — stari plan \"express sa Seoul Stationa\" vrijedio je za bazu u centru. Gradski check-in na Seoul Stationu (ponovo otvoren u kolovozu 2026., Korean Air da, rok za T2 **3 h 20 min prije leta = 08:35**) od nas traži raniji polazak i dva taksija — ne isplati se.\n\n**Rezerva: jumbo taksi**, ako je kiša, ako je netko bolestan ili ako se ne da vući kofere — **naručiti večer prije** (vidi dolje).", "stay": "", "slots": [{"timeLabel": "Večer prije", "key": "večer prije", "title": "Večer prije (ned 1.11.)", "meta": [], "body": "- **Kofere spakirati** i izvagati (Korean Air obično 1 × 23 kg; **WIP** točna karta).\n- **Doručak za jutro** iz 7-Elevena (26 m od stana): kimbap, sendviči, kava.\n- **T-money kartice** napuniti za ~6 000 ₩ svaka (AREX all-stop ~5 000 ₩) — ili provjeriti radi li beskontaktno plaćanje stranom karticom.\n- **Online check-in** Korean Air (otvara se 48 h prije) — sjedala, digitalna karta.\n- Ako ide rezerva: **jumbo taksi naručiti za 07:45** (Kakao T → \"Jumbo\"/\"Venti\", ili zamoliti hosta).\n- Poruka hostu o odlasku / gdje ostaviti ključ.", "alts": [], "altNotes": [], "after": ""}], "info": [{"title": "Kontrolne točke (srednje-optimistični scenarij)", "md": "| Vrijeme | Točka | Napomena |\n|---|---|---|\n| **06:30** | Ustajanje | Tuš, doručak u stanu. |\n| **07:15** | Zadnja provjera | Putovnice, telefoni, punjači, tablete, račune za tax refund **u ručnu prtljagu**. Smeće, ključ. |\n| **07:25** | Izlazak | Pješke **~360 m do AREX ulaza Hongik Univ. (izlaz 3)**, ~8 min s koferima. |\n| **07:35** | Peron | AREX je duboko pod zemljom — **dizala** (pratiti znak 엘리베이터), ne pokretne stepenice s koferima. Ulaz T-money karticom. Smjer **인천공항 (Incheon Airport)**. Vlakovi ~svakih 6–12 min. |\n| **~07:45** | 🚆 Ukrcaj, AREX all-stop | Stati uz kraj vagona s koferima. **~56 min do T2** (procjena; Seoul Station → T2 je 66 min). Prvo staje T1 (~08:35) — **ne izlaziti**, Korean Air je na **T2**. |\n| **~08:41** | Stanica Incheon T2 | Prometni centar (B1) → dizalom na **3. kat, odlasci**. ~10 min. |\n| **~08:55** | Odlazna dvorana | *Ako treba:* **tax refund kiosk** (skenira putovnicu i račune), ili carina za ovjeru robe koja ide u predanu prtljagu. Inače ravno na check-in. Korean Air check-in otvara **3 h prije = 08:55**. |\n| **~09:10** | Check-in + predaja kofera | Korean Air šalteri (ili samoposlužni kiosk + bag drop). Red 15–30 min. **Zatvara 1 h prije leta (10:55).** |\n| **~09:45** | Sigurnosna kontrola | Tekućine do 100 ml u vrećici, laptopi van. 15–25 min. |\n| **~10:10** | Izlazna kontrola putovnica | Šalteri za strance (ili automatska vrata ako ste registrirani). 5–15 min. |\n| **~10:20** | Iza kontrole | **Povrat poreza u gotovini** na kioscima iza kontrole (Gemini: blizu izlaza 249/253 — **UV**). Zadnji korejski doručak (food court T2), duty-free. |\n| **~11:00** | Prema izlazu | T2 izlazi 230–270, sve u jednoj zgradi, do 10 min hoda. |\n| **~11:15** | Ukrcaj počinje | ~40 min prije polaska. **Vrata zatvaraju ~11:40.** |\n| **11:55** | ✈️ **KE937 → Beč 16:55** | |\n\n**Rezerva u vremenu:** ~1 h. **Najkasniji siguran izlazak iz stana: ~08:15** (T2 ~09:30, check-in do 10:55 i dalje stane, ali bez doručka i duty-freeja).", "top": false}, {"title": "Povrat poreza (tax refund)", "md": "PDV je 10 %, stvarni povrat nakon naknada **5–8 % cijene**. **Trenutni povrat u trgovini** (pokazati putovnicu) za račune od 15 000 ₩ — najjednostavnije. Na ICN-u: kiosk skenira putovnicu i račune; **roba koju carina možda želi vidjeti ide u ručnu prtljagu**, ne u kofer. Iznosi do ~75 000 ₩ obično bez pregleda (**UV**).", "top": false}], "triggers": "", "heading": "Pon 2.11. — Odlazak (KE937, T2, 11:55)", "city": "seoul-ii-yeonnam-dong-mapo-hongdae", "transfer": "", "flash": null, "rows": [{"time": "Večer prije", "key": "večer prije", "text": "**Večer prije (ned 1.11.)**", "altHint": false, "slot": 0, "d3only": true}, {"time": "06:30", "key": "06:30", "text": "Ustajanje — kofere spakirane večer prije", "altHint": false, "slot": null}, {"time": "07:25", "key": "07:25", "text": "Izlazak · pješke ~360 m do AREX ulaza (Hongik Univ., izlaz 3)", "altHint": false, "slot": null}, {"time": "~07:45", "key": "07:45", "text": "🚆 **AREX all-stop → Incheon T2**, ~56 min, ~5 000 ₩ · *express ovdje ne staje*", "altHint": false, "slot": null}, {"time": "~08:45", "key": "08:45", "text": "T2 → dizalom na 3. kat (odlasci) · tax refund kiosk ako treba", "altHint": false, "slot": null}, {"time": "09:10", "key": "09:10", "text": "Korean Air check-in i predaja kofera", "altHint": false, "slot": null}, {"time": "09:45", "key": "09:45", "text": "Sigurnosna kontrola + izlazna kontrola putovnica", "altHint": false, "slot": null}, {"time": "10:15", "key": "10:15", "text": "Iza kontrole: zadnji korejski obrok, duty-free, povrat poreza (gotovina)", "altHint": false, "slot": null}, {"time": "11:15", "key": "11:15", "text": "Ukrcaj (vrata zatvaraju ~11:40) · **11:55 KE937 → Beč 16:55**", "altHint": false, "slot": null}], "plans": [{"label": "Rezerva · jumbo taksi", "replaces": ["07:25", "07:45"], "summary": "**Rezerva: jumbo taksi** (Staria/Carnival) od vrata do T2, 07:45 → ~09:00, ~65–100 000 ₩ + ~8 000 ₩ cestarine · **naručiti večer prije** (Kakao T \"Jumbo\" ili preko hosta)", "detail": {"title": "Rezerva — jumbo taksi", "meta": [], "md": "**Van taksi (Kia Carnival / Hyundai Staria) za 4 osobe + 4 velika kofera**, od vrata do vrata (odlasci T2, 3. kat).\n- **Naručiti večer prije za 07:45** — Kakao T aplikacija (\"Jumbo\" / \"Venti\", traži registraciju i stranu karticu — **testirati ranije**), ili **zamoliti hosta** da naruči.\n- **~60–75 min**, **~65 000–100 000 ₩ + ~7 900 ₩ cestarine** → ~20–27 000 ₩ po osobi.\n- ⚠️ **Obični taksi ne stane** (4 osobe + 4 kofera). **Aerodromski bus se ne preporučuje** (jutarnja gužva 70–90 min).\n- Dolazak ~09:00 → isti raspored od check-ina dalje.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": []}], "cities": {"seoul": {"id": "seoul", "name": "SEOUL", "heading": "🏙️ SEOUL", "intro": "🏨 **Seoul I (19.–21.10.):** Trosobni apartman #101 · 서울 종로구 율곡로23가길 12, 101호 · Dongdaemun (L1, L4) ~600 m · check-in od 16:00 · [Naver Map](nmap://place?lat=37.576026&lng=127.006617&name=Seoul%20I%20Apartment&appname=com.sokogeo)\n\nGrad svjetske klase koji većina itinerara podcjenjuje — palače, tržnice, planine usred grada i noćni život koji ne staje. Jesenje boje sazrijevaju kroz putovanje: rano-srednje na dolasku, na vrhuncu 31.10.–1.11.\n\n**Temperature:** 19.–22.10. dan 20–22 °C, noć 10–12 °C · 1.11. dan 13–14 °C, noć 5–6 °C — za zadnju večer treba pravi kaput.\n\n⚠️ **Gyeongbokgung je zatvoren utorkom, Changdeokgung ponedjeljkom** — obje su u drugom boravku.", "extras": {"heading": "🧱 DODATNE OPCIJE — SEOUL I (Jongno, 19.–20.10.)", "md": "Aktivnosti koje nisu vezane za termin — ubacuju se gdje ostane rupa ili gdje nešto otpadne. Ponedjeljak navečer: dio Hongdae barova ne radi.\n\n| Opcija | Što | ⏱ | Vrijeme | 🦵 |\n|---|---|---|---|---|\n| **Sewoon Sangga deck** | kompleks iz 1960-ih između Jongna i Euljira, povišena šetnica, kafići i stare elektroničke radnje · pon–sub 09:00–19:00 | 45 min | 🌦️ | lagano |\n| **Ramyeon automat uz rijeku Han** | kupiš paket u dućanu (4–5 000 ₩), skeniraš zdjelu, aparat sam skuha — noćni seulski ritual (Yeouido, Banpo, Ttukseom) | 30 min | 🌦️ | lagano |\n| **Namdaemun ulice hrane** | ulica pirjane ribe hairtail (galchi-jorim) i ulica kalguksua · pon–sub 06:00–20:00, **nedjeljom zatvoreno** | 1 h | 🌦️ | lagano |\n| **Tosokchon samgyetang** | piletina punjena rižom u juhi od ginsenga, 20–25 000 ₩, kod Gyeongbokgunga, 10:00–22:00 · ⚠️ **sjedi se na podu prekriženih nogu — loše za Lucijino koljeno** | 1 h | ☔ | lagano |\n| **Bar Sookhee (숙희)** | skriveni koktel bar u hanok stilu, Euljiro · 20–25 000 ₩ + couvert 5–10 000 ₩ · 18:00–02:00 | 1,5 h | ☔ | lagano |\n| **Jean Frigo (장프리고)** | bar iza vrata hladnjaka u voćarni, narudžba preko starih telefona · pon–sub 18:00–01:30 · **WIP lokacija** (Jung-gu ili Seongsu) | 1,5 h | ☔ | lagano |\n| **Naksan park + gradski zid** | iza apartmana, osvijetljen noću, besplatno | 1 h | ☀️ | srednje |\n| **Coin noraebang** | 500 ₩ za 1–2 pjesme, engleske pjesme preko gumba \"country\" | 30 min | ☔ | lagano |\n| **Glow bowling** | Smashing Bowl (24 h) ili Taehwa, Hongdae | 1,5 h |
