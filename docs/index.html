<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: poster-map palette (pale sea, pale land, navy ink). Phone: day strip under a sticky bar, timeline with pins. ≥900px: navy day rail left, day card right. */
:root {
  --sea: #cfe2f1;
  --sea-deep: #b9d4ea;
  --land: #eaf2e3;
  --bg: #e9f1f7;
  --surface: #ffffff;
  --sunk: #eef4f9;
  --ink: #16284f;
  --muted: #5b6b8a;
  --line: #d4e0ec;
  --navy: #1f3f8f;
  --navy-ink: #ffffff;
  --accent: #1f3f8f;
  --accent-soft: #dde7f7;
  --plan: #7a2d8e;
  --plan-soft: #f0e2f4;
  --warn: #a35a0a;
  --warn-soft: #fbeedb;
  --hot: #c23b2b;
  --hot-soft: #fae2de;
  --ok: #17805c;
  --ok-soft: #dcf2e8;
  --hand: #3b5bb8;
  --c-seoul: #2a5bc4;
  --c-sokcho: #8a2a8f;
  --c-gyeongju: #178a66;
  --c-busan: #ea7a1f;
  --c-seoul2: #2a5bc4;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-hand: "Caveat", "Bradley Hand", cursive;
  --f-body: "Nunito Sans", "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgb(22 40 79 / .06), 0 6px 18px rgb(22 40 79 / .08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #13213d; --sea-deep: #0f1a30; --land: #16243a; --bg: #0d1628; --surface: #16233a; --sunk: #1c2b45; --ink: #e6edf8; --muted: #93a4c4; --line: #2a3a58;
    --navy: #3b64c9; --navy-ink: #ffffff; --accent: #8fb0f0; --accent-soft: #22335a; --plan: #d79be0; --plan-soft: #35224a;
    --warn: #f0b35c; --warn-soft: #3b2a12; --hot: #f58c7e; --hot-soft: #40201c; --ok: #6fd3a6; --ok-soft: #16342a; --hand: #9db6f3;
    --c-seoul: #7ea0ec; --c-sokcho: #d583d9; --c-gyeongju: #5fcaa3; --c-busan: #f3a05a; --c-seoul2: #7ea0ec;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #13213d; --sea-deep: #0f1a30; --land: #16243a; --bg: #0d1628; --surface: #16233a; --sunk: #1c2b45; --ink: #e6edf8; --muted: #93a4c4; --line: #2a3a58;
  --navy: #3b64c9; --navy-ink: #ffffff; --accent: #8fb0f0; --accent-soft: #22335a; --plan: #d79be0; --plan-soft: #35224a;
  --warn: #f0b35c; --warn-soft: #3b2a12; --hot: #f58c7e; --hot-soft: #40201c; --ok: #6fd3a6; --ok-soft: #16342a; --hand: #9db6f3;
  --c-seoul: #7ea0ec; --c-sokcho: #d583d9; --c-gyeongju: #5fcaa3; --c-busan: #f3a05a; --c-seoul2: #7ea0ec;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15.5px/1.55 var(--f-body); }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
strong { font-weight: 700; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 10px; }


/* ---------- sticky bar ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); box-shadow: 0 1px 0 var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 6px 4px; }
.tabs::-webkit-scrollbar, .strip::-webkit-scrollbar, .seg::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: none; padding: 6px 12px; border-radius: 999px; font: 700 .95rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--navy); color: var(--navy-ink); }
.tab .n { font-size: .72rem; margin-left: 5px; padding: 0 5px; border-radius: 999px; background: var(--hot-soft); color: var(--hot); vertical-align: 2px; }
.tab[aria-selected="true"] .n { background: rgb(255 255 255 / .22); color: var(--navy-ink); }

.strip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 10px; scroll-snap-type: x proximity; }
.dpill { flex: none; scroll-snap-align: center; width: 56px; border: 0; background: var(--surface); border-radius: 10px; padding: 6px 0 5px; text-align: center; cursor: pointer; position: relative; box-shadow: 0 1px 0 var(--line); }
.dpill .w { display: block; font: 600 .66rem var(--f-display); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.dpill .d { display: block; font: 800 1.35rem/1.05 var(--f-display); color: var(--cc); }
.dpill .m { display: block; font: 600 .62rem var(--f-display); color: var(--muted); letter-spacing: .05em; }
.dpill[aria-current="true"] { background: var(--cc); }
.dpill[aria-current="true"] .w, .dpill[aria-current="true"] .d, .dpill[aria-current="true"] .m { color: #fff; }
.dpill.move::before { content: "→"; position: absolute; top: 3px; right: 5px; font: 700 .62rem var(--f-display); color: var(--muted); }
.dpill[aria-current="true"].move::before { color: rgb(255 255 255 / .8); }

/* ---------- layout ---------- */
.layout { display: block; padding-block: 16px 60px; }
.rail { display: none; }
main { min-width: 0; }
@media (min-width: 900px) {
  .strip { display: none; }
  .layout.days { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; align-items: start; }
  .layout.days .rail { display: block; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 72px); overflow-y: auto; background: var(--navy); color: #fff; border-radius: var(--r); padding: 10px 8px 14px; box-shadow: var(--shadow); }
  .rail .city { font: 700 .7rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: rgb(255 255 255 / .6); padding: 12px 12px 4px; }
  .rail button { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 9px; cursor: pointer; color: #fff; width: 100%; position: relative; }
  .rail button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); border: 2px solid #fff; margin-top: 5px; box-shadow: 0 0 0 2px var(--navy); }
  .rail button::after { content: ""; position: absolute; left: 16px; top: 22px; bottom: -8px; width: 2px; background: rgb(255 255 255 / .18); }
  .rail button:last-child::after { display: none; }
  .rail button:hover { background: rgb(255 255 255 / .08); }
  .rail button[aria-current="true"] { background: #fff; color: var(--ink); }
  .rail button[aria-current="true"]::before { box-shadow: 0 0 0 2px #fff; }
  .rail .rd { font: 700 .78rem var(--f-display); letter-spacing: .06em; opacity: .75; display: block; }
  .rail .rt { font-size: .86rem; line-height: 1.25; display: block; }
}

/* ---------- day head ---------- */
.dayline { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px; font: 800 1.3rem/1.1 var(--f-display); text-transform: uppercase; color: var(--navy); min-width: 0; }
.dayline .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); }
.dayline .dn { flex: none; color: var(--cc); }
.dayline .dtt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-bottom: 8px; }
.qrow button { border: 0; background: var(--surface); border-radius: 9px; padding: 7px 4px; font: 700 .72rem var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--navy); cursor: pointer; box-shadow: 0 1px 0 var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qrow button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.qrow button:disabled { opacity: .35; cursor: default; }
.qpanel { background: var(--surface); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
.qpanel .md h4 { margin-top: .6em; }

/* ---------- blocks ---------- */
.stack { display: grid; gap: 10px; }
.callout { border-radius: 12px; padding: 10px 14px; background: var(--sunk); font-size: .92rem; }
.callout > :first-child { margin-top: 0; } .callout > :last-child { margin-bottom: 0; }
.callout.decide { background: var(--hot-soft); }
.callout.transfer { background: var(--sea); }
.md p { margin: .45em 0; }
.md ul, .md ol { margin: .4em 0; padding-left: 1.2em; }
.md li { margin: .2em 0; }
.md li::marker { color: var(--muted); }
.md h3, .md h4 { font: 700 1.15rem/1.2 var(--f-display); margin: 1em 0 .3em; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); }
.md blockquote { margin: .5em 0; padding-left: 12px; border-left: 3px solid var(--sea-deep); color: var(--muted); font: 500 1.15rem/1.3 var(--f-hand); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 1em 0; }
.md em { color: var(--muted); }
.md p.c-warn, .md p.c-decide, .md p.c-ok, .md p.c-tip { padding: 8px 12px; border-radius: 10px; }
.md p.c-warn { background: var(--warn-soft); }
.md p.c-decide { background: var(--hot-soft); }
.md p.c-ok { background: var(--ok-soft); }
.md p.c-tip { background: var(--accent-soft); }
.wip { font: 700 .66rem var(--f-display); letter-spacing: .08em; padding: 1px 5px; border-radius: 4px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.map { white-space: nowrap; }

.xlist { display: grid; gap: 6px; margin: .6em 0; }
.xitem { padding: 8px 0; border-bottom: 1px solid var(--line); }
.xitem .xt { font-weight: 700; }
.xitem .xd { font-size: .86rem; color: var(--muted); }
.xitem .chips { margin-top: 3px; }
.tbl { overflow-x: auto; margin: .6em 0; }
.tbl table { border-collapse: collapse; width: 100%; font-size: .86rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.tbl th { font: 700 .72rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(70px, max-content) minmax(0, 1fr); gap: 0 14px; margin: .6em 0; font-size: .88rem; }
.kv > div { padding: 6px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv .k { font: 700 .74rem/1.7 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 640px) {
  .tbl.stackable table, .tbl.stackable tbody, .tbl.stackable tr, .tbl.stackable td { display: block; }
  .tbl.stackable thead { display: none; }
  .tbl.stackable tr { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-bottom: 8px; background: var(--surface); }
  .tbl.stackable td { border: 0; padding: 3px 0; }
  .tbl.stackable td:first-child { font-weight: 700; }
  .tbl.stackable td:not(:first-child)[data-l]::before { content: attr(data-l) "  "; font: 700 .66rem var(--f-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
}

details.fold { border-radius: 12px; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
details.fold > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: flex; align-items: center; gap: 10px; font: 700 1.02rem var(--f-display); letter-spacing: .03em; text-transform: uppercase; color: var(--navy); }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; margin-left: auto; font: 600 1.2rem var(--f-display); color: var(--muted); }
details.fold[open] > summary::after { content: "−"; }
details.fold > summary .hint { font: 600 .72rem var(--f-display); letter-spacing: .08em; color: var(--muted); }
details.fold > .md, details.fold > .inner { padding: 0 14px 12px; }

/* ---------- plan switch ---------- */
.plans { display: grid; gap: 6px; }
.seg { display: flex; gap: 4px; padding: 4px; background: var(--sunk); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 12px; font: 700 .9rem var(--f-display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--navy); color: var(--navy-ink); }
.seg button[aria-pressed="true"].b { background: var(--plan); }

/* ---------- timeline ---------- */
.tl { list-style: none; margin: 0 -10px; padding: 0; display: grid; position: relative; background: var(--surface); box-shadow: var(--shadow); padding-block: 4px; }
@media (min-width: 900px) { .tl { margin: 0; border-radius: var(--r); } }
.tl::before { content: ""; position: absolute; left: 59px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
.tl > li { position: relative; }
.tl > li.part { padding: 10px 8px 2px 70px; font: 700 .68rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.tl > li.part::before { content: ""; position: absolute; left: 54px; top: 12px; width: 12px; height: 12px; border-radius: 50%; background: var(--cc); border: 2px solid var(--surface); }
.row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 4px 6px; width: 100%; text-align: left; background: none; border: 0; padding: 9px 8px; cursor: default; align-items: start; position: relative; }
.row::before { content: ""; position: absolute; left: 56px; top: 16px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--cc); }
button.row { cursor: pointer; border-radius: 10px; }
button.row:hover { background: var(--sunk); }
.time { font: 700 .88rem/1.5 var(--f-display); color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: .03em; text-align: right; overflow-wrap: anywhere; }
.time.soft { color: var(--muted); font-size: .62rem; line-height: 1.2; padding-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
.txt { min-width: 0; font-size: .93rem; color: var(--ink); padding-left: 14px; }
.txt p { margin: 0; }
.chev { font: 600 1rem var(--f-display); color: var(--muted); transition: transform .15s; padding-top: 1px; }
li.open .chev { transform: rotate(90deg); }
li.open > .row { background: var(--sunk); border-radius: 10px 10px 0 0; }
.chips { display: flex; flex-wrap: nowrap; gap: 4px; margin-top: 4px; overflow: hidden; }
.chips.wrap { flex-wrap: wrap; }
.chip { font: 600 .68rem/1.5 var(--f-display); letter-spacing: .05em; padding: 0 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.chip.alt { background: var(--accent-soft); color: var(--accent); }
.chip.pick { background: var(--ok-soft); color: var(--ok); text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
.detail { margin: 0 8px 10px; padding: 12px 12px 14px 62px; display: grid; gap: 12px; background: var(--sunk); border-radius: 0 0 10px 10px; }
@media (max-width: 560px) { .detail { padding-left: 10px; } }
.detail .md { font-size: .9rem; max-width: 72ch; }
.dtitle { font: 700 1.2rem/1.2 var(--f-display); margin: 0; text-transform: uppercase; letter-spacing: .03em; color: var(--navy); }
li.gone .row { opacity: .45; }
li.gone .txt { text-decoration: line-through; text-decoration-color: var(--muted); }

li.plancard { padding: 10px 8px; }
.pcard { border-radius: 12px; background: var(--plan-soft); padding: 12px 14px; display: grid; gap: 8px; border-left: 4px solid var(--plan); }
.pcard .ph { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pcard .ph b { font: 800 1.2rem var(--f-display); color: var(--plan); text-transform: uppercase; letter-spacing: .03em; }
.pcard .md { font-size: .9rem; }
.pcard .tbl td, .pcard .kv > div { border-color: color-mix(in srgb, var(--plan) 25%, transparent); }

/* alternatives */
.alts { display: grid; gap: 8px; }
.alts .ah { font: 700 .72rem var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: min(82%, 300px); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
@media (min-width: 900px) { .cards { grid-auto-flow: row; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); overflow: visible; } }
.acard { scroll-snap-align: start; border-radius: 12px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; box-shadow: 0 1px 0 var(--line); }
.acard.sel { box-shadow: inset 0 0 0 2px var(--ok); }
.acard .at { font: 700 1.05rem/1.2 var(--f-display); letter-spacing: .02em; }
.acard .md { font-size: .84rem; color: var(--muted); flex: 1; }
.acard .md strong { color: var(--ink); }
.acard .chips { margin-top: 0; }
.pickbtn { align-self: flex-start; margin-top: 4px; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; font-size: .78rem; cursor: pointer; color: var(--muted); }
.pickbtn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.pickbtn:disabled { opacity: .5; cursor: not-allowed; }
.anote { font-size: .82rem; color: var(--muted); margin: 0; }

/* triggers */
.trig { list-style: none; margin: 0; padding: 4px 14px; display: grid; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
.trig li { display: grid; grid-template-columns: minmax(0, 12em) minmax(0, 1fr); gap: 2px 12px; font-size: .88rem; padding: 9px 0; border-bottom: 1px solid var(--line); }
.trig li:last-child { border-bottom: 0; }
.trig .if { font: 700 .95rem var(--f-display); letter-spacing: .03em; color: var(--hot); }
@media (max-width: 520px) { .trig li { grid-template-columns: 1fr; } }

.sect { font: 800 1.05rem var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--navy); margin: 22px 0 8px; display: flex; align-items: center; gap: 10px; }
.sect::after { content: ""; flex: 1; height: 2px; background: var(--sea-deep); border-radius: 2px; }
.pager { display: flex; justify-content: space-between; gap: 10px; margin-top: 26px; }
.pager button { border: 0; background: var(--surface); border-radius: var(--r); padding: 10px 14px; cursor: pointer; text-align: left; min-width: 0; flex: 1; box-shadow: var(--shadow); }
.pager button:last-child { text-align: right; }
.pager small { display: block; font: 700 .7rem var(--f-display); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.pager span { font-size: .86rem; font-weight: 600; }

/* ---------- other tabs ---------- */
.page h2 { font: 800 2rem/1 var(--f-display); margin: 0 0 6px; text-transform: uppercase; color: var(--navy); }
.page .intro { color: var(--muted); max-width: 68ch; margin: 0 0 16px; }
.hero { border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); background: var(--sea); margin-bottom: 18px; }
.hero img { display: block; width: 100%; height: auto; }
@media (min-width: 900px) {
  .page.pregled { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 0 28px; align-items: start; }
  .page.pregled .hero { grid-row: 1 / span 6; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); margin: 0; }
}
.hand { font: 500 1.35rem/1.25 var(--f-hand); color: var(--hand); margin: 0 0 14px; }
.flash { list-style: none; padding: 0; margin: 0; display: grid; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); position: relative; padding-block: 4px; }

 se u blagovaonici tržnice.\n\n⚠️ **Utorkom 11:00–16:00, novčići se prodaju do 15:00.** Zatvoreno ponedjeljkom i treće nedjelje u mjesecu.\n\n**Ne propustiti: gireum tteokbokki** — rižini kolačići prženi u tavi s čilijem i soja-umakom; ti štandovi rade neovisno o blagovaonici i otvoreni su svaki dan.", "alts": [{"title": "Plan B: Hwangsaengga Kalguksu (황생가칼국수)", "text": "78 Bukchon-ro 5-gil, nasuprot MMCA, na rubu Bukchona (Anguk izlaz 1, ~8 min). Debeli ručno rezani rezanci u mliječnoj juhi od goveđih kostiju **11 000 ₩**, veliki domaći mandu 11 000 ₩ — slažu ih iza stakla na ulazu. Svaki dan 11:00–21:30 bez pauze. **Red 20–40 min u vrijeme ručka.** Kad ste pregladni ili umorni za šetnju do Tongina", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Namdaemun tržnica", "text": "kaos, ulična hrana i jeftine naočale", "meta": ["⏱ 1,5 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "13:15", "key": "13:15", "title": "Nacionalni muzej Koreje", "meta": ["⏱ 2–2,5 h", "☔ kiša OK", "🦵 lagano"], "body": "Metro: Ichon (L4), izlaz 2, natkriveni prilaz. **Besplatno.** ✅ **Otvoren svaki dan** (uto 10:00–18:00; sri i sub do 21:00) — zatvoren samo za Novu godinu, Seollal i Chuseok.\n\n- **Zlatne krune kraljevstva Silla** — vidjeti ih prije Gyeongjua daje tamošnjim humcima pravi kontekst.\n- **\"Soba tihe kontemplacije\" (사유의 방)** na 2. katu — dva Bude u razmišljanju (nacionalno blago) u zamračenoj sobi. Besplatno, bez rezervacije.\n\nKrenuti prema Jamsilu najkasnije u **15:45** (~35–40 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Seoul Sky", "meta": ["⏱ 1,5–2 h", "☀️ treba suho (treba vidljivost)", "🦵 lagano"], "body": "Metro: Jamsil (L2, L8), izlaz 1–2, direktno u toranj. **31 000 ₩** odrasli (Fast Pass 62 000 ₩), ned–čet 10:30–22:00. Računati 1,5–2 h sa sigurnosnom kontrolom i dizalom; utorkom red ~15–25 min.\n\nZgrada od 555 m, vidikovac na katovima 117–123 (~500 m) i stakleni pod na Sky Decku — jedan od najviših vidiko  pp**. 18:00–02:00. Mirniji i skuplji.\n- **Jean Frigo (장프리고)** — ulaz kroz vrata hladnjaka u voćarni, narudžba preko starih telefona. Kokteli 16–20 000 ₩, pon–sub 18:00–01:30. ⚠️ **WIP lokacija** — Gemini daje 9-8 Toegye-ro 62-gil (Jung-gu, kod DDP-a), raniji izvori Seongsu.\n- **Ace Four Club** — ako nije odrađen u ponedjeljak.", "alts": [{"title": "Naksan zid noću", "text": "ako nije bio ujutro; osvijetljen, 5 min od apartmana", "meta": ["⏱ 45 min", "☀️", "🦵🦵"]}, {"title": "Nogari Alley", "text": "ako jučer nije uspio (kiša)", "meta": ["⏱ 1–2 h", "☀️", "🦵"]}, {"title": "Noraebang", "text": "", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Prespavali ste →** Naksan se seli na večer, dan počinje Jogyesom\n- **Kiša →** izbaciti Bukchon i Deoksugung, produžiti muzej, dodati Gyeongdong + Starbucks 1960\n- **Loša vidljivost →** Seoul Sky na 1.11.; večer: Gwangjang ili Dongdaemun noću\n- **Koljeno tišti →** izbaciti Bukchon i Naksan\n- **Gladni prije Tongina →** Hwangsaengga kalguksu odmah uz Bukchon\n- **Kasnite na Deoksugung (zadnji ulaz 20:00) →** ravno na večeru i u barove", "heading": "Uto 20.10. - Puni dan", "city": "seoul", "transfer": "", "flash": null, "rows": [{"time": "08:30", "key": "08:30", "text": "**Naksan gradski zid** — iza apartmana, ~45 min · *ako se ne stigne ujutro → navečer, osvijetljen je*", "altHint": false, "slot": 0}, {"time": "09:30", "key": "09:30", "text": "**Jogyesa** — budistički hram u centru, festival krizantema (početak listopada – sredina studenog)", "altHint": false, "slot": 1}, {"time": "10:15", "key": "10:15", "text": "**Bukchon** — tek **poslije 10:00** (zabrana prije), 30–45 min prolaz", "altHint": true, "slot": 2}, {"time": "11:15", "key": "11:15", "text": "**Tongin tržnica** — mjedeni novčići (10 000 ₩ = 20 kom), puniš pladanj po štandovima · **Plan B: Hwangsaengga kalguksu** odmah uz Bukchon", "altHint": true, "slot": 3}, {"time": "13:15", "key": "13:15", "text": "**Nacionalni muzej Koreje** — besplatan, Silla zlato *prije* Gyeongjua · do ~15:30", "altHint": false, "slot": 4}, {"time": "16:30", "key": "16:30", "text": "**Seoul Sky** — **ulaz u 16:30–17:00 rezervirati**, zalazak ~17:45", "altHint": true, "slot": 5}, {"time": "19:15", "key": "19:15", "text": "**Deoksugung + Doldam-gil** noću (zadnji ulaz 20:00) · *ili zamjena za ludi seulski izlazak — TBD*", "altHint": true, "slot": 6}, {"time": "20:15", "key": "20:15", "text": "**Myeongdong Kyoja** — kalguksu i mandu · **Plan B: Dongwonjip** gamjatang", "altHint": true, "slot": 7}, {"time": "21:30", "key": "21:30", "text": "**Euljiro barovi** iza neoznačenih vrata", "altHint": true, "slot": 8}], "plans": [{"label": "Alternativni raspored", "replaces": "all", "summary": "", "detail": null, "rows": [{"time": "08:30", "key": "08:30", "text": "**Bukchon** dok je prazno, 45 min i ne više · pa **Jogyesa**", "altHint": true, "slot": 2}, {"time": "11:00", "key": "11:00", "text": "**Tongin tržnica** — zamijeniš novac za mjedene novčiće i puniš limeni pladanj po štandovima", "altHint": true, "slot": 3}, {"time": "13:30", "key": "13:30", "text": "**Nacionalni muzej Koreje** — besplatan; Silla zlato *prije* Gyeongjua, da humci poslije imaju smisla", "altHint": false, "slot": 4}, {"time": "16:30", "key": "16:30", "text": "**Deoksugung + Doldam-gil** — jedina palača otvorena navečer, aleja uz zid u punoj boji", "altHint": true, "slot": 6}, {"time": "18:00", "key": "18:00", "text": "**Seoul Sky** za zalazak, ulaz oko 17:15 *(ako je vedro — inače se slot seli na 1.11.)*", "altHint": true, "slot": 5}, {"time": "21:00", "key": "21:00", "text": "**Euljiro speakeasy krug** — ulazi bez natpisa, jedan iza automata za piće", "altHint": true, "slot": 8}]}], "leftPlans3": [], "decisions": ["d-uto-20-10-seoul-sky-na-zalazak"]}, {"date": "21.10", "d3heading": "SRI 21.10. — TRANSFER U SOKCHO", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 3 od 14", "intro": "⏰ **ODLUKA ZA EKIPU (do ~15.10.):** direktni bus (plan) ili Chuncheon usput → **KOBUS karta za ~08:30**; 📧 Blue Terra — smiju li koferi u ~11:15.", "stay": "🏨 **Smještaj — Sokcho: Hotel the Blue Terra** · 21.–24.10. (3 noći) · check-in od 15:00, check-out 11:00\n\n- **Adresa:** 3920 Donghae-daero, Sokcho-si, Gangwon 24888\n- **Za taksi:** 강원 속초시 동해대로 3920, 더블루테라 (stara adresa 조양동 1493-7)\n- **Kvart:** Joyang-dong, na samoj plaži Sokcho\n- **Dolazak:** Sokcho **Express** Bus Terminal ~670 m (~10 min pješke) — tu stižu busevi iz Seoula\n- **Seoraksan:** bus 7 / 7-1, stanica preko ceste, zadnja stanica Sogongwon\n- **Odlazak 24.10.:** Sokcho **Intercity** terminal ~3 km sjeverno → taksi ~10 min\n- **U blizini:** Daepohang ~1,4 km J · tržnica i Abai Village ~2 km S · 7-Eleven u zgradi\n- [Otvori u Naver Map (iOS)](nmap://place?lat=38.184825&lng=128.601490&name=Hotel%20the%20Blue%20Terra&appname=com.sokogeo)", "slots": [{"timeLabel": "~08:00", "key": "08:00", "title": "Transfer: Seoul → Sokcho (direktni express bus)", "meta": ["⏱ 2h10–2h20 vožnje + ~45 min do terminala", "☔", "🦵 lagano"], "body": "**Seoul Express Bus Terminal (Gangnam) → Sokcho Express terminal**, ~40 polazaka dnevno 06:00–23:30, **17 200 ₩ (obični) / 22 300 ₩ (deluxe) / 28 900 ₩ (premium)**. Kartu kupiti na **KOBUS-u** (kobus.co.kr). Kofere se sami stavljaju u prtljažnik ispod busa, besplatno.\n\nOd apartmana do terminala: **2 taksija ~25–35 min** (jutarnja gužva) — s koferima ne metroom. Bus ~08:30–09:00.\n\n⚠️ **Nema željeznice** do Sokcha (linija Chuncheon–Sokcho otvara se 2029.).\n\n⚠️ **WIP:** KOBUS je strane kartice počeo primati tek u kolovozu 2026. — testirati rano. Rezerva: šalter na terminalu, gotovina i putovnica.", "alts": [{"title": "Stanka u Chuncheonu — dakgalbi (Woomi)", "text": "· Chuncheon je grad gdje je izmišljen **dakgalbi**: piletina, kupus, rižini kolačići i čili pasta prže se u velikoj tavi na stolu, a na kraju se u ostatku umaka prži riža. **ITX-Cheongchun iz Cheongnyangnija** (3 stanice od apartmana, L1) ~1 h, 6 900–8 300 ₩ → **Namchuncheon** (npr. 09:11 → 10:06, **WIP** vozni red 2026.) → **Myeongdong Woomi Dakgalbi (명동우미닭갈비)**, Onui-dong, ~850 m od stanice, 033-257-1919: dakgalbi 16 000 ₩, riža 3 000 ₩, makguksu 9 000 ₩; 10:00–20:50, **zatvoreno 2. i 4. srijede** (21.10. je 3. srijeda — otvoreno); prostran, koferi stoje unutra → ~1 km do Chuncheon Intercity terminala → **bus 11:30 → Sokcho ~13:30** (16 700 ₩, buseve: 09:00, 10:00, 11:30, 13:30, 15:30…). ⚠️ Stiže na **Sokcho Intercity terminal na sjeveru**, 3 km od hotela → 2 taksija s koferima do hotela pa jedan natrag na sjever (~30–40 min, ~20–25 000 ₩). Pitati vozača staje li i kod Express terminala. *Cijena: ~2,5 h više nego direktni bus.*", "meta": ["⏱ +2,5 h", "☔", "🦵"]}, {"title": "Stanka u Hongcheonu — 5-dnevna tržnica", "text": "(21.10. je dan tržnice: palačinke od heljde, kalguksu, sundae, svinjetina na žaru) · Dong Seoul → Hongcheon 1 h, Hongcheon → Sokcho 11:50 → 13:26. ⚠️ S 4 kofera kroz tržnicu je mučno i ima samo jedan dobar bus dalje — samo ako bi putovali lagano", "meta": ["⏱ +2 h", "🌦️", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~11:15", "key": "11:15", "title": "Kofere u hotel", "meta": [], "body": "Sokcho Express terminal je **670 m od hotela** (~10 min pješke, ili 2 kratka taksija). Check-in je od **15:00**, ali korejski hoteli u pravilu besplatno čuvaju prtljagu ranije. ☎️ **WIP: potvrditi s Blue Terrom mailom.** Od hotela na sjever (luka, Abai, tržnica) taksi ~10 min, 7–8 000 ₩.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:00", "key": "12:00", "title": "Yeonggeumjeong + svjetionik *(WIP)*", "meta": ["⏱ 45 min", "🌦️ podnosi kišu", "🦵🦵 srednje (stepenice)"], "body": "Mali paviljon na stijenama u moru i vidikovac kod svjetionika u starom lučkom dijelu Yeongrang-donga — pogled na more i luku, besplatno. **WIP:** radno vrijeme i stepenice — ubačeno kao prijedlog za \"dolazimo prije check-ina\" termin.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:45", "key": "12:45", "title": "Ručak: Sadonjib (mulgomtang)", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**사돈집**, Yeongrang-dong 1-1. **Mulgomtang** — gulaš od ribe eelpout, meko, želatinasto bijelo meso u blagoj juhi s rotkvom i malo čilija; lokalni specijalitet ove obale, potpuno kuhan. Ima i pirjani ljuti iverak (gajami-jorim).\n⚠️ **Radi 08:00–15:00, četvrtkom zatvoreno**, zna zatvoriti ranije ako nestane ulova → **srijeda je jedina prava prilika.**", "alts": [{"title": "Sindasin (신다신)", "text": "u Abai Villageu — **gari-gukbap** (juha od goveđih prsa s rotkvom i klicama), ojingeo-sundae, abai-sundae; 08:30–20:00, bez zatvaranja; red 30–45 min u podne", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Chilsung Shipyard", "meta": ["⏱ 30–45 min", "☔ kiša OK", "🦵 lagano"], "body": "**칠성조선소**, Jungang-ro 46beon-gil 45. Brodogradilište drvenih brodova iz 1952. (radilo do 2017.), danas kafić i mali muzej na jezeru Cheongcho — stare tračnice za porinuće su ostale. 11:00–19:00, piće 6–8 500 ₩.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:00", "key": "15:00", "title": "Abai Village + gaetbae skela", "meta": ["⏱ 1–1,5 h", "🌦️ podnosi kišu (skela radi i po kiši)", "🦵 lagano"], "body": "Naselje koje su osnovale sjevernokorejske izbjeglice nakon rata, preko uskog kanala. Prelazi se **gaetbaeom** — ravnom splavi koju putnici sami vuku po čeličnom užetu (**500 ₩**, kartica ili gotovina, 3 min, radi 05:00–23:00). Šarmantno ali malo — **1–1,5 h je dosta**, kao užina, ne ručak.\n\nŠto jesti: **ojingeo-sundae** (lignja punjena rezancima i povrćem, narezana i pržena) i **abai-sundae** (sjevernokorejska kobasica).\n- **Dancheon Sikdang (단천식당)** — 08:30–19:00, ojingeo-sundae ~15 000 ₩, abai-sundae juha 10 000 ₩. ⚠️ **Kombinirane plate uključuju sirovi začinjeni pollock (myeongtae-hoe)** — naručivati pojedinačna jela.\n- **Sindasin** — vidi gore.", "alts": [{"title": "Sokcho City Museum", "text": "rekonstrukcija kuća sjevernokorejskih izbjeglica na otvorenom, 2 000 ₩, 09:00–18:00, ponedjeljkom zatvoreno — kišna opcija", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Naksansa", "text": "obalni hram na stijeni nad morem · *⏱ 1,5 h · 🌦️ · 🦵🦵* · ⚠️ troši hram-budžet", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Središnja tržnica (Sokcho Tourist & Fishery Market)", "meta": ["⏱ 1,5 h", "☔ kiša OK (natkriveno)", "🦵 lagano"], "body": "Natkrivena tržnica u centru. **Večeras samo grickanje** — veliki obrok od rakova je u četvrtak.\n- **Sulbbang** (kruh na pari od makgeollija), štand 54, ~4 000 ₩ kriška — **rasproda se do ~17:00**, zato prvo.\n- **Manseok Dakgangjeong (만석닭강정)** — slatko-hrskava pržena piletina u kutiji, 18–22 000 ₩, 10:00–20:00. Dobra je i hladna → kutija za hotel. Alternative u istoj tržnici: Jung-ang Dakgangjeong (štand 23), Sokcho Dakgangjeong (štand 20).\n- Pogledati crvene rakove u bazenima za četvrtak.\n\n⚠️ **Radnim danom stalci se gase oko 19:30** (stari plan \"noćna tržnica u 19:00\" bio je prekasno).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:30", "key": "18:30", "title": "Večera: 88 Saengseon-gui", "meta": ["⏱ 1–1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "**88생선구이**, Jungang-dong 468-55, 5 min od skele. Do 10 vrsta ribe (skuša, saury, iverak, lignja…) peče osoblje na ugljenu ugrađenom u stol, ~20 000 ₩ po osobi. 08:30–20:15, pauza 15:00–16:30, **zadnja narudžba ~20:15**. Bez rezervacije, red u špici. ⚠️ **Jako zadimljeno** — odjeća će mirisati.", "alts": [{"title": "Dakgangjeong iz kutije + pivo u hotelu", "text": "ako ste mrtvi od puta", "meta": ["⏱ —", "☔", "🦵"]}, {"title": "Sindasin", "text": "gari-gukbap ako je ručak bio negdje drugdje", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "20:00", "key": "20:00", "title": "Yeongrang-dong šatori uz more", "meta": ["⏱ 1–1,5 h", "🌦️ podnosi kišu", "🦵 lagano"], "body": "Niz šatorskih barova (pojangmacha) uz samu obalu, Yeongranghaean-gil — domaći i lučki radnici, otvoreno do ~02:00. Poznati: **Maljane**, **Danggeun Macha**. Ima kuhanog: kuhani crveni rak, ljuta svinjetina, lignja na žaru, juha od školjki. ⚠️ **Naručivati kuhana jela izričito i odbiti sirove priloge.** **Kratko — 1–2 pića, u hotelu do 22:30**, sutra polazak u 06:30. (Imena i radno vrijeme **WIP**.)", "alts": [{"title": "Rano spavanje", "text": "pivo u hotelu na plaži", "meta": ["⏱ —", "☔", "🦵"]}], "altNotes": [], "after": "💡 **Freezer Club / Dalbit Yajang** (noćni food court u starom hladnjaku za ribu, ples iza vrata industrijskog zamrzivača) — namjerno **ne večeras**: ide u **četvrtak navečer** poslije rakova, jer u petak nema ranog ustajanja."}], "info": [], "triggers": "- **Bus kasni ili nema karata →** Dong Seoul terminal (L2 Gangbyeon), izbjegavati spore linije preko Injea; ili Chuncheon varijanta\n- **Rano stižete i svi su gladni →** Sadonjib odmah, Yeonggeumjeong poslije\n- **Kiša →** Abai i skela rade; Sokcho City Museum; tržnica je natkrivena\n- **Sutra je prognoza lošija od prekosutra →** zamijeniti dan 4 i dan 5 (Ulsanbawi treba suho vrijeme)", "heading": "Sri 21.10. — Dolazak i obala", "city": "sokcho-i-seoraksan", "transfer": "**🚌 Sri 21.10. · Seoul → Sokcho**\n**express bus 2h10–2h20 · 17 200–28 900 ₩**\n\nNema željeznice do 2029. **Plan: direktni express bus** s Seoul Express Bus Terminala (Gangnam, KOBUS) → Sokcho **Express** terminal, 670 m od hotela. **Alternativa: stanka u Chuncheonu na dakgalbi** (ITX iz Cheongnyangnija + bus, +2,5 h) — vidi Dio 3.", "flash": null, "rows": [{"time": "~08:00", "key": "08:00", "text": "2 taksija do Seoul Express Bus Terminala (Gangnam) · bus ~08:30–09:00, ~2h10–2h20 · rezervirati na KOBUS-u", "altHint": true, "slot": 0}, {"time": "~11:15", "key": "11:15", "text": "Sokcho Express terminal → 10 min pješke do hotela, **ostaviti kofere** (check-in tek 15:00)", "altHint": false, "slot": 1}, {"time": "12:00", "key": "12:00", "text": "**Yeonggeumjeong + svjetionik** — paviljon na stijenama i vidikovac nad lukom · *WIP*", "altHint": false, "slot": 2}, {"time": "12:45", "key": "12:45", "text": "Ručak: **Sadonjib** — mulgomtang, blagi riblji gulaš (samo do 15:00, četvrtkom zatvoreno)", "altHint": true, "slot": 3}, {"time": "14:15", "key": "14:15", "text": "**Chilsung Shipyard** — kafić u brodogradilištu iz 1952.", "altHint": false, "slot": 4}, {"time": "15:00", "key": "15:00", "text": "**Abai Village** — ručno vučena skela, ojingeo-sundae kao užina", "altHint": true, "slot": 5}, {"time": "16:30", "key": "16:30", "text": "**Središnja tržnica** — sulbbang, dakgangjeong u kutiji · stalci se gase oko 19:30", "altHint": false, "slot": 6}, {"time": "18:30", "key": "18:30", "text": "**88 Saengseon-gui** — miješana riba na žaru za stolom", "altHint": true, "slot": 7}, {"time": "20:00", "key": "20:00", "text": "**Yeongrang-dong šatori uz more** — 1–2 pića, natrag do 22:30 (sutra 06:30)", "altHint": true, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": ["d-sri-21-10-put-u-sokcho", "d-sri-21-10-prtljaga-prije-check-ina"]}, {"date": "22.10", "d3heading": "ČET 22.10. — ULSANBAWI", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 4 od 14 · Najteži dan putovanja", "intro": "⏰ **ODLUKA ZA EKIPU:** Waterpia Spa Valley poslije hikea (plan) ili odmor u hotelu → online karta ~42 000 ₩ 1–2 dana ranije. Žičara se ne može rezervirati.", "stay": "", "slots": [{"timeLabel": "Večer prije", "key": "večer prije", "title": "hrana", "meta": [], "body": "U **7-Elevenu u zgradi hotela** kupiti doručak **i hranu za hike** (trokutasti kimbap, sendviči, banane, voda, topli napitci). U 06:30 ništa nije otvoreno, a jest će se na stazi — to omogućuje da se poslije hikea ide ravno u bazen.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "06:30", "key": "06:30", "title": "Rani polazak", "meta": [], "body": "Bus **7 ili 7-1** — **stanica preko ceste od hotela**, kreće od ~05:36, svakih 20–35 min, zadnja stanica **Sogongwon** (ulaz u park). Taksi iz centra 13–16 000 ₩; poslije 08:30 cesta u park se zakrči.\n\n⚠️ **Zora na ulazu u park je oko nule.** Slojevi: termo majica, flis ili lagana pernata, vjetrovka.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "07:15", "key": "07:15", "title": "Karte za žičaru (prvo!)", "meta": [], "body": "⚠️ **Problem žičare Gwongeumseong:** karte se prodaju **samo na dan, samo na šalteru** — nema online rezervacije. Krajem listopada radnim danom red je **60–90 min**, vikendom 2 h+, a karte se **često rasprodaju do ranog popodneva**. Po jakom vjetru staje (neiskorištene karte se vraćaju). Radi ~08:30–17:00/17:30, raspored se objavljuje dan ranije.\n\n**Pravilo:** **kupiti karte odmah po dolasku**, pa ići na Ulsanbawi i voziti se u terminu s karte. **WIP:** dobiva li se na karti fiksni termin ukrcaja. **Ako je rasprodano ili puše → preskočiti**, vrh Ulsanbawija ionako daje veliki pogled.\n\n**16 000 ₩ povratno.** Gore su ruševine tvrđave iz 13. st. i panorama granitnih grebena, Ulsanbawija, Sokcha i mora. Zamjenjuje ~sat strmog penjanja s 5 min vožnje — korisno i kad netko ne može hodati, jer ekipa ostaje zajedno.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "07:30", "key": "07:30", "title": "Sinheungsa", "meta": ["⏱ 30 min", "🌦️ podnosi kišu", "🦵 lagano"], "body": "Radni budistički hram na ulazu u park, ogroman brončani Buda (Tongil Daebul) u blizini. **Ulaznica je ukinuta — besplatno.** Rano ujutro, u magli i bez ljudi, ima posebnu atmosferu.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "08:00", "key": "08:00", "title": "Ulsanbawi", "meta": ["⏱ 3,5–5 h", "☀️ treba suho", "🦵🦵🦵 teško (čelične stepenice, spust)"], "body": "Sogongwon → Sinheungsa → Gyejoam → zadnji ~1 km po čeličnim stepenicama pričvršćenim za stijenu. **7,6–8,8 km povratno, ~620 m uspona, 3,5–5 h** (stari plan je računao 2–4 h). Broj stepenica: izvori kažu **808 ili 888**.\n\nPrve dvije trećine su blage zemljane i kamene staze dolinom; zadnji dio je strm. Bez penjanja rukama — izvedivo za rekreativca koji vježba tjedno. Ide cijela ekipa, polako.\n\n⚠️ **Štapovi za Luciju nisu opcija nego oprema.** Silazak niz stepenice je gdje koljeno strada, ne uspon — duge pauze.\n⚠️ **Ulaz u park zabranjen je od zalaska sunca do 2 h prije izlaska.** Po kiši je granit sklizak — Ulsanbawi tada ide u petak.\n\nRučak iz ruksaka na vrhu ili pri silasku.", "alts": [{"title": "Zamijeniti s petkom", "text": "ako je petak vedriji; Ulsanbawi treba suho vrijeme", "meta": []}, {"title": "Biseondae", "text": "dolinom potoka Cheonbuldong, **6 km povratno, 2–2,5 h, gotovo ravno** (šljunak i kamen), pogled na litice", "meta": ["⏱ 2,5 h", "🌦️", "🦵"]}, {"title": "Jujeongol dolina", "text": "(strana Osaek) — **ravne drvene staze**, 6,4 km, 2,5–3 h, **drži boju najduže**; ~1 h vožnje s druge strane parka", "meta": ["⏱ 3 h", "🌦️", "🦵"]}, {"title": "Daecheongbong preko Osaeka", "text": "9,5 km, 1 320 m · *⏱ 5–6 h · ☀️ · 🦵🦵🦵🦵* · samo uz razdvajanje na pola dana", "meta": []}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Žičara (ako ima karata)", "meta": [], "body": "U terminu s karte. Ako je rasprodano ili vjetar — preskače se bez žaljenja.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~13:30", "key": "13:30", "title": "Montbeer: ručak ili pivo", "meta": ["⏱ 1–1,5 h", "☔", "🦵 lagano"], "body": "**몽트비어 (MontBeer)**, Nohak-dong, Haksapyeong-gil 7-1 — lokalna craft pivovara na cesti iz parka, **veliki prozori gledaju ravno u Ulsanbawi**. Otvara se u **13:30**. Uz pivo ima i pravu hranu: **pizza, kobasice, pržena piletina**, 10–40 000 ₩; ocjena 4,4, recenzije hvale IPA-e i ugodnu atmosferu. Ovisno o tome kad završite: **ručak** ili **samo jedno pivo** prije bazena.", "alts": [{"title": "Haksapyeong — selo mekog tofua", "text": "niz restorana sundubua uz cestu iz parka prema gradu i Waterpiji; obrok od tofua ili morskih plodova **10–19 000 ₩**. Npr. **Gim Yeong-ae Halmeoni Sundubu** (07:00–14:00, utorkom zatvoreno)", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Sokcho Haenyeo Maeul (속초해녀마을 / 바람꽃해녀마을)", "text": "na cesti iz parka, Nohak-dong: **lonac od plodova mora s abalonom**, sundubu s abalonom, **seopguk** (ljuti gulaš od divljih dagnji). Od 08:00, 10–30 000 ₩, ocjena 3,9, **srijedom zatvoreno** (četvrtak OK). Najbolji pravi sjedeći obrok uz planinu", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Food court u Waterpiji", "text": "burgeri, udon; praktično, ništa posebno", "meta": ["⏱ 45 min", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~14:30", "key": "14:30", "title": "Seorak Waterpia Spa Valley", "meta": ["⏱ 2–3 h", "☔ kiša OK", "🦵 lagano (odmor za noge)"], "body": "**설악워터피아**, Hanwha Resort, Nohak-dong — ~10 min taksijem od ulaza u park, ista strana grada. **Spa Valley: 18 vanjskih termalnih bazena** s alkalnom mineralnom vodom, **kupaći i kapa obavezni**, sve dobi zajedno — bez golotinje. **~42 000 ₩ online, 74 500 ₩ na blagajni** → kupiti online. 10:00–21:30. Najbolji tretman za noge poslije Ulsanbawija.\n\n⚠️ To je obiteljski vodeni park — Spa Valley je mirniji vanjski dio. Ako se bazen radi danas, **Delpino u petak postaje opcionalan**.", "alts": [{"title": "Odmor u hotelu", "text": "tuš i spavanje prije večere, ako su svi gotovi", "meta": ["⏱ 2–3 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "💸 Gozba od crvenih rakova", "meta": ["⏱ 1,5–2 h", "☔ kiša OK", "🦵 lagano"], "body": "⚠️ **Korejski snow crab (daege) je u listopadu pod zabranom izlova (1.6.–30.11.)** — što se prodaje kao \"snow crab\" je uvoz iz Rusije po turističkim cijenama, a restorani u lukama Daepo i Dongmyeong (200–320 000 ₩ za četvero) uz to nude hrpu **sirovih priloga**. Zato: **crveni rak (hongge)** — lokalan, u sezoni, kuhan na pari pred vama, plus pržena riža od rakova u oklopu.\n\nŠto je hongge: **manji od snow craba, tanje noge, slađe i mekše meso** i više posla s otvaranjem — korejski \"svakodnevni\" rak ove obale.\n\n**Yes Su-san**, unutar središnje tržnice — sjedeći **setovi od crvenog raka ~26–36 000 ₩ po osobi**, kuhani snow crab ~76 000 ₩. **10:30–20:00, utorkom zatvoreno** → **doći najkasnije oko 19:00.** Toplo, za stolom, 5 min hoda do Freezer Cluba. Nije potrebno zvati dan ranije.", "alts": [{"title": "Rakovi za van — Gessadagu (게싸다구) / Sokcho Bulgeun Daege Susan (속초붉은대게수산)", "text": ", susjedni štandovi u tržnici · biraš žive rakove iz bazena, kuhaju ih na pari 10–45 min i režu oklop; **hongge ~10 000 ₩ po komadu**, ruski daege ~44–60 000 ₩/kg, pržena riža u oklopu 2 000 ₩; za četvero 4–6 rakova ≈ **60–100 000 ₩ ukupno**. Gessadagu 10:00–21:00. Uglavnom za van — jede se stojeći ili negdje odnese (neuredno, dobro je imati umivaonik)", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Freezer Club / Dalbit Yajang", "meta": ["⏱ 1–2 h", "☔ kiša OK", "🦵 lagano"], "body": "**속초 달빛야장 / 동원냉동**, Jungang-dong, kod stare luke — bivše skladište hladnjače za ribu pretvoreno u noćni food court (topli zalogaji, krumpir-palačinke, pivo pod limenim krovom). U sredini je **Freezer Club (냉동클럽)**: ulazi se kroz teška industrijska vrata zamrzivača, a unutra je nezagrijana plesna soba s retro svjetlima i glazbom. Besplatan ulaz, 18:00–24:00, **pretežno srijeda–nedjelja**.\n\n⚠️ **WIP:** radi li radnim danom krajem listopada ovisi o prometu — provjeriti na licu mjesta ili na Naveru. Ovdje je jer **u petak nema ranog ustajanja**.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Žičara rasprodana ili vjetar →** preskočiti, vrh Ulsanbawija je dovoljan\n- **Lucija stane na pola →** odmorište prije zadnjeg stepeništa; ostali gore i natrag — sat razdvajanja, ne dan\n- **Kiša ili magla →** Ulsanbawi na petak, danas Biseondae ili Cheonbuldong\n- **Boja je prošla na visini →** Jujeongol\n- **Brzo ste gotovi →** Montbeer za ručak, pa Waterpia; **sporo →** samo pivo u Montbeeru ili ravno u bazen\n- **Svi su mrtvi →** hotel, rakovi, spavanje — Freezer Club se seli na petak", "heading": "Čet 22.10. — Planinski dan", "city": "sokcho-i-seoraksan", "transfer": "", "flash": null, "rows": [{"time": "večer prije", "key": "večer prije", "text": "7-Eleven u hotelu: doručak **i hrana za hike** (kimbap, sendviči, voće, piće)", "altHint": false, "slot": 0}, {"time": "06:30", "key": "06:30", "text": "Bus **7 / 7-1** preko ceste od hotela → Sogongwon (ili taksi 13–16 000 ₩)", "altHint": false, "slot": 1}, {"time": "07:15", "key": "07:15", "text": "⚠️ **Prvo karte za žičaru** — samo na dan, na šalteru, rasprodaju se", "altHint": false, "slot": 2}, {"time": "07:30", "key": "07:30", "text": "**Sinheungsa** — hram na ulazu u park, besplatno", "altHint": false, "slot": 3}, {"time": "08:00", "key": "08:00", "text": "**Ulsanbawi** — 7,6–8,8 km, **3,5–5 h**, čelične stepenice na vrhu · štapovi za Luciju", "altHint": true, "slot": 4}, {"time": "~13:00", "key": "13:00", "text": "**Žičara na Gwongeumseong** u terminu s karte · *ako je rasprodano ili vjetar → preskočiti*", "altHint": false, "slot": 5}, {"time": "~13:30", "key": "13:30", "text": "**Montbeer** — ručak (pizza, kobasice, piletina) ili samo pivo s pogledom na Ulsanbawi, ovisno o vremenu", "altHint": true, "slot": 6}, {"time": "~14:30", "key": "14:30", "text": "**Seorak Waterpia — Spa Valley**, 18 vanjskih termalnih bazena, kupaći · **ili** odmor u hotelu", "altHint": true, "slot": 7}, {"time": "19:00", "key": "19:00", "text": "💸 **Gozba od crvenih rakova** — Yes Su-san u središnjoj tržnici, sjedeći", "altHint": true, "slot": 8}, {"time": "21:00", "key": "21:00", "text": "**Freezer Club / Dalbit Yajang** — noćni food court u starom hladnjaku za ribu", "altHint": false, "slot": 9}], "plans": [], "leftPlans3": [], "decisions": ["d-cet-22-10-popodne-poslije-hikea"]}, {"date": "23.10", "d3heading": "PET 23.10. — BLAŽI DAN, GRAD I OBALA", "night": "Noćenje: Sokcho, Hotel the Blue Terra · Dan 5 od 14 · Dan oporavka nakon Ulsanbawija", "intro": "⏰ **ODLUKA NA LICU MJESTA:** grad i obala (plan) ili Delpino — ovisi je li Waterpia bila u četvrtak. ☎️ Delpino ipak nazvati prije puta.\n\nLogika dana: **jutro u parku na ravnom, popodne grad i obala na ravnom.** Ako je Waterpia bila u četvrtak, dva dana zaredom u termalnoj vodi su previše, pa je **Delpino plan B**. Ako Waterpia u četvrtak nije bila (umor, vrijeme), Delpino ulazi umjesto muzeja i jezera.", "stay": "", "slots": [{"timeLabel": "08:00", "key": "08:00", "title": "Jutro u parku: Biseondae (+ Biryong)", "meta": ["⏱ 2,5–5 h", "🌦️ podnosi kišu", "🦵 lagano (Biseondae) / 🦵🦵 srednje (Biryong)"], "body": "Do parka isto kao u četvrtak: **bus 7 / 7-1** preko ceste od hotela ili taksi 13–16 000 ₩. Nema žurbe ni karata za žičaru. Odlučuje se ujutro, po nogama.\n\n**Opcija 1 — obje šetnje (~11 km, 4–5 h):**\n- **Biseondae (비선대)** — Sogongwon → Sinheungsa → uz potok Cheonbuldong do Biseondaea. **6 km povratno, 2–2,5 h, gotovo ravno** (šljunak, kamene ploče, nekoliko mostova). Na kraju su granitne ploče u potoku i okomite litice Jangguneoka. Najljepša lagana šetnja u parku, puna boje krajem listopada. ⚠️ Dalje od Biseondaea (prema Geumganggulu, 600+ stepenica) se ne ide. Ulazi u dublje staze zatvaraju se oko podneva/14:00 (WIP), ali to se nas ne tiče.\n- **Biryong slapovi (비룡폭포)** — polazište uz cestu **malo prije Sogongwona** (stanica busa 7/7-1 Seorak-dong, WIP točno). **4,8 km povratno, 2–2,5 h, ~180 m uspona**: drvene staze, **viseći mostovi**, pa Yukdam slapovi i na kraju Biryong (\"slap letećeg zmaja\") u kamenom amfiteatru. Umjereno, sa štapovima u redu.\n- ❌ **Vidikovac Towangseong** iznad Biryonga: još 0,8 km i **900+ strmih stepenica**. Nije za Lucijino koljeno, a dan poslije Ulsanbawija nije ni za koga.\n\n**Opcija 2 — polagani doručak, pa samo Biseondae (~3,5 h ukupno):**\n- **08:00–09:00 doručak u hotelu ili kafiću.** Za one koji vole tofu: **Gim Yeong-ae Halmeoni Sundubu (김영애할머니순두부)**, Haksapyeong, selo tofua na cesti prema parku. Tofu se zgrušava **morskom vodom**: mekan, topao sundubu u kamenoj zdjeli, uz kongbiji (gulaš od mljevene soje) i banchan. **07:00–14:00, utorkom zatvoreno** (petak OK). ~10–15 000 ₩ po osobi.\n- Taksijem 5 min do Sogongwona → **samo Biseondae**. Biryong je dodatak \"ako noge kažu da\".\n\n**Opcija 3 (rezerva) — duže spavanje, samo Biryong:** fotogeničniji od Biseondaea (slap, mostovi), kraće i bez gužve na glavnom ulazu. Ali ima ponešto silaska, pa je lošiji za koljeno od Biseondaea.", "alts": [{"title": "Zamjena s četvrtkom", "text": "ako je četvrtak bio kišan, danas je Ulsanbawi (vidi Dan 4), a muzej i jezero se sele u četvrtak", "meta": ["⏱ 3,5–5 h", "☀️", "🦵🦵🦵"]}, {"title": "Jujeongol dolina", "text": "(strana Osaek) — **ravne drvene staze**, 6,4 km, 2,5–3 h, **boja se drži najduže**. ~1 h taksijem s druge strane parka, pa pada dio popodneva", "meta": ["⏱ 3 h + 2 h vožnje", "🌦️", "🦵"]}, {"title": "Žičara Gwongeumseong", "text": "ako je propala u četvrtak. Isti problem: **karte samo na dan, na šalteru**, redovi 60–90 min → doći na otvaranje (~08:30)", "meta": ["⏱ 1,5–2,5 h", "☀️", "🦵"]}, {"title": "Daleko uz Cheonbuldong", "text": "nastavak iza Biseondaea dolinom do slapova, ~12 km, po mokrom lijepo, ali puno kamena i stepenica", "meta": ["⏱ 3–5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "~13:00", "key": "13:00", "title": "Ručak na strani parka", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**Baramkkot Haenyeo Maeul (바람꽃해녀마을 / 속초해녀마을)**, Nohak-dong, na cesti iz parka prema gradu. \"Selo ronilica\" je kuhinja u stilu haenyeo, žena koje rone po plodove mora. Naručiti kuhano:\n- **seopguk (섭국)** — ljuti, gusti gulaš od **divljih dagnji** s povrćem i jajem, specijalitet ove obale;\n- **lonac od plodova mora s abalonom** (za dijeljenje) ili **sundubu s abalonom**.\n\n08:00/08:30–20:00, **srijedom zatvoreno**, 10–30 000 ₩, ocjena ~3,9. Broj se uzima na kiosku, ima parking. ⚠️ Sirovo (hoe) preskočiti.", "alts": [{"title": "Selo tofua Haksapyeong", "text": "ako je doručak bio negdje drugdje: niz restorana sundubua na istoj cesti, 10–19 000 ₩", "meta": ["⏱ 1 h", "☔", "🦵"]}, {"title": "Montbeer (몽트비어)", "text": ", Haksapyeong-gil 7-1 — ako se nije stiglo u četvrtak: pizza, kobasice, piletina, craft pivo s pogledom na Ulsanbawi, od 13:30", "meta": ["⏱ 1–1,5 h", "☔", "🦵"]}, {"title": "Sadonjib (사돈집)", "text": ", Yeongrang-dong, u gradu — **mulgomtang** (blagi gulaš od ribe eelpout, meko želatinasto meso u juhi s rotkvom) ako se nije stiglo u srijedu. **08:00–15:00, četvrtkom zatvoreno**, zatvara ranije kad nestane → doći do 13:30", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:00", "key": "14:00", "title": "Nacionalni planinarski muzej (국립산악박물관)", "meta": ["⏱ 1–1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "Misiryeong-ro, Nohak-dong. Nalazi se na istoj strani grada kao park i ručak, pa je 5–10 min taksijem. **Besplatno**, 09:00–18:00, ponedjeljkom zatvoreno.\n\nKorejska i himalajska planinarska povijest: oprema s osvajanja Everesta, šatori, kisik. Čudni dio je **soba koja simulira veliku visinu**: smanjena razina kisika, osjetiš kako bi bilo na 3–4 000 m (WIP radi li i kako se ulazi). Ima i **stijena za penjanje** te 4D/VR planinarenje. Lagano i zabavno dan poslije Ulsanbawija, jer \"sad znamo kako je to\".", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "15:30", "key": "15:30", "title": "Jezero Cheongcho i krizanteme", "meta": ["⏱ 45 min–1 h", "🌦️ podnosi kišu", "🦵 lagano"], "body": "**청초호** je laguna usred grada, između centra i Abaija (jučerašnji trajekt gaetbae je na njezinu ulazu). Ravna šetnica oko vode, pogled na ribarske brodove i Seoraksan iza grada.\n- **Izložba krizantema** u parku Expo uz jezero: besplatna, do početka studenog, **navečer osvijetljena** (može i kao večernja šetnja).\n- **Expo toranj (엑스포타워)**: vidikovac nad jezerom i morem (WIP sati i cijena).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "16:30", "key": "16:30", "title": "Plaža Sokcho i staza Oeongchi uz more", "meta": ["⏱ 1–1,5 h", "☀️ bolje po suhom", "🦵 lagano"], "body": "*(Nije bilo u istraživanju, ali je poznato mjesto. Sati WIP.)*\n\n- **Plaža Sokcho (속초해수욕장)** — duga gradska plaža, 10 min taksijem od jezera. Na njoj je **Sokcho Eye**, panoramsko kolo uz more (~12 000 ₩, WIP), lijepo u sumrak.\n- **Oeongchi Bada Hyanggi-ro (외옹치 바다향기로)** — **drvena staza od ~1,7 km** od južnog kraja plaže uz stijene do malog ribarskog sela Oeongchi. Taj dio obale je **desetljećima bio zatvoren vojnom ogradom** (obalna straža prema Sjevernoj Koreji), otvoren je tek 2018. Ravno, uz valove, s nekoliko kratkih stepenica.\n\n💡 **Istočna obala:** sunce zalazi **iza Seoraksana**, ne u more. Oko 17:45 more i stijene dobivaju zlatno svjetlo, a planine iza grada postaju silueta.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "18:00", "key": "18:00", "title": "Craftroot (ili Montbeer)", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**Craftroot (크래프트루트)**, craft taproom u staroj zgradi od cigle. Lokalno pivo, opušteno (WIP adresa i sati). Ako Montbeer nije bio u četvrtak, ide se tamo (od 13:30, ali je na strani parka, pa ga je lakše uklopiti uz ručak).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:30", "key": "19:30", "title": "Večer: Dalbit Yajang + Freezer Club", "meta": ["⏱ 1,5–2 h", "☔ kiša OK", "🦵 lagano"], "body": "**속초 달빛야장 / 동원냉동**, Jungang-dong, kod stare luke, 5 min od središnje tržnice. Bivša hladnjača za ribu pretvorena u **noćni food court**: štandovi s ražnjićima, prženim zalogajima, palačinkama i pivom pod limenim krovom. Iza teških vrata zamrzivača je **Freezer Club (냉동클럽)**, nezagrijana plesna soba s retro svjetlima. Besplatan ulaz, **18:00–24:00, srijeda–nedjelja**: **petak je siguran dan**.\n\n**Ako je Freezer Club bio u četvrtak**, ovo je samo jedna od opcija. Onda se bira između donjih.\n\n⏰ **Hotel do ~22:00**: u subotu rani polazak (vidi Dan 6).\n\n**Plan B — 🍗 piknik s dakgangjeongom:**\nSokcho **dakgangjeong (닭강정)**: komadi pržene piletine u ljepljivoj slatko-ljutoj glazuri s kikirikijem, **dobra i hladna**. **Manseok Dakgangjeong (만석닭강정)** u središnjoj tržnici, **10:00–20:00, ~18–22 000 ₩ kutija** (jedna velika za 2 osobe kao večera). ⚠️ Štandovi u tržnici zatvaraju oko 19:30–20:00, pa **kupiti do 19:30**. Uz to pivo iz trgovine, pa na plažu Sokcho (sumrak, Sokcho Eye) ili u hotel. Najmirnija i najjeftinija varijanta, rano u krevet.\n\n**Plan C — 🥩 korejski roštilj:**\nKlasična korejska večera koju u Sokchu još niste imali: **samgyeopsal** (svinjska potrbušina) ili **dwaeji galbi** (marinirana svinjska rebra) peku se na roštilju u stolu, uz zelenu salatu za zamatanje, češnjak, umake i doenjang-jjigae na kraju. ~15–20 000 ₩ po porciji, obično min. 2 porcije. **Nije istraženo za Sokcho** (WIP): na Naveru tražiti 삼겹살 ili 돼지갈비 blizu hotela. Ocjena 4,3+, puno recenzija.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Waterpia nije bila u četvrtak →** popodne Delpino (plan B), muzej i jezero otpadaju, obala i pivo ostaju\n- **Delpino zatvoren zbog vjetra →** Lotte Resort infinity bazen, ili natrag na plan A (grad i obala)\n- **Kiša →** Biseondae podnosi laganu kišu. Popodne muzej + **Sokcho City Museum** (2 000 ₩, rekonstrukcija kuća sjevernokorejskih izbjeglica iz Abaija, ponedjeljkom zatvoreno). Staza Oeongchi otpada\n- **Četvrtak je bio kišan →** danas Ulsanbawi (vidi Dan 4), a ovaj dan seli u četvrtak\n- **Koljeno →** opcija 2 (polagani doručak + samo Biseondae), ili samo doručak + muzej\n- **Freezer Club je bio u četvrtak →** dakgangjeong piknik ili roštilj\n- **Uvijek:** hotel do ~22:00, u subotu rani polazak", "heading": "Pet 23.10. — Blaži dan, grad i obala", "city": "sokcho-i-seoraksan", "transfer": "", "flash": null, "rows": [{"time": "08:00", "key": "08:00", "text": "**Biseondae + Biryong slapovi**, dvije lagane šetnje u parku, ~11 km, 4–5 h · **ili** polagani doručak (hotel ili kafić; tofu u Haksapyeongu za one koji žele), pa **samo Biseondae**, 6 km gotovo ravno, 2–2,5 h", "altHint": true, "slot": 0}, {"time": "~13:00", "key": "13:00", "text": "**Ručak: Baramkkot Haenyeo Maeul**, seopguk (ljuti gulaš od divljih dagnji) ili lonac s abalonom", "altHint": true, "slot": 1}, {"time": "14:00", "key": "14:00", "text": "**Nacionalni planinarski muzej**, besplatno, soba koja simulira veliku visinu, stijena za penjanje", "altHint": false, "slot": 2}, {"time": "15:30", "key": "15:30", "text": "**Jezero Cheongcho**: besplatna izložba krizantema, Expo toranj", "altHint": false, "slot": 3}, {"time": "16:30", "key": "16:30", "text": "**Plaža Sokcho → staza Oeongchi**, drvena staza uz stijene i more, 1,7 km · Sokcho Eye na plaži", "altHint": false, "slot": 4}, {"time": "18:00", "key": "18:00", "text": "**Craftroot** craft pivo (ili Montbeer ako je propao u četvrtak)", "altHint": false, "slot": 5}, {"time": "19:30", "key": "19:30", "text": "**Dalbit Yajang + Freezer Club**, noćni food court u staroj ribljoj hladnjači · **ili** 🍗 **piknik s dakgangjeongom** na plaži ili u hotelu · **ili** 🥩 **korejski roštilj** (samgyeopsal / dwaeji galbi)", "altHint": false, "slot": 6}, {"time": "22:00", "key": "22:00", "text": "Hotel. **U subotu rani polazak** (vidi Dan 6)", "altHint": false, "slot": null}], "plans": [{"label": "Plan B · Delpino", "replaces": ["14:00", "15:30"], "summary": "**Plan B popodne: 💸 Sono Calm Delpino**, termalni bazen na 11. katu s pogledom na Ulsanbawi, 19+, kupaći + kapa, ~40–50 000 ₩, petkom do 19:00. **Ako Waterpia nije bila u četvrtak** ili ako se ipak želi bazen · *↔ Lotte infinity bazen*", "detail": {"title": "Plan B popodne — 💸 Sono Calm Delpino, krovni termalni bazen", "meta": ["⏱ 2–3 h", "☔ kiša OK (⚠️ vjetar ga zatvara)", "🦵 lagano"], "md": "**Kada:** ako **Waterpia nije bila u četvrtak**, ili ako ekipa ipak želi bazen. Umjesto muzeja i jezera, otprilike 14:00–17:00, pa obala i pivo kako je planirano.\n\n**Goseong, ~15–20 min taksijem od ulaza u Seoraksan** (iz grada ~20 min).\n\n| | |\n|---|---|\n| Što | Prirodna termalna voda, vani, **bazen na 11. katu (zgrada C), gleda ravno u Ulsanbawi** |\n| Voda | ~**34–38 °C** kasno u jesen (UV): toplo, ne vrelo |\n| Dob | **19+** (ranije je pisalo 20+). Nema djece |\n| Odjeća | **Kupaći + kapa za plivanje** (prihvaća se i obična kapa/šešir) |\n| Ulaz za negoste | **Dnevne karte na blagajni Ocean Playa u podrumu** (UV). Boravak u Delpinu jamči pristup |\n| Radno vrijeme | **Petkom do 19:00** (10:00–19:00 po novijem izvoru, ranije 09:00) |\n| Cijena | **~40–50 000 ₩** |\n| Telefon | **+82-33-639-3426** |\n\n⚠️ **Jak vjetar (yanggan-jipung, proljetni/jesenski vjetar kroz prijevoje) zatvara krov bez najave** → nazvati prije polaska.\nPraktično: izlazak na krov na 10–15 °C je hladan, pa **ponijeti ogrtač ili veliki ručnik**.\n\nZa razliku od Waterpije (18 bazena, obitelji, vodeni park), Delpino je **jedan miran bazen samo za odrasle s pogledom**. Manje zabave, više \"wow\".", "alts": [{"title": "Lotte Resort Sokcho, infinity bazen", "text": "Daepo-dong, južno od grada. Grijani infinity bazen **s pogledom na more** umjesto na planinu, dnevna karta na blagajni vodenog parka **~35–45 000 ₩**, 10:00–19:00/20:00; danju obitelji, **navečer samo odrasli** (UV). Rezerva kad vjetar zatvori Delpino", "meta": ["⏱ 2 h", "☔", "🦵"]}], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-pet-23-10-popodne"]}, {"date": "24.10", "d3heading": "SUB 24.10. — VLAKOM UZ OBALU U GYEONGJU", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 6 od 14", "intro": "⏰ **ODLUKE ZA EKIPU (do ~15.10.):** **vlak 752 ili 754 → 🔴 rezervirati odmah**, bus u 06:55 ili taksi u 08:15, večera tržnica ili Dosol Maeul (vidi dolje).", "stay": "🏨 **Smještaj — Gyeongju: Airbnb (host Ondo)** · 24.–27.10. (3 noći) · check-in od 16:00, check-out 11:00\n\n- **Adresa:** 7-13 Wonhyo-ro 26beon-gil, Gyeongju-si, Gyeongbuk 38157\n- **Za taksi:** 경북 경주시 원효로26번길 7-13 (stara adresa 노서동 177-9)\n- **Kvart:** Noseo-dong / Hwango-dong, stari centar\n- **Pogodnosti:** besplatni parking (taksi do vrata), besplatno spremanje prtljage\n- **Bus terminali:** Intercity ~250 m, Express odmah do njega · bus **203** za Yangdong kod terminala · bus **10/11** za Bulguksu preko puta terminala\n- **Vlak:** KTX stanica Gyeongju ~12 km izvan grada → taksi 15–20 min, ₩15–20k (2 taksija ili van). Nema metroa.\n- **U blizini:** Daereungwon ~300–500 m I · Hwangnidan-gil ~10 min pješke · CU 65 m\n- [Otvori u Naver Map (iOS)](nmap://place?lat=35.841633&lng=129.204121&name=Gyeongju%20Airbnb&appname=com.sokogeo)", "slots": [{"timeLabel": "06:35", "key": "06:35", "title": "Pješke do terminala", "meta": ["⏱ 10 min", "☔ kiša OK", "🦵 lagano"], "body": "Isti **Sokcho Express Bus terminal** na koji ste stigli u srijedu, **670 m** od hotela — s koferima ~10 min po ravnom. Doručak u hotelu u to vrijeme ne postoji; kava i nešto sitno iz 7-Elevena u zgradi hotela.\n\n**Busevi Sokcho → Gangneung** (10 800 ₩, 1h00–1h37): **06:55**, 07:47, 08:00, 09:31… Karte na šalteru/automatu. ⚠️ **Samo 06:55 je siguran za vlak u 09:36.** Bus u 07:47 može stići tek oko 09:24 — bez rezerve za taksi do stanice. (Satnica radnog dana; **subota WIP** — provjeriti na terminalu u srijedu po dolasku.)\n\n**Rezerva — ako je 06:35 prerano: taksi ravno do stanice Gangneung**\nPolazak iz hotela **~08:15**, ~65 km autocestom, ~1 h, od vrata do perona s koferima → isti vlak u 09:36. Dobiva se ~1,5 h sna. Cijena **~60–80 000 ₩ po taksiju, 2 taksija ≈ 120–160 000 ₩** (procjena, **WIP**), naspram ~43 000 ₩ za četiri karte busa. Hotelska recepcija može naručiti taksi ili call van za četvero s koferima (pitati u petak).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "~08:00", "key": "08:00", "title": "Gangneung: taksi do stanice, doručak", "meta": ["⏱ 1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "Bus stiže na Gangneung Express/Intercity terminal → **2 taksija, ~10 min** do **KTX stanice Gangneung**. Na stanici kafići i trgovina: kimbap, sendviči, kava, voće za vlak. Ormarići postoje (3 grupe, S–XL, kod izlaza 2), ali nisu potrebni — koferi idu s vama u vlak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:36", "key": "09:36", "title": "🚄 KTX-Eum 752 → Gyeongju 12:30", "meta": ["⏱ 2 h 54 min", "☔", "🦵"], "body": "**Novi direktni vlak istočnom obalom** (vozi od 30.12.2025.) — bez presjedanja u Seoulu (stari plan: ~6 h, dva presjedanja, ~77 000 ₩). **34 300 ₩ p.p.** Svaki vlak staje u Gyeongjuu. Dio pruge ide uz more — **sjediti s lijeve strane u smjeru vožnje** (vlak ide na jug, more je istočno).\n\nDrugi vlakovi istog dana: **754: 14:56 → 17:44** · 756: 18:35 → 21:22 (satnica radnog dana, subota **WIP**).\n\nPrtljaga: veliki koferi idu na police na kraju vagona ili iza zadnjih sjedala — ući među prvima.\n\n⚠️ **Rezervacija Tajnog vrta NIJE danas** — termini za 1.11. otvaraju se **u ponedjeljak 26.10. u 10:00** (6 dana ranije; ispravljeno 9.10., vidi Dan 8).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "12:30", "key": "12:30", "title": "Stanica Gyeongju → Airbnb", "meta": ["⏱ 20–30 min", "☔", "🦵"], "body": "⚠️ **Stanica Gyeongju je ~12 km izvan grada** (Geoncheon-eup; do prosinca 2023. zvala se \"Singyeongju\" — stariji izvori koriste stari naziv). Bus 700 vozi ~4 puta dnevno, linije 60/61 svakih ~70 min → **s četvero ljudi i koferima: van ili taksi.**\n\n- **GJS Limousine call van (경주콜밴 GJS)** — **010-2657-2846 / 010-2879-2846**, fiksno **~35–45 000 ₩** za transfer sa stanice, stanu sva 4 kofera. Dogovoriti unaprijed (KakaoTalk/SMS) — **WIP** cijena.\n- **2 taksija** iz reda ispred stanice — ~15–17 000 ₩ po autu, 18–22 min, jedan veliki kofer po prtljažniku + jedan na prednje sjedalo/krilo.\n- Lokalni dispečer: 054-744-4569 (보문단지&신경주역 콜).\n\nAirbnb ima **besplatan parking — taksi do vrata** i **besplatno spremanje prtljage** → kofere ostaviti odmah, check-in od 16:00.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "Ručak: Sukyoung Sikdang", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**숙영식당**, kod Daereungwona, 5–10 min pješke. **Bibimbap s ječmom (boribap
