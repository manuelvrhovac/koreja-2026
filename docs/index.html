**Gyochon** + **kuća obitelji Choi** (*samo danas — u ponedjeljak zatvoreno*)", "altHint": false, "slot": 5}, {"time": "17:00", "key": "17:00", "text": "Odmor u Airbnbu", "altHint": false, "slot": 6}, {"time": "18:15", "key": "18:15", "text": "**Anapji** u sumrak (3 000 ₩, QR karta) → osvijetljeni **Cheomseongdae** → **most Woljeonggyo** (svijetli do 23:00)", "altHint": false, "slot": 7}, {"time": "20:00", "key": "20:00", "text": "🍢 **Noćna tržnica Jungang** — pladanj s 4 pregrade, štandovi, stolovi pod krovom · **ili** **Dosol Maeul** (set od ~15 kuhanih jela, rezervacija; onda večera u 17:30, a Anapji poslije)", "altHint": true, "slot": 8}, {"time": "22:00", "key": "22:00", "text": "**Bar Boon** — kokteli s korejskim žestokim u hanoku · **ili** **Hwangnam Geobuk** — craft pivo oko vatre", "altHint": false, "slot": 9}], "plans": [{"label": "Plan C · Gangneung", "replaces": ["06:35", "06:55", "08:00", "09:36", "12:30", "13:30", "14:30", "17:00"], "summary": "", "detail": {"title": "Plan C (malo vjerojatno) — pola dana u Gangneungu, vlak 754", "meta": [], "md": "Ako ekipa odluči ne ustajati rano a ne želi plaćati taksi: bus u **09:31** iz Sokcha → **Gangneung ~10:45**, kofere u ormariće na KTX stanici (XL, kod izlaza 2) ili Zimcarry pult (09:00–18:00, ~10 000 ₩/kofer), pa:\n- **Anmok Coffee Street** — Gangneung je neslužbena kavena prijestolnica Koreje (Terarosa i ozbiljne pržionice), kafići na samoj plaži. ~1,5–2 h.\n- **Seongyojang** — velika plemićka hanok kuća u kojoj potomci i danas žive, vrt s jezercem. 45–60 min.\n- **Gyeongpo jezero i plaža** — ravna šetnja.\n\nVlak **754: 14:56 → Gyeongju 17:44** → Airbnb ~18:15 → Anapji i noćna tržnica. **Gubi se cijelo popodne u Gyeongjuu** (humci, Gyochon, kuća Choi — a kuća Choi je u ponedjeljak zatvorena, pa tada otpada). Vidi i Dodatak C.", "alts": [], "after": ""}, "rows": null}], "leftPlans3": [], "decisions": ["d-sub-24-10-vlak", "d-sub-24-10-polazak-iz-sokcha", "d-sub-24-10-vecera", "d-sub-24-10-transfer-sa-stanice"]}, {"date": "25.10", "d3heading": "NED 25.10. — SELO, BICIKLI I ZLATNE KRUNE", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 7 od 14", "intro": "⚠️ **Najgužviji vikend korejske jeseni** — jutro u Yangdongu je bijeg od centra, a popodne ide na istočnu stranu grada, gdje je prazno.\n\n⚠️ **Ako subota nije uspjela** (propušten bus u 06:55 ili vlak 752, pa dolazak tek navečer): nedjelja preuzima dio ili cijelu subotu. **Prioritet je kuća obitelji Choi** (u ponedjeljak zatvorena), pa Daereungwon + Cheonmachong i Gyochon (2,5 h, sve pješke od Airbnba). Najlakše je skratiti **popodnevni krug biciklom** (muzej i Hwangnyongsa se mogu i u ponedjeljak navečer ili otpasti); Yangdong ostaje ujutro. Ova greška se ne vuče dalje — ponedjeljak ostaje kako je planiran.", "stay": "", "slots": [{"timeLabel": "07:45", "key": "07:45", "title": "Doručak: bife-uličica tržnice Seongdong", "meta": ["⏱ 45 min", "☔ kiša OK", "🦵 lagano"], "body": "**성동시장 한식뷔페 골목**, Seongdong tržnica, ~10 min pješke od Airbnba (preko puta stare željezničke stanice). Niz malih zalogajnica: uzmeš tanjur i sam biraš od **30+ kuhanih domaćih jela** — variva, pržena svinjetina, palačinke, tofu, kimchi, povrće — uz **neograničenu rižu i juhu**. **~8–9 000 ₩.** Oko ~07:30–20:00, **jutrom je najbolje** (sve svježe). Onako kako Korejci zapravo doručkuju; nula turista. ⚠️ Nedjeljom dio zalogajnica možda ne radi (**UV**) — uzeti onu koja radi.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "08:30", "key": "08:30", "title": "Taksi do Yangdonga", "meta": ["⏱ 20–25 min"], "body": "**2 taksija, ~22–28 000 ₩ po autu**, 16 km sjeverno. **Rezerva: bus 203** — staje kod Intercity terminala (250 m od Airbnba), ali vozi samo svakih 70–90 min, 45–55 min vožnje (**WIP** nedjeljna satnica).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:00", "key": "09:00", "title": "Yangdong Folk Village (양동마을)", "meta": ["⏱ 3 h", "🌦️ podnosi kišu", "🦵🦵 srednje (strme rampe gore)"], "body": "**4 000 ₩ · 09:00–18:00.** Selo dvaju plemićkih klanova, **Son i Yi (Yeogang)**, koji ondje žive 500+ godina. Isti UNESCO upis kao poznatiji Hahoe (Povijesna sela Koreje, 2010.), ali s više obitelji koje stvarno žive ondje, manje turističke infrastrukture i gotovo bez grupa. Na 150 ha se ljudi raspu i jesenskim vikendom. Po meni jedan od skrivenih vrhunaca putovanja.\n\n⚠️ **Kuće su privatne — gleda se samo dvorište, u kuće se ne ulazi.** Poštovati znakove i zatvorena vrata.\n\n**Kako:** prvo **ravni donji dio doline** (slamnate kuće pučana, rižina polja), pa gore do plemićkih kuća na brežuljcima — **kratke strme betonske rampe**. **Štapovi za Luciju**, posebno pri silasku. Vrijedi vidjeti: **Seobaekdang** (glavna kuća klana Son, 15. st.), **Mucheomdang** (glavna kuća klana Yi), **Hyangdan** (neobična plemićka kuća iz 16. st.) i paviljon **Gwangajeong** s pogledom na dolinu. Mali izložbeni centar na ulazu daje kontekst (15 min).", "alts": [{"title": "Oksan Seowon + Dokrakdang (옥산서원 / 독락당)", "text": "konfucijanska akademija i paviljon nad potokom u seoskoj dolini, 35 min sjeverno, bez trgovina i ljudi. Ako je Yangdong pregužvan", "meta": ["⏱ 2,5 h", "🌦️", "🦵"]}, {"title": "Gyeongju Nacionalni muzej", "text": "ujutro, ako kiši; Yangdong se seli na ponedjeljak umjesto Namsana", "meta": ["⏱ 2 h", "☔", "🦵"]}, {"title": "Namsan, donja dolina Samneung", "text": "ako treba šuma umjesto sela; inače je u ponedjeljak", "meta": ["⏱ 1,5 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "12:00", "key": "12:00", "title": "Ručak u selu", "meta": ["⏱ 1 h", "☔", "🦵 lagano"], "body": "**Yangdong Sikdang** i druge seoske kuhinje kod ulaza: **kalguksu** (rezanci rezani nožem u juhi), **gamjajeon** (palačinka od krumpira), **sanchae bibimbap** (riža s divljim planinskim biljem). Sve kuhano, jeftino.\n\n**Natrag:** taksi se u selu teško nađe preko Kakao T → **zamoliti restoran da pozove taksi** ili uhvatiti bus 203 (**WIP** satnica). ~12:45–13:00 polazak.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "13:30", "key": "13:30", "title": "🚲 Biciklom po istočnoj strani + Nacionalni muzej", "meta": ["⏱ 4 h", "☀️ treba suho", "🦵🦵 srednje (ravno, ali dugo)"], "body": "Iznajmljivači na **Poseok-ro / Taejong-ro**, kod Daereungwona: **~5–6 000 ₩/h**, e-bicikl **~10–15 000 ₩/h**. Teren je ravan: poljski putovi i biciklističke staze. ⚠️ **U Daereungwonu i Gyerimu se ne vozi** — bicikle zaključati na rubu. Oko Cheomseongdaea nedjeljom gužva → gurati bicikl; istočno prema Hwangnyongsi je prazno.\n\n**Krug (~10 km):**\n1. **Gyerim (계림)** — mala drevna šuma s ogromnim starim stablima, mjesto legende o rođenju osnivača klana Kim; zlatna i crvena krošnja. Ravne zemljane staze, 15 min.\n2. **Woljeonggyo danju** — usput, drukčiji od subotnje noći.\n3. **Gyeongju Nacionalni muzej (국립경주박물관)** — **besplatno, nedjeljom 10:00–19:00.** Prave **zlatne krune** iz humaka koje ste vidjeli u subotu, i **zvono kralja Seongdeoka (Emille)** iz 771. — 19 tona bronce, jedno od najljepših zvona na svijetu, s legendom o djetetu bačenom u talinu (otud ime \"Emille\" = \"mama\"). ~1–1,5 h. Zlatna kruna i zvono su must-see, ostalo po volji.\n4. **Polje Hwangnyongsa (황룡사지)** — temelji onoga što je bio **najveći hram u Koreji**, s drvenom pagodom od 9 katova (~80 m) koju su Mongoli spalili 1238. Ostale su samo kamene baze u ogromnom praznom polju. **Povijesna dvorana Hwangnyongsa** uz polje ima **maketu pagode u mjerilu 1:10** i film (sati i cijena **WIP**). Ovo **ne računa se u hram-budžet** — nema hrama, samo polje.\n5. **Bunhwangsa (분황사)** — odmah do polja: **pagoda od kamenih blokova isklesanih kao cigle, iz 634.**, najstarija datirana pagoda Sille. 10 min pogled, ne posjet hramu. Ulaz besplatan (od 2023., **UV**).\n6. Natrag prema gradu; usput **Hwangnam-ppang (황남빵)** — kolačići s crvenim grahom, recept iz 1939. — ili **chalboribbang** (palačinke od ječma s grahom).", "alts": [{"title": "Pješke + taksi", "text": ", ako netko ne vozi ili kiši: taksi do muzeja → taksi do Hwangnyongse → natrag. Po kiši samo **muzej** (2 h)", "meta": ["⏱ 2–3 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "17:30", "key": "17:30", "title": "Odmor", "meta": [], "body": "Bicikli natrag, tuš, pauza.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "Večera: Byeolchaeban ssambap", "meta": ["⏱ 1,5 h", "☔ kiša OK", "🦵 lagano"], "body": "**별채반 교동쌈밥**, 77 Cheomseong-ro, kod Gyochona. **Ssambap**: riža i meso umotani u listove salate, perile i kupusa, s ~20 malih priloga. Naručiti **bulgogi od hanwoo govedine (~18–20 000 ₩)** ili svinjetinu (~15–16 000 ₩). **10:00–21:00 svaki dan, zadnja narudžba 20:15.** Veliko, pouzdano, brzo se izmjenjuju stolovi — **nema rezervacije** (nedjeljom možda kratko čekanje).", "alts": [{"title": "Dosol Maeul", "text": "set od ~15 kuhanih jela u staroj kući, ~13–15 000 ₩; **rezervacija**, zadnja narudžba 19:30/20:00 → doći u 18:30", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Noćna tržnica Jungang", "text": "**ako je subota bila Dosol Maeul**: pladanj s 4 pregrade, nedjeljom radi (sri–ned)", "meta": ["⏱ 1,5 h", "☔", "🦵"]}, {"title": "Hwangnam Ssambap", "text": "druga ssambap kuća, 11:00–20:30, pauza 15:30–17:00, ~14–16 000 ₩", "meta": ["⏱ 1,5 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "20:30", "key": "20:30", "title": "Bonghwangdae", "meta": ["⏱ 20 min", "🌦️", "🦵 lagano"], "body": "**봉황대**, ~5 min od Airbnba — jedan **humak visok 22 m sa starim drvećem na vrhu**, noću osvijetljen, besplatan, **bez ograde**. Tiho, gotovo bez ljudi — najbolja \"humci noću\" točka bez gužve Daereungwona.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Bar ili Beopju u Airbnbu", "meta": ["⏱ 1–2 h", "☔", "🦵"], "body": "- **Bar Boon** (kokteli s korejskim žestokim u hanoku) ili **Hwangnam Geobuk** (pivo oko vatre) — ako nije bilo u subotu.\n- **Ili** boca **Gyodong Beopju** kupljena u subotu u Gyochonu — u Airbnbu, zadnja mirna večer prije ranog Bulguksa.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Subota nije uspjela →** kuća Choi + Daereungwon + Gyochon popodne, bicikli skraćeni ili otpadaju (vidi gore)\n- **Kiša →** Yangdong podnosi laganu kišu; popodne samo muzej (+ povijesna dvorana Hwangnyongsa) taksijem\n- **Jaka kiša cijeli dan →** muzej ujutro, Yangdong u ponedjeljak umjesto Namsana\n- **Yangdong pregužvan →** Oksan Seowon + Dokrakdang\n- **Umor →** Yangdong pa samo muzej; bicikli otpadaju\n- **Byeolchaeban red →** Hwangnam Ssambap ili noćna tržnica", "heading": "Ned 25.10. — Selo, bicikli i zlatne krune", "city": "gyeongju", "transfer": "", "flash": null, "rows": [{"time": "07:45", "key": "07:45", "text": "Doručak: **Seongdong tržnica, bife-uličica** — 30+ kuhanih domaćih jela, neograničena riža, ~8–9 000 ₩", "altHint": false, "slot": 0}, {"time": "08:30", "key": "08:30", "text": "2 taksija do Yangdonga (~20–25 min, 22–28 000 ₩ po autu) · *ili bus 203*", "altHint": false, "slot": 1}, {"time": "09:00", "key": "09:00", "text": "**Yangdong Folk Village** — UNESCO selo dvaju klanova u kojem ljudi stvarno žive, 4 000 ₩ · štapovi za rampe", "altHint": true, "slot": 2}, {"time": "12:00", "key": "12:00", "text": "Ručak u selu: **Yangdong Sikdang** — kalguksu, gamjajeon, bibimbap od divljeg bilja", "altHint": false, "slot": 3}, {"time": "13:30", "key": "13:30", "text": "🚲 **Bicikli, istočna strana:** Gyerim → Woljeonggyo danju → **Nacionalni muzej** (zlatne krune, Emille zvono, ned. do 19:00) → **polje Hwangnyongsa** + makete pagode → **Bunhwangsa** · *kiša → samo muzej*", "altHint": true, "slot": 4}, {"time": "17:30", "key": "17:30", "text": "Bicikli natrag, odmor", "altHint": false, "slot": 5}, {"time": "19:00", "key": "19:00", "text": "**Byeolchaeban** — ssambap: bulgogi i riža u listovima salate, ~20 priloga · **ili** **Dosol Maeul** (rezervacija) · *ako je subota bila Dosol → noćna tržnica*", "altHint": false, "slot": 6}, {"time": "20:30", "key": "20:30", "text": "**Bonghwangdae** — osvijetljeni humak s drvećem na vrhu, 5 min od Airbnba", "altHint": false, "slot": 7}, {"time": "21:00", "key": "21:00", "text": "**Bar Boon / Hwangnam Geobuk** ako nije bilo u subotu · **ili** Gyodong Beopju u Airbnbu", "altHint": false, "slot": 8}], "plans": [], "leftPlans3": [], "decisions": []}, {"date": "26.10", "d3heading": "PON 26.10. — BULGUKSA, SEOKGURAM, NAMSAN", "night": "Noćenje: Gyeongju, Airbnb (Noseo-dong) · Dan 8 od 14", "intro": "⏰ **ODLUKA ZA EKIPU (do ~15.10.):** zadnja večer 💸 **Yosukgung 1779** (plan) ili Jeongsugaseong → **rezervirati Yosukgung** (telefon / CatchTable). ⏰ **U 10:00 — rezervacija Tajnog vrta za 1.11.** (vidi dolje).\n\nBulguksa i Seokguram su vikendom krcati — ponedjeljak je puno mirniji. ⚠️ **Ponedjeljkom mnogi obiteljski restorani ne rade** — sva mjesta za jelo u ovom danu su provjereno otvorena ponedjeljkom (**UV**). Kuća obitelji Choi danas je zatvorena (zadnji ponedjeljak u mjesecu) — zato je bila u subotu.", "stay": "", "slots": [{"timeLabel": "08:15", "key": "08:15", "title": "Do Bulgukse", "meta": [], "body": "**Taksi ~20 min** (~13 km, **WIP** ~15–18 000 ₩ po autu). Rezerva: **bus 10 ili 11** sa stanice preko puta Intercity terminala (~30–40 min).", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "09:00", "key": "09:00", "title": "Bulguksa (불국사)", "meta": ["⏱ 1,5–2 h", "🌦️ podnosi kišu", "🦵🦵 srednje (stepenice, ali kratke)"], "body": "**Besplatno** (od svibnja 2023.) · ponedjeljkom **09:00–18:00**, zadnji ulaz 17:30 · UNESCO.\n\nSagrađen **528. godine**, današnji oblik iz 751.; obnavljan kroz stoljeća (Japanci su ga spalili 1593.). Po budističkoj ideji je \"zemlja Bude\" na zemlji — kameni temelji i mostovi-stepenice (Cheongungyo i Baegungyo) su originalni iz 8. st. Dvije pagode u dvorištu glavne dvorane: **Seokgatap** (jednostavna, savršenih proporcija) i **Dabotap** (kitnjasta, kao isklesana čipka) — remek-djela klesarstva Sille, Dabotap je na kovanici od 10 wona.\n\n⚠️ **Javorova prilazna cesta je dio doživljaja** — lokalni vrhunac boja ~22.10.–3.11., dakle točno sada. **Hodati je od parkirališta, ne taksirati do vrata.**\n⏰ **Doći na otvaranje** — turistički autobusi stižu ~10:30.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "⏰ 10:00 KST", "key": "10:00", "title": "REZERVACIJA TAJNOG VRTA (za ned 1.11.)", "meta": [], "body": "**Usred Bulguksa: stati, telefon, alarm.** (Mobilni podaci / eSIM.)\n\nOnline termini za Changdeokgung **Huwon (Tajni vrt)** otvaraju se **točno u 10:00 KST, 6 dana prije posjeta** → za nedjelju 1.11. to je **danas, pon 26.10.** U jesen nestanu u minutama. Stranica **ticket.cdg.go.kr**; korejsko sučelje, engleski tek na pod-stranici; e-mail verifikacija umjesto korejskog broja. **Dvoje pokušava paralelno.** 5 000 ₩ vrt + 3 000 ₩ palača. Rezervirati **engleski termin** (10:30 / 11:30 / 14:30 / 15:30 — **WIP**) ili korejski s audio-vodičem.\n\n**Rezerva:** online ide samo dio kapaciteta — **otprilike pola karata prodaje se na licu mjesta istog dana od 09:00** (u jesen možda i više). Ako online ne uspije → 1.11. na blagajni u ~08:30.\n\n*Ispravljeno 9.10.: ranije je ovdje pisalo sub 24.10. — pogrešno računanje (1.11. − 6 dana = 26.10.).*", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "10:40", "key": "10:40", "title": "Seokguram (석굴암)", "meta": ["⏱ 1 h gore", "🌦️ podnosi kišu", "🦵 lagano (od parkirališta ~600 m blagom stazom)"], "body": "**Besplatno** · 09:00–17:30 · UNESCO (zajedno s Bulguksom).\n\nGranitni **Buda iz 8. stoljeća** u umjetnoj špilji-kupoli od granitnih blokova, okrenut prema Istočnom moru — smatra se jednim od najvećih umjetničkih dostignuća Azije. ⚠️ Iza stakla, **bez fotografiranja unutra**, posjet je kratak (10–15 min) — vrijednost je u samoj figuri i šumi oko nje. Od parkirališta do špilje ~600 m šumskom stazom.\n\n**Gore:** **bus 12** s Bulguksa autobusnog platoa — **08:40, 09:40, 10:40, 11:40, 12:50, 13:40, 14:40, 15:40, 16:40** (15–20 min; **WIP** satnica 2026.) · ili **taksi 10–12 000 ₩**.\n\n**Dolje — ⚠️ odluka na vrhu, prema Lucijinu koljenu:**\n- **Šumska staza do Bulgukse: 2,2 km, ~300 m spusta**, kamene stepenice, korijenje, drvene stepenice, **45–55 min**. Lijepa jesenja šuma — ali **spust je točno ono što koljeno ne voli.** Samo sa štapovima i ako koljeno nakon Ulsanbawija dobro stoji.\n- **Bus 12 dolje:** **11:00, 12:00, 13:05**, … ili **taksi** (pozvati Kakao T s parkirališta).\n- **Ne razdvajati se** — ili svi stazom, ili svi busom.", "alts": [{"title": "Preskočiti Seokguram", "text": "ako je hramova dosta; Bulguksa ostaje, dobije se ~1,5 h za Namsan ili odmor", "meta": ["⏱ —", "—", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "12:45", "key": "12:45", "title": "Ručak: Busan Sikdang", "meta": ["⏱ 1 h", "☔ kiša OK", "🦵 lagano"], "body": "**부산식당 경주불국사본점**, Jinhyeon-dong, **~400 m ispod autobusnog platoa Bulgukse**. **07:30/08:00–18:00, otvoreno ponedjeljkom.** Set ~**15 000 ₩**: **doenjang-jjigae s goveđim prsima** (varivo od fermentirane soje), **tteokgalbi** (pečena pljeskavica od mljevenih rebara) i pečena riba, uz priloge. Ime je \"Busan\", ali je gyeongjuski klasik.", "alts": [{"title": "Neulbom (늘봄)", "text": "na cesti Bulguksa–Bomun, 09:00–21:00, otvoreno ponedjeljkom: riža u kamenoj posudi (dolsotbap), bulgogi od hanwooa, galbijjim (pirjana rebra)", "meta": ["⏱ 1 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "14:15", "key": "14:15", "title": "Niži Namsan: dolina Samneung", "meta": ["⏱ 2 h s taksijem", "🌦️ podnosi laganu kišu (zemlja, ne kamen)", "🦵🦵 srednje (blagi uspon, isti put natrag)"], "body": "**Besplatno, otvoreno ponedjeljkom.** **Taksi s Bulgukse ~16–19 000 ₩, 18–22 min** do posjetiteljskog centra **Seonamsan (Bae-dong)**.\n\nNamsan je planina južno od grada prekrivena isklesanim kamenim Budama, pagodama i ostacima isposnica iz doba Sille — \"muzej bez krova\". **Ne ide se na vrh.** Ruta za koljeno:\n1. **Borova šuma Samneung** — iskrivljeni crveni borovi i **tri kraljevske grobnice** (삼릉, \"tri humka\") — jedno od najfotografiranijih mjesta Gyeongjua, posebno u jutarnjoj ili popodnevnoj svjetlosti.\n2. Mali most → blagih **400 m** do **Bude bez glave** (sjedeći kameni Buda kojem je glava odlomljena — tijelo i halja su prekrasno sačuvani).\n3. Još **300 m** do platforme sa **šest Buda uklesanih u stijenu (선각육존불)** — likovi su urezani u lice stijene kao crtež.\n4. **Okret natrag** istim putem.\n\n**2,4 km, 60–75 min**, utabana zemlja. ❌ **Više rute (Geumobong, Chilburam) su penjanje po stijenama** — ne.", "alts": [{"title": "Gyeongju Nacionalni muzej", "text": "kišna zamjena, ako nije bio u nedjelju (ponedjeljkom otvoren, 10:00–18:00)", "meta": ["⏱ 2 h", "☔", "🦵"]}, {"title": "Yangdong", "text": "ako je pomaknut s nedjelje", "meta": ["⏱ 3 h", "🌦️", "🦵🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "16:00", "key": "16:00", "title": "Opcija: Seochulji (서출지)", "meta": ["⏱ 30–45 min", "🌦️", "🦵 lagano"], "body": "Jezerce s lotosima i vrbama, **paviljon Igyojeong iz 17. st.** nad vodom, voćnjaci okolo — selo Namsan, **12 min** od Hwangnidan-gila / blizu Samneunga. Mirno, nitko ne dolazi. Uz legendu o kralju i gavranu iz 5. st. Ako ima energije poslije Namsana; inače ravno u Airbnb.", "alts": [], "altNotes": [], "after": ""}, {"timeLabel": "19:00", "key": "19:00", "title": "💸 Yosukgung 1779 (요석궁 1779)", "meta": ["⏱ 2 h", "☔ kiša OK", "🦵 lagano (⚠️ moguće sjedenje na podu — WIP)"], "body": "**Gyo-dong (Gyochon)**, u povijesnom imanju **klana Choi** — iste obitelji čiju ste kuću vidjeli u subotu. Kuhinja po **receptima plemićkih obitelji**: dugo kuhane juhe, fino rezano povrće, jela koja se nose u slijedu (hanjeongsik u plemićkom stilu). **~70–120 000+ ₩ po osobi**, **rezervacija obavezna** (telefon / CatchTable), **otvoreno ponedjeljkom**. Prirodna \"zadnja večer u staroj prijestolnici\" — treći splurge putovanja.\n\n⚠️ **WIP:** pitati pri rezervaciji **sjedi li se na podu ili za stolom** (Lucijino koljeno) i što sve dolazi u setu (izbjeći sirovo — reći \"no raw fish or meat\").", "alts": [{"title": "Jeongsugaseong (정수가성)", "text": "Hadong, **10:00–21:00 svaki dan, otvoreno ponedjeljkom**. Set-meniji **25–45 000 ₩**: **gulbi** (soljeni, sušeni žuti grabljivac na ječmu — slavna korejska delicija, peče se), **galbijjim** (pirjana kratka rebra), **riža kuhana u listu lotosa**. Isti stil, upola cijene", "meta": ["⏱ 1,5–2 h", "☔", "🦵"]}], "altNotes": [], "after": ""}, {"timeLabel": "21:00", "key": "21:00", "title": "Woljeonggyo noću ili Bar Boon", "meta": ["⏱ 1 h", "🌦️", "🦵 lagano"], "body": "Yosukgung je u Gyochonu — **most Woljeonggyo je 5 min pješke**, osvijetljen do 23:00. Ili zadnje piće u **Bar Boonu** / ostatak **Gyodong Beopjua** u Airbnbu. **Spakirati kofere** — sutra check-out u 11:00 i Busan.", "alts": [], "altNotes": [], "after": ""}], "info": [], "triggers": "- **Propušten alarm u 10:00 / sve rasprodano →** 1.11. na blagajni u ~08:30 (karte na licu mjesta od 09:00) ili palača bez vrta + Changgyeonggung\n- **Koljeno →** Seokguram busom i dolje; Namsan samo do Bude bez glave (800 m) ili otpada\n- **Dosta hramova →** izbaciti Seokguram, duže na Namsanu ili Seochulji\n- **Kiša →** Bulguksa i Seokguram podnose kišu; Namsan → Nacionalni muzej\n- **Yangdong pomaknut s nedjelje →** ide umjesto Namsana\n- **Yosukgung nema mjesta →** Jeongsugaseong\n- **Dosta Gyeongjua →** raniji polazak u Busan sutra", "heading": "Pon 26.10. — Hramovi, Namsan i plemićka večera", "city": "gyeongju", "transfer": "", "flash": null, "rows": [{"time": "08:15", "key": "08:15", "text": "Taksi do Bulgukse (~20 min) · *ili bus 10/11 preko puta terminala*", "altHint": false, "slot": 0}, {"time": "09:00", "key": "09:00", "text": "**Bulguksa** na otvaranju, **besplatno** · ⏰ **u 10:00: rezervacija Tajnog vrta za 1.11.** — javorova prilazna cesta, pagode Dabotap i Seokgatap · prije turističkih autobusa (~10:30)", "altHint": false, "slot": 1}, {"time": "10:00 KST", "key": "10:00", "text": "**REZERVACIJA TAJNOG VRTA (za ned 1.11.)**", "altHint": false, "slot": 2, "d3only": tr
